<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="referrer" content="no-referrer" />
<title>Create your account — Stock Req</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="shared.css" />
<style>
  body{ min-height:100vh; }
  #join-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; position:relative; z-index:1; }
  .join-wrap{ width:100%; max-width:420px; }
  .join-brand{ text-align:center; margin-bottom:18px; }
  .join-brand img{ max-height:80px; max-width:240px; display:none; margin:0 auto 12px; }
  .join-brand .name{ font-size:24px; font-weight:800; color:var(--navy); }
  .join-brand .sub{ font-size:12px; font-weight:600; color:var(--text-dim); letter-spacing:.06em; text-transform:uppercase; margin-top:4px; }
  .join-wrap .card{ background:rgba(255,255,255,.92); border-top:4px solid var(--teal); box-shadow:0 20px 50px rgba(26,39,68,.14); }
  .join-wrap .card h2{ margin-top:0; }
  .access-box{ background:var(--teal-pale); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:13px; margin:10px 0 14px; }
  .idbox{ background:var(--teal-pale); border:1px solid var(--border); border-radius:8px; padding:12px; text-align:center; margin:12px 0 16px; }
  .idbox .big{ font-size:22px; font-weight:800; color:var(--navy); margin-top:2px; }
  .join-wrap button.btn{ width:100%; padding:12px; }
</style>
</head>
<body>
<div id="join-screen">
  <div class="join-wrap">
    <div class="join-brand">
      <img id="join-logo" alt="" />
      <div class="name">Stock Req</div>
      <div class="sub">by ED&amp;G&trade;</div>
    </div>

    <div class="card" id="loadingCard"><p class="muted" style="margin:0;">Checking your invitation&hellip;</p></div>

    <div class="card" id="badCard" style="display:none;">
      <h2>Invitation not available</h2>
      <p id="badMsg" class="login-error" style="min-height:0;"></p>
      <p class="muted">If you already created your account, <a href="login.html" style="color:var(--teal);">sign in here</a>.</p>
    </div>

    <div class="card" id="formCard" style="display:none;">
      <h2>Create your account</h2>
      <p class="muted" id="intro" style="margin-top:0;"></p>
      <div class="access-box" id="accessBox"></div>
      <div class="login-error" id="msg"></div>
      <form id="form" autocomplete="off">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" required maxlength="60" autocomplete="given-name" />
        <label for="lastName">Last name</label>
        <input type="text" id="lastName" required maxlength="60" autocomplete="family-name" />
        <p class="muted" id="idPreview" style="margin:6px 0 0; font-size:12px;"></p>
        <label for="pw1">Choose a password (at least 12 characters)</label>
        <input type="password" id="pw1" required minlength="12" autocomplete="new-password" />
        <label for="pw2">Confirm password</label>
        <input type="password" id="pw2" required minlength="12" autocomplete="new-password" />
        <div style="margin-top:18px;"><button type="submit" class="btn magenta" id="btn">Create my account</button></div>
      </form>
    </div>

    <div class="card" id="doneCard" style="display:none;">
      <h2>You&rsquo;re all set</h2>
      <p>Your account has been created. You sign in with your <strong>User ID</strong> and the password you just chose.</p>
      <div class="idbox"><div class="muted">Your User ID</div><div class="big" id="doneUserId"></div></div>
      <button type="button" class="btn magenta" id="goBtn">Continue</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>
<script src="vendor/supabase.js"></script>
<script src="shared.js"></script>
<script>
// The token travels in the URL fragment, which browsers never send to a
// server or in a Referer header.
const TOKEN = (new URLSearchParams(window.location.hash.replace(/^#/, '')).get('t') || '').trim();
let SIGNED_IN = false;

function show(id) {
  ['loadingCard', 'badCard', 'formCard', 'doneCard'].forEach(c => { document.getElementById(c).style.display = c === id ? '' : 'none'; });
}
async function call(payload) {
  const res = await fetch(`${FN_BASE}/complete-invitation`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_PUBLISHABLE_KEY },
    body: JSON.stringify({ token: TOKEN, ...payload }),
  });
  let json = {};
  try { json = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(json.error || 'Something went wrong — please try again.');
  return json;
}
function clean(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function updatePreview() {
  const f = clean(document.getElementById('firstName').value), l = clean(document.getElementById('lastName').value);
  document.getElementById('idPreview').textContent = f && l
    ? `Your User ID will be ${f}.${l} (a number is added if it is already taken).`
    : 'Your User ID is created from your name.';
}
['firstName', 'lastName'].forEach(id => document.getElementById(id).addEventListener('input', updatePreview));

// Trust logo (same one shown on the sign-in page), if a Developer has set one.
try {
  const cached = localStorage.getItem('login_logo_cache');
  if (cached) { const i = document.getElementById('join-logo'); i.src = cached; i.style.display = 'block'; }
} catch (e) {}

sb.from('system_settings').select('value').eq('key', 'login_logo_data_url').maybeSingle().then(({ data }) => {
  const v = data && data.value;
  if (v) { const i = document.getElementById('join-logo'); i.src = v; i.style.display = 'block'; }
});

(async () => {
  if (!TOKEN) {
    document.getElementById('badMsg').textContent = 'This page needs the personal link from your invitation email.';
    return show('badCard');
  }
  try {
    const r = await call({ action: 'lookup' });
    document.getElementById('intro').textContent = `You've been invited to Stock Req as a ${r.role_label}. Enter your name and choose a password — your access has already been set up for you.`;
    const wardsLine = r.ward_names && r.ward_names.length
      ? `<b>Wards:</b> ${r.ward_names.map(esc).join(', ')}`
      : `<b>Wards:</b> none assigned yet`;
    document.getElementById('accessBox').innerHTML = `<b>Title:</b> ${esc(r.role_label)}<br>${wardsLine}`;
    updatePreview();
    show('formCard');
  } catch (err) {
    document.getElementById('badMsg').textContent = err.message;
    show('badCard');
  }
})();

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg'), btn = document.getElementById('btn');
  msg.textContent = '';
  const pw1 = document.getElementById('pw1').value, pw2 = document.getElementById('pw2').value;
  if (pw1 !== pw2) { msg.textContent = 'The two passwords do not match.'; return; }
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const r = await call({
      action: 'complete',
      first_name: document.getElementById('firstName').value.trim(),
      last_name: document.getElementById('lastName').value.trim(),
      password: pw1,
    });
    document.getElementById('doneUserId').textContent = r.user_id;
    if (r.access_token && r.refresh_token) {
      const { error } = await sb.auth.setSession({ access_token: r.access_token, refresh_token: r.refresh_token });
      SIGNED_IN = !error;
    }
    document.getElementById('pw1').value = ''; document.getElementById('pw2').value = '';
    show('doneCard');
  } catch (err) {
    msg.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Create my account';
  }
});
document.getElementById('goBtn').onclick = () => { window.location.href = SIGNED_IN ? 'home.html' : 'login.html'; };
</script>
</body>
</html>
