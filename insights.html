<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StockFlow™ — Insights</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="shared.css" />
<script src="vendor/chart.umd.min.js"></script>
</head>
<body data-page="insights.html">
<div id="app">
<header class="topbar">
    <div class="brand">
      
      <div>
        <div class="name">StockFlow™</div>
        <div class="sub" data-ward-context></div>
      </div>
    </div>
    <div class="who">
      <span data-who-name></span>
      <button class="logout" data-logout>Log out</button>
    </div>
  </header>
  <div id="banner-root"></div>
  <div id="page-nav" class="tabs"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="shared.js"></script>
<script>
let insTimer = null;
async function refreshInsights() {
  const d = await loadDailySnapshotData();
  const total = d.pendingCount + d.actionedCount;
  const pct = total ? Math.round(d.actionedCount / total * 100) : 0;
  document.getElementById('ins-body').innerHTML = `
    <div class="row">
      <div class="card" style="flex:1; text-align:center;">
        <div class="muted" style="font-size:12px; text-transform:uppercase; letter-spacing:.04em;">Orders due today</div>
        <div style="font-size:48px; font-weight:700; color:var(--navy); margin-top:6px;">${total}</div>
        <div class="muted" style="margin-top:4px;">${d.pendingCount} still to process</div>
      </div>
      <div class="card" style="flex:1; text-align:center;">
        <div class="muted" style="font-size:12px; text-transform:uppercase; letter-spacing:.04em;">Processed</div>
        <div style="font-size:48px; font-weight:700; color:var(--teal-deep); margin-top:6px;">${total ? pct + '%' : '\u2014'}</div>
        <div class="muted" style="margin-top:4px;">${d.actionedCount} of ${total} actioned</div>
      </div>
    </div>
    <div class="card">
      <div style="height:14px; border-radius:7px; background:var(--border-soft); overflow:hidden;"><div style="height:100%; width:${pct}%; background:var(--teal); transition:width .4s;"></div></div>
      <p class="muted" style="margin:10px 0 0; font-size:12px;">Live \u2014 refreshes every 2 minutes. Orders placed after the cut-off count towards the next working day.</p>
    </div>`;
}
(async () => {
  const p = await requireAuth({ require: () => insightsEnabled() && canViewDashboard() });
  if (!p) return;
  document.getElementById('main').innerHTML = '<div id="ins-body"></div>';
  await refreshInsights();
  insTimer = setInterval(refreshInsights, 120000);
})();
</script>
</body>
</html>
