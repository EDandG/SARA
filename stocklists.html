<script>let catalog = [];
let builderSnapshotAtParse = null;
let builderState = {}; // medicine_name -> { checked, max_qty }

// A stable string representing the exact state of a ward's stocklist
// (which drugs, at what max qty) — order-independent, so it only
// changes when the actual content does.
function stocklistFingerprint(items) {
  return items.map(i => `${i.medicine_name}::${i.min_qty ?? ''}::${i.max_qty}`).sort().join('|');
}

let builderSections = [];        // [{id,name}]
let builderTags = {};            // medicine_name -> [section ids]
let builderChip = 'all';         // 'all' | 'none' | section id
let builderView = 'all';         // 'all' | 'on' | 'off'

async function loadBuilder(ward_id) {
  const [{ data: current }, { data: secs }, { data: links }] = await Promise.all([
    sb.from('blist_items').select('medicine_name, min_qty, max_qty').eq('ward_id', ward_id),
    sb.from('drug_sections').select('id, name').order('name'),
    sb.from('drug_catalog_sections').select('drug_catalog_id, section_id'),
  ]);
  builderSnapshotAtParse = stocklistFingerprint(current || []);
  const currentByName = Object.fromEntries((current || []).map(i => [i.medicine_name, i]));
  builderSections = secs || [];
  const nameById = Object.fromEntries(catalog.map(c => [c.id, c.medicine_name]));
  builderTags = {};
  (links || []).forEach(l => { const n = nameById[l.drug_catalog_id]; if (n) (builderTags[n] ??= []).push(l.section_id); });
  builderState = {};
  catalog.forEach(c => {
    const existing = currentByName[c.medicine_name];
    builderState[c.medicine_name] = { checked: !!existing, min_qty: existing?.min_qty ?? '', max_qty: existing?.max_qty ?? 1 };
  });
  builderChip = 'all'; builderView = 'all';
  const copySel = document.getElementById('builder-copy-ward');
  if (copySel) copySel.innerHTML = '<option value="">Copy from another ward…</option>' + wards.filter(w => w.id !== ward_id).map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('');
  renderBuilderList();
}

function builderVisible() {
  const search = (document.getElementById('builder-search')?.value || '').trim().toLowerCase();
  return catalog.filter(c => {
    const st = builderState[c.medicine_name];
    if (c.hidden && !st?.checked) return false;
    if (search && !c.medicine_name.toLowerCase().includes(search)) return false;
    if (builderView === 'on' && !st.checked) return false;
    if (builderView === 'off' && st.checked) return false;
    const tags = builderTags[c.medicine_name] || [];
    if (builderChip === 'none') return !tags.length;
    if (builderChip !== 'all') return tags.includes(builderChip);
    return true;
  });
}

function renderBuilderList() {
  const el = document.getElementById('builder-list');
  const prevScroll = el.querySelector('[data-bld-scroll]')?.scrollTop || 0;
  if (!catalog.length) { el.innerHTML = `<div class="empty">The drug catalog is empty — a developer needs to add drugs there first.</div>`; return; }
  const total = catalog.filter(c => !c.hidden || builderState[c.medicine_name]?.checked).length;
  const ticked = Object.values(builderState).filter(x => x.checked).length;
  const visible = builderVisible();
  // group the visible drugs under their classes (a drug in two classes appears under both)
  const groups = [];
  const secName = Object.fromEntries(builderSections.map(x => [x.id, x.name]));
  const byGroup = new Map();
  visible.forEach(c => {
    const tags = (builderTags[c.medicine_name] || []).filter(t => builderChip === 'all' || builderChip === 'none' || t === builderChip);
    (tags.length ? tags : ['__none']).forEach(t => { if (!byGroup.has(t)) byGroup.set(t, []); byGroup.get(t).push(c); });
  });
  builderSections.forEach(x => { if (byGroup.has(x.id)) groups.push([x.id, x.name, byGroup.get(x.id)]); });
  if (byGroup.has('__none')) groups.push(['__none', builderSections.length ? 'No class' : 'All drugs', byGroup.get('__none')]);
  const chip = (id, label, n) => `<button class="btn small ${builderChip === id ? 'magenta' : 'ghost'}" data-chip="${id}">${esc(label)}${n != null ? ` <span style="opacity:.75;">${n}</span>` : ''}</button>`;
  const cnt = (id) => catalog.filter(c => (!c.hidden || builderState[c.medicine_name]?.checked) && (id === 'none' ? !(builderTags[c.medicine_name] || []).length : (builderTags[c.medicine_name] || []).includes(id))).length;
  const view = (id, label) => `<button class="btn small ${builderView === id ? 'magenta' : 'ghost'}" data-view="${id}">${label}</button>`;
  el.innerHTML = `
    <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
      ${chip('all', 'All', total)}${builderSections.map(x => chip(x.id, x.name, cnt(x.id))).join('')}${builderSections.length ? chip('none', 'No class', cnt('none')) : ''}
      <span style="flex:1;"></span>
      ${view('all', 'All')}${view('on', 'Ticked')}${view('off', 'Not ticked')}
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; padding:8px 10px; background:var(--bg-soft, #f4f6fa); border-radius:8px;">
      <b style="font-size:13px;">${ticked} of ${total} ticked</b>
      <span class="muted" style="font-size:12.5px;">${visible.length} shown</span>
      <span style="flex:1;"></span>
      <button class="btn small ghost" id="bld-tick-shown">Tick all shown</button>
      <button class="btn small ghost" id="bld-untick-shown">Untick all shown</button>
      <span class="muted" style="font-size:12.5px;">Set for ticked &amp; shown:</span>
      <input type="number" min="0" id="bld-bulk-min" placeholder="Min" style="width:64px; text-align:center;" />
      <input type="number" min="1" id="bld-bulk-max" placeholder="Max" style="width:64px; text-align:center;" />
      <button class="btn small ghost" id="bld-apply">Apply</button>
    </div>
    <div data-bld-scroll style="max-height:460px; overflow-y:auto; border:1px solid var(--border); border-radius:8px;">
    <table><thead><tr><th style="width:36px;"></th><th>Drug</th><th class="muted">Pack size</th><th style="width:100px;">Min qty</th><th style="width:100px;">Max qty</th></tr></thead><tbody>
    ${groups.map(([gid, gname, list]) => {
      const on = list.filter(c => builderState[c.medicine_name].checked).length;
      return `<tr class="bld-group"><td colspan="5" style="background:var(--bg-soft, #eef2f7); font-weight:700; padding:7px 10px;">${esc(gname)} <span class="muted" style="font-weight:400;">— ${on} of ${list.length} ticked</span>
        <span style="float:right;"><button class="btn small ghost" data-grp-on="${gid}">Tick all</button> <button class="btn small ghost" data-grp-off="${gid}">Untick all</button></span></td></tr>` +
      list.map(c => {
        const st = builderState[c.medicine_name];
        return `<tr>
        <td><input type="checkbox" class="builder-cb" data-name="${esc(c.medicine_name)}" ${st.checked ? 'checked' : ''} /></td>
        <td>${esc(c.medicine_name)}</td>
        <td class="muted">${esc(c.pack_size || '—')}</td>
        <td><input type="number" min="0" class="builder-minqty" data-name="${esc(c.medicine_name)}" value="${st.min_qty}" placeholder="—" ${st.checked ? '' : 'disabled'} style="width:60px; text-align:center; border:1px solid var(--border); border-radius:6px; padding:4px 0;" /></td>
        <td><input type="number" min="1" class="builder-qty" data-name="${esc(c.medicine_name)}" value="${st.max_qty}" ${st.checked ? '' : 'disabled'} style="width:60px; text-align:center; border:1px solid var(--border); border-radius:6px; padding:4px 0;" /></td>
      </tr>`; }).join('');
    }).join('')}
    </tbody></table>
    ${!visible.length ? '<div class="empty">No drugs match.</div>' : ''}
  </div>`;

  const sc = el.querySelector('[data-bld-scroll]'); if (sc) sc.scrollTop = prevScroll;
  const redraw = () => renderBuilderList();
  el.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { builderChip = b.dataset.chip; redraw(); });
  el.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { builderView = b.dataset.view; redraw(); });
  const groupNames = (gid) => (byGroup.get(gid) || []).map(c => c.medicine_name);
  el.querySelectorAll('[data-grp-on]').forEach(b => b.onclick = () => { groupNames(b.dataset.grpOn).forEach(n => builderState[n].checked = true); redraw(); });
  el.querySelectorAll('[data-grp-off]').forEach(b => b.onclick = () => { groupNames(b.dataset.grpOff).forEach(n => builderState[n].checked = false); redraw(); });
  document.getElementById('bld-tick-shown').onclick = () => { visible.forEach(c => builderState[c.medicine_name].checked = true); redraw(); };
  document.getElementById('bld-untick-shown').onclick = () => { visible.forEach(c => builderState[c.medicine_name].checked = false); redraw(); };
  document.getElementById('bld-apply').onclick = () => {
    const mn = document.getElementById('bld-bulk-min').value.trim(), mx = document.getElementById('bld-bulk-max').value.trim();
    if (mn === '' && mx === '') return toast('Enter a min and/or max to apply.', true);
    if (mn !== '' && mx !== '' && parseInt(mn, 10) > parseInt(mx, 10)) return toast('Min can’t be above max.', true);
    visible.filter(c => builderState[c.medicine_name].checked).forEach(c => {
      const st = builderState[c.medicine_name];
      if (mn !== '') st.min_qty = Math.max(0, parseInt(mn, 10) || 0);
      if (mx !== '') st.max_qty = Math.max(1, parseInt(mx, 10) || 1);
    });
    redraw();
  };
  el.querySelectorAll('.builder-cb').forEach(cb => cb.onchange = () => {
    builderState[cb.dataset.name].checked = cb.checked;
    redraw();
  });
  el.querySelectorAll('.builder-minqty').forEach(inp => inp.oninput = () => {
    const v = inp.value.trim();
    builderState[inp.dataset.name].min_qty = v === '' ? '' : Math.max(0, parseInt(v, 10) || 0);
  });
  el.querySelectorAll('.builder-qty').forEach(inp => inp.oninput = () => {
    builderState[inp.dataset.name].max_qty = Math.max(1, parseInt(inp.value, 10) || 1);
  });
}

async function copyBuilderFromWard(otherId) {
  if (!otherId) return;
  const { data: rows, error } = await sb.from('blist_items').select('medicine_name, min_qty, max_qty').eq('ward_id', otherId);
  if (error) return toast(error.message, true);
  if (!rows?.length) return toast('That ward has no stocklist to copy.', true);
  Object.values(builderState).forEach(st => { st.checked = false; });
  let n = 0;
  rows.forEach(r => { const st = builderState[r.medicine_name]; if (st) { st.checked = true; st.min_qty = r.min_qty ?? ''; st.max_qty = r.max_qty; n++; } });
  renderBuilderList();
  toast(`Copied ${n} drug${n === 1 ? '' : 's'} — review, then publish to apply.`);
}

async function publishFromBuilder() {
  const ward_id = document.getElementById('stock-ward').value;
  if (!ward_id) return toast('Select a ward first.', true);

  // The ward's stocklist may have changed since this builder was
  // opened (someone else quick-added a drug, adjusted a max qty, or
  // an "add across every ward" reached this ward) — publishing is a
  // full replace, so it would silently discard that without this check.
  const { data: nowRows, error: checkErr } = await sb.from('blist_items').select('medicine_name, min_qty, max_qty').eq('ward_id', ward_id);
  if (checkErr) return toast(checkErr.message, true);
  if (stocklistFingerprint(nowRows || []) !== builderSnapshotAtParse) {
    toast('This ward\u2019s stocklist has changed since you opened the builder \u2014 publishing now would overwrite that. Reload the builder and try again.', true);
    return;
  }

  const toPublish = Object.entries(builderState).filter(([, st]) => st.checked)
    .map(([medicine_name, st]) => ({ medicine_name, min_qty: st.min_qty === '' ? null : st.min_qty, max_qty: st.max_qty }));
  if (!toPublish.length) return toast('Tick at least one drug.', true);
  const badRow = toPublish.find(r => r.min_qty !== null && r.min_qty > r.max_qty);
  if (badRow) return toast(`${badRow.medicine_name}: min qty can\u2019t be greater than max qty.`, true);

  const wardName = wards.find(w => w.id === ward_id)?.name || '';
  confirmChange({
    scope: 'ward', wardName,
    title: `Replace ${wardName || 'this ward'}\u2019s whole stocklist with ${toPublish.length} drug${toPublish.length === 1 ? '' : 's'}`,
    details: 'Anything not ticked in the builder will be removed from this ward\u2019s stocklist.',
    confirmLabel: 'Publish stocklist',
    onConfirm: async () => {
      const { error: delErr } = await sb.from('blist_items').delete().eq('ward_id', ward_id);
      if (delErr) return toast(delErr.message, true);
      const { error: insErr } = await sb.from('blist_items').insert(toPublish.map(({ medicine_name, min_qty, max_qty }) => ({ medicine_name, min_qty, max_qty, ward_id })));
      if (insErr) return toast(insErr.message, true);
      toast(`Stocklist published \u2014 ${toPublish.length} drug(s).`);
      loadStockList();
      loadStockHistory();
      loadBuilder(ward_id);
    },
  });
}

async function exportStocklistPdf(ward_id) {
  if (!ward_id) return toast('Select a ward first.', true);
  const ward = wards.find(w => w.id === ward_id);
  const { data, error } = await sb.from('blist_items').select('*').eq('ward_id', ward_id).order('medicine_name');
  if (error) return toast(error.message, true);
  if (!data?.length) return toast('This ward has no stocklist to export yet.', true);

  // Group by section — a drug flagged under more than one section
  // (e.g. both "Cold store" and "Injections") appears under each,
  // since a nurse needs to find it either way. Anything with no
  // section goes under a plain "General" heading.
  const names = data.map(d => d.medicine_name);
  const { data: catalogRows } = await sb.from('drug_catalog').select('id, medicine_name').in('medicine_name', names);
  const catalogIdByName = Object.fromEntries((catalogRows || []).map(c => [c.medicine_name, c.id]));
  const catalogIds = (catalogRows || []).map(c => c.id);
  const { data: links } = catalogIds.length
    ? await sb.from('drug_catalog_sections').select('drug_catalog_id, section_id').in('drug_catalog_id', catalogIds)
    : { data: [] };
  const { data: sectionRows } = await sb.from('drug_sections').select('id, name');
  const sectionNameById = Object.fromEntries((sectionRows || []).map(s => [s.id, s.name]));
  const sectionsByCatalogId = {};
  (links || []).forEach(l => { (sectionsByCatalogId[l.drug_catalog_id] ??= []).push(sectionNameById[l.section_id]); });

  const groups = {};
  data.forEach(item => {
    const catalogId = catalogIdByName[item.medicine_name];
    const itemSections = catalogId ? (sectionsByCatalogId[catalogId] || []) : [];
    const targets = itemSections.length ? itemSections : ['General'];
    targets.forEach(sec => { (groups[sec] ??= []).push(item); });
  });
  const sectionNames = Object.keys(groups).filter(s => s !== 'General').sort((a, b) => a.localeCompare(b));
  if (groups['General']) sectionNames.push('General');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 40;
  let y = margin;

  if (systemSettings.trust_logo_data_url) {
    try {
      // Rasterise to PNG first: jsPDF can't embed SVG directly, and this
      // also keeps the logo's own aspect ratio (fitted into a 140x60pt box).
      const logo = await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = systemSettings.trust_logo_data_url;
      });
      const nw = logo.naturalWidth || 300, nh = logo.naturalHeight || 130;
      const boxW = 140, boxH = 60;
      const scale = Math.min(boxW / nw, boxH / nh);
      const w = nw * scale, h = nh * scale;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * 4); canvas.height = Math.round(h * 4);
      canvas.getContext('2d').drawImage(logo, 0, 0, canvas.width, canvas.height);
      doc.addImage(canvas.toDataURL('image/png'), 'PNG', margin, y, w, h, undefined, 'FAST');
    } catch (e) { /* a corrupt or unsupported image shouldn't block the export */ }
    y += 70;
  }

  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text(`${ward?.name || 'Ward'} \u2014 Stocklist`, margin, y);
  y += 20;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(100);
  doc.text(`Exported: ${new Date().toLocaleString('en-GB')}`, margin, y);
  doc.setTextColor(0);
  y += 24;

  const colX = { name: margin, min: pageWidth - margin - 160, max: pageWidth - margin - 70 };
  const nameMaxWidth = colX.min - colX.name - 10;
  const lineHeight = 13;
  const minRowHeight = 20;
  const drawColumnHeader = () => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text('Medicine', colX.name, y);
    doc.text('Min level', colX.min, y);
    doc.text('Max level', colX.max, y);
    y += 6;
    doc.setLineWidth(0.5);
    doc.line(margin, y, pageWidth - margin, y);
    y += 14;
    doc.setFont('helvetica', 'normal');
  };
  const rowHeightFor = (item) => {
    const nameLines = doc.splitTextToSize(item.medicine_name, nameMaxWidth);
    return { nameLines, rowHeight: Math.max(minRowHeight, nameLines.length * lineHeight + 6) };
  };
  const drawRow = (item, i) => {
    const { nameLines, rowHeight } = rowHeightFor(item);
    if (y - 14 + rowHeight > pageHeight - margin) {
      doc.addPage();
      y = margin;
      drawColumnHeader();
    }
    if (i % 2 === 1) { doc.setFillColor(246, 247, 249); doc.rect(margin - 4, y - 14, pageWidth - 2 * margin + 8, rowHeight, 'F'); }
    doc.text(nameLines, colX.name, y);
    doc.text(item.min_qty === null || item.min_qty === undefined ? '\u2014' : String(item.min_qty), colX.min, y);
    doc.text(String(item.max_qty), colX.max, y);
    y += rowHeight;
  };

  let firstSection = true;
  sectionNames.forEach(secName => {
    const items = groups[secName];
    // Orphan control: a section heading needs room for itself, the
    // column header, and at least one row beneath it — otherwise it
    // starts the new page instead of sitting alone at the bottom.
    const firstRow = rowHeightFor(items[0]).rowHeight;
    const neededForHeading = 24 + 6 + 14 + firstRow;
    if (!firstSection && y - 14 + neededForHeading > pageHeight - margin) {
      doc.addPage();
      y = margin;
    }
    if (!firstSection) y += 10;
    firstSection = false;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text(secName, margin, y);
    y += 18;
    drawColumnHeader();
    items.forEach((item, i) => drawRow(item, i));
  });

  doc.save(`${(ward?.name || 'ward').replace(/[^a-z0-9]+/gi, '-')}-stocklist.pdf`);
}


async function loadStockVersions() {
  const el = document.getElementById('stock-versions');
  const wardSel = document.getElementById('stock-ward');
  if (!el || !wardSel) return;
  const ward_id = wardSel.value;
  if (!ward_id) { el.innerHTML = '<div class="empty">Select a ward.</div>'; return; }
  const [{ data: vers, error }, { data: cur }] = await Promise.all([
    sb.from('stocklist_versions').select('id, items, item_count, created_at, created_by').eq('ward_id', ward_id).order('created_at', { ascending: false }).limit(3),
    sb.from('blist_items').select('medicine_name, min_qty, max_qty').eq('ward_id', ward_id),
  ]);
  if (error) { el.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!vers?.length) { el.innerHTML = '<div class="empty">No earlier versions yet \u2014 one is saved each time this stocklist changes.</div>'; return; }
  const ids = [...new Set(vers.map(v => v.created_by).filter(Boolean))];
  const { data: ppl } = ids.length ? await sb.from('profiles').select('id, full_name').in('id', ids) : { data: [] };
  const nm = Object.fromEntries((ppl || []).map(p => [p.id, p.full_name]));
  const now = new Map((cur || []).map(r => [r.medicine_name, r]));
  el.innerHTML = `<table><thead><tr><th>Saved</th><th>By</th><th>Drugs</th><th>Compared with now</th><th></th></tr></thead><tbody>
    ${vers.map((v, i) => {
      const old = new Map((v.items || []).map(r => [r.medicine_name, r]));
      const added = [...now.keys()].filter(k => !old.has(k)).length;
      const removed = [...old.keys()].filter(k => !now.has(k)).length;
      const changed = [...old.keys()].filter(k => now.has(k) && (now.get(k).max_qty !== old.get(k).max_qty || (now.get(k).min_qty ?? null) !== (old.get(k).min_qty ?? null))).length;
      const when = new Date(v.created_at).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' });
      const diff = (!added && !removed && !changed) ? 'Same as now' : [removed ? `${removed} would be added back` : '', added ? `${added} would be removed` : '', changed ? `${changed} quantity change${changed === 1 ? '' : 's'}` : ''].filter(Boolean).join(', ');
      return `<tr><td><b>${esc(when)}</b><div class="muted" style="font-size:11.5px;">${['1 change ago', '2 changes ago', '3 changes ago'][i]}</div></td><td>${esc(nm[v.created_by] || '\u2014')}</td><td>${v.item_count}</td><td class="muted">${esc(diff)}</td>
        <td style="text-align:right;"><button class="btn small ghost" data-restore-ver="${v.id}" data-when="${esc(when)}">Restore</button></td></tr>`;
    }).join('')}</tbody></table>`;
  el.querySelectorAll('[data-restore-ver]').forEach(b => b.onclick = () => {
    const wardName = wards.find(w => w.id === ward_id)?.name || 'this ward';
    confirmDialog('Restore this version?', `Put ${esc(wardName)}\u2019s stocklist back to how it was on <b>${esc(b.dataset.when)}</b>. The current list is saved first, so you can undo this.`, 'Restore', async () => {
      const { data: n, error: e } = await sb.rpc('restore_stocklist_version', { p_version: b.dataset.restoreVer });
      if (e) return toast(e.message, true);
      toast(`Stocklist restored \u2014 ${n ?? 0} drug${n === 1 ? '' : 's'}.`);
      loadStockList(); loadStockHistory(); loadBuilder(ward_id);
    }, true);
  });
}

async function loadStockHistory() {
  loadStockVersions();
  const el = document.getElementById('stock-history');
  const wardSel = document.getElementById('stock-ward');
  if (!el || !wardSel) return;
  const ward_id = wardSel.value;
  if (!ward_id) { el.innerHTML = '<div class="empty">Select a ward.</div>'; return; }
  const { data, error } = await sb.from('blist_item_history')
    .select('medicine_name, change_type, old_value, new_value, changed_by, changed_at')
    .eq('ward_id', ward_id).order('changed_at', { ascending: false }).limit(5);
  if (error) { el.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!data || !data.length) { el.innerHTML = '<div class="empty">No changes recorded yet.</div>'; return; }
  const ids = [...new Set(data.map(r => r.changed_by).filter(Boolean))];
  let names = {};
  if (ids.length) {
    const { data: ppl } = await sb.from('profiles').select('id, full_name').in('id', ids);
    names = Object.fromEntries((ppl || []).map(x => [x.id, x.full_name]));
  }
  const describe = (r) => {
    switch (r.change_type) {
      case 'added': return `added (max ${esc(r.new_value ?? '—')})`;
      case 'removed': return `removed (was max ${esc(r.old_value ?? '—')})`;
      case 'max_qty_changed': return `max level ${esc(r.old_value ?? '—')} → ${esc(r.new_value ?? '—')}`;
      case 'min_qty_changed': return `min level ${esc(r.old_value ?? '—')} → ${esc(r.new_value ?? '—')}`;
      case 'reorder_flag_changed': return `restricted reorder ${r.new_value === 'true' ? 'switched on' : 'switched off'}`;
      default: return esc(r.change_type);
    }
  };
  el.innerHTML = `<table><thead><tr><th>When</th><th>Medicine</th><th>Change</th><th>By</th></tr></thead><tbody>
    ${data.map(r => `<tr>
      <td>${new Date(r.changed_at).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' })}</td>
      <td>${esc(r.medicine_name)}</td>
      <td>${describe(r)}</td>

    </tr>`).join('')}</tbody></table>`;
}

// ---------- Restore from an Excel backup ----------
let restorePlan = [];   // [{ ward, site, wardId, items, problems, cur, add, rem, chg }]

async function handleRestoreFile() {
  const input = document.getElementById('restore-file');
  const out = document.getElementById('restore-preview');
  const file = input.files[0];
  restorePlan = [];
  if (!file) { out.innerHTML = ''; return; }
  out.textContent = 'Reading the file…';
  let rows;
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets['Stocklists'] || wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
  } catch (e) { out.innerHTML = '<div class="empty">That file could not be read as an Excel workbook.</div>'; return; }

  const norm = (k) => String(k).trim().toLowerCase();
  const pick = (r, ...names) => { for (const k of Object.keys(r)) if (names.includes(norm(k))) return r[k]; return ''; };
  if (!rows.length || !('medicine' in Object.fromEntries(Object.keys(rows[0]).map(k => [norm(k), 1])))) {
    out.innerHTML = '<div class="empty">This does not look like a Stock Req backup — expected a sheet called “Stocklists” with columns Site, Ward, Medicine, Min qty, Max qty.</div>'; return;
  }

  const catalogByLower = Object.fromEntries(catalog.map(c => [c.medicine_name.toLowerCase(), c.medicine_name]));
  const siteById = Object.fromEntries(sites.map(x => [x.id, x.name]));
  const groups = new Map();
  rows.forEach((r, idx) => {
    const wardName = String(pick(r, 'ward')).trim(), siteName = String(pick(r, 'site')).trim(), med = String(pick(r, 'medicine')).trim();
    if (!wardName && !med) return;
    const key = `${siteName}\u0001${wardName}`;
    if (!groups.has(key)) groups.set(key, { ward: wardName, site: siteName, items: [], problems: [] });
    const g = groups.get(key);
    const rowNo = idx + 2;
    const real = catalogByLower[med.toLowerCase()];
    if (!real) { g.problems.push(`Row ${rowNo}: “${med}” is not in the drug catalogue`); return; }
    const max = parseInt(pick(r, 'max qty'), 10);
    const minRaw = String(pick(r, 'min qty')).trim();
    const min = minRaw === '' ? null : parseInt(minRaw, 10);
    if (!Number.isInteger(max) || max < 1) { g.problems.push(`Row ${rowNo}: ${real} has no valid max qty`); return; }
    if (min !== null && (!Number.isInteger(min) || min < 0 || min > max)) { g.problems.push(`Row ${rowNo}: ${real} has an invalid min qty`); return; }
    if (g.items.some(i => i.medicine_name === real)) { g.problems.push(`Row ${rowNo}: ${real} appears twice`); return; }
    g.items.push({ medicine_name: real, min_qty: min, max_qty: max,
      requires_reorder_approval: /^(y|yes|true|1)$/i.test(String(pick(r, 'needs reorder approval')).trim()) });
  });

  const wardIds = [];
  groups.forEach(g => {
    const w = wards.find(w => w.name.trim().toLowerCase() === g.ward.toLowerCase() && (siteById[w.site_id] || '').trim().toLowerCase() === g.site.toLowerCase());
    g.wardId = w?.id || null;
    if (!w) g.problems.push(`No ward called “${g.ward}” at site “${g.site}” exists in the system`);
    else wardIds.push(w.id);
  });
  const { data: curRows, error } = wardIds.length
    ? await sb.from('blist_items').select('ward_id, medicine_name, min_qty, max_qty, requires_reorder_approval').in('ward_id', wardIds)
    : { data: [] };
  if (error) { out.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }

  restorePlan = [...groups.values()].sort((a, b) => a.site.localeCompare(b.site) || a.ward.localeCompare(b.ward)).map(g => {
    const cur = (curRows || []).filter(c => c.ward_id === g.wardId);
    const curBy = Object.fromEntries(cur.map(c => [c.medicine_name, c]));
    const newBy = Object.fromEntries(g.items.map(i => [i.medicine_name, i]));
    const add = g.items.filter(i => !curBy[i.medicine_name]).length;
    const rem = cur.filter(c => !newBy[c.medicine_name]).length;
    const chg = g.items.filter(i => { const c = curBy[i.medicine_name]; return c && (c.max_qty !== i.max_qty || (c.min_qty ?? null) !== (i.min_qty ?? null) || !!c.requires_reorder_approval !== i.requires_reorder_approval); }).length;
    return { ...g, cur: cur.length, add, rem, chg };
  });
  renderRestorePreview();
}

function renderRestorePreview() {
  const out = document.getElementById('restore-preview');
  if (!restorePlan.length) { out.innerHTML = '<div class="empty">No stocklist rows found in that file.</div>'; return; }
  out.innerHTML = `<div style="overflow-x:auto;"><table><thead><tr><th style="width:36px;"></th><th>Site</th><th>Ward</th><th>Now</th><th>In backup</th><th>Would add</th><th>Would remove</th><th>Would change</th><th></th></tr></thead><tbody>
    ${restorePlan.map((g, i) => {
      const blocked = !g.wardId || g.problems.length > 0;
      const noChange = !blocked && !g.add && !g.rem && !g.chg;
      return `<tr>
        <td><input type="checkbox" class="restore-cb" data-i="${i}" ${blocked || noChange ? 'disabled' : 'checked'} /></td>
        <td>${esc(g.site)}</td><td>${esc(g.ward)}</td><td>${g.cur}</td><td>${g.items.length}</td>
        <td>${g.add}</td><td>${g.rem}</td><td>${g.chg}</td>
        <td class="muted">${blocked ? `<span style="color:#9b1239">Cannot restore: ${esc(g.problems.slice(0, 3).join('; '))}${g.problems.length > 3 ? ` (+${g.problems.length - 3} more)` : ''}</span>` : noChange ? 'Already identical' : ''}</td>
      </tr>`; }).join('')}
    </tbody></table></div>
    <button class="btn magenta" id="restore-apply" style="margin-top:12px;">Restore selected wards</button>`;
  document.getElementById('restore-apply').onclick = applyRestore;
}

function applyRestore() {
  const chosen = [...document.querySelectorAll('.restore-cb:checked')].map(cb => restorePlan[+cb.dataset.i]);
  if (!chosen.length) return toast('Tick at least one ward to restore.', true);
  const adds = chosen.reduce((n, g) => n + g.add, 0), rems = chosen.reduce((n, g) => n + g.rem, 0), chgs = chosen.reduce((n, g) => n + g.chg, 0);
  confirmChange({
    scope: chosen.length === 1 ? 'ward' : 'wards', wardName: chosen[0].ward, wardCount: chosen.length,
    title: `Replace the stocklist${chosen.length === 1 ? '' : 's'} of ${chosen.length === 1 ? chosen[0].ward : chosen.length + ' wards'} with the backup`,
    details: `In total this will add ${adds}, remove ${rems} and change ${chgs} stocklist line${chgs === 1 ? '' : 's'}.`,
    confirmLabel: `Restore ${chosen.length} ward${chosen.length === 1 ? '' : 's'}`,
    onConfirm: async () => {
      let ok = 0; const failed = [];
      for (const g of chosen) {
        const { error } = await sb.rpc('restore_stocklist', { p_ward: g.wardId, p_items: g.items });
        if (error) failed.push(`${g.ward}: ${error.message}`); else ok++;
      }
      if (failed.length) toast(`Restored ${ok}; failed: ${failed.join(' | ')}`, true);
      else toast(`Restored ${ok} ward${ok === 1 ? '' : 's'} from the backup.`);
      document.getElementById('restore-file').value = '';
      document.getElementById('restore-preview').innerHTML = '';
      restorePlan = [];
      loadStockList(); loadStockHistory(); loadBuilder(document.getElementById('stock-ward').value);
    },
  });
}

        const { error: insErr } = await sb.from('blist_items').insert(toInsert);
        if (insErr) return toast(insErr.message, true);
        document.getElementById('bulk-add-name').value = '';
        document.getElementById('bulk-add-minqty').value = '';
        document.getElementById('bulk-add-maxqty').value = '1';
        toast(`${name} added to ${toInsert.length} ward${toInsert.length > 1 ? 's' : ''} (${existingIds.size} already had it).`);
        loadBulkRemoveOptions();
        loadStockList();
        loadStockHistory();
        loadBuilder(document.getElementById('stock-ward').value);
      } });
  };

  async function loadBulkRemoveOptions() {
    const sel = document.getElementById('bulk-remove-name');
    if (!sel) return;
    const { data, error } = await sb.from('blist_items').select('medicine_name');
    if (error) { sel.innerHTML = '<option value="">Could not load</option>'; return; }
    const counts = {};
    (data || []).forEach(r => { counts[r.medicine_name] = (counts[r.medicine_name] || 0) + 1; });
    const names = Object.keys(counts).sort((a, b) => a.localeCompare(b));
    sel.innerHTML = '<option value="">Choose a medicine\u2026</option>' + names.map(n => `<option value="${esc(n)}">${esc(n)} (${counts[n]} ward${counts[n] > 1 ? 's' : ''})</option>`).join('');
  }

  document.getElementById('bulk-remove-btn').onclick = async () => {
    const name = document.getElementById('bulk-remove-name').value;
    if (!name) return toast('Choose a medicine.', true);
    const { data: rows, error: selErr } = await sb.from('blist_items').select('id').eq('medicine_name', name);
    if (selErr) return toast(selErr.message, true);
    if (!rows || !rows.length) { toast('No ward stocks this drug.', true); return loadBulkRemoveOptions(); }
    confirmChange({ scope: 'all', wardCount: rows.length,
      title: `Remove ${name} from ${rows.length} ward stocklist${rows.length > 1 ? 's' : ''}`,
      details: 'It stays in the drug catalog, and can be added back later.', confirmLabel: `Remove from ${rows.length} wards`,
      onConfirm: async () => {
        const { error: delErr } = await sb.from('blist_items').delete().eq('medicine_name', name);
        if (delErr) return toast(delErr.message, true);
        toast(`${name} removed from ${rows.length} ward${rows.length > 1 ? 's' : ''}.`);
        loadStockList();
        loadStockHistory();
        loadBuilder(document.getElementById('stock-ward').value);
        loadBulkRemoveOptions();
      } });
  };

  await loadStockList();
  await loadStockHistory();
  await loadBuilder(document.getElementById('stock-ward').value);
  await loadBulkRemoveOptions();
}

(async () => {
  const p = await requireAuth({ require: () => isSuperuser() || canManageStocklists() });
  if (!p) return;
  document.getElementById('main').innerHTML = '<div id="body"></div>';
  renderAdminStock();
})();
</script>
</body>
</html>
