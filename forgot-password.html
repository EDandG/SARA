  <div class="sl-p" style="width:4px;height:4px;background:rgba(95,182,224,.6);left:8%;animation:slUp1 12s linear infinite"></div>
  <div class="sl-p" style="width:3px;height:3px;background:rgba(76,175,80,.7);left:25%;animation:slUp2 16s linear infinite;animation-delay:-4s"></div>
  <div class="sl-p" style="width:5px;height:5px;background:rgba(18,160,173,.45);left:45%;animation:slUp1 14s linear infinite;animation-delay:-8s"></div>
  <div class="sl-p" style="width:4px;height:4px;background:rgba(95,182,224,.55);left:66%;animation:slUp2 13s linear infinite;animation-delay:-6s"></div>
  <div class="sl-p" style="width:3px;height:3px;background:rgba(76,175,80,.6);left:88%;animation:slUp1 17s linear infinite;animation-delay:-2s"></div>

</div>
<div class="sl-panel"><div class="sl-form">
<h1 id="title">Forgotten your password?</h1>
    <p class="lead" id="sub">Enter your User ID and the email address linked to your login and we will send you a link.</p>
    <div id="msg" style="margin-top:10px;"></div>
    <form id="reqForm">
      <label for="uid">User ID</label>
      <input type="text" id="uid" required autocomplete="username" autocapitalize="off" spellcheck="false" />
      <label for="email">Email address</label>
      <input type="email" id="email" required autocomplete="email" placeholder="name@nhs.net" />
      <button type="submit" class="btn magenta" id="reqBtn">Send reset link</button>
    </form>
    <form id="newForm" hidden>
      <label for="pw1">New password (min. 12 characters)</label>
      <input type="password" id="pw1" required minlength="12" autocomplete="new-password" />
      <label for="pw2">Confirm new password</label>
      <input type="password" id="pw2" required minlength="12" autocomplete="new-password" />
      <button type="submit" class="btn magenta" id="newBtn">Save password</button>
    </form>
    <p class="muted" style="margin-top:16px; font-size:12.5px; text-align:center;"><a href="login.html">&larr; Back to log in</a></p>
    <p class="muted" style="margin-top:8px; font-size:12.5px; text-align:center;"><a href="#" onclick="openAccessibilitySettings(); return false;">Accessibility settings</a></p>
</div></div>
</div>
<a class="sl-edg" href="https://home.edandg.com/" target="_blank" rel="noopener noreferrer" aria-label="ED&amp;G, visit home.edandg.com">

  <div class="name">Evolve Digital &amp; Governance</div>
  <div class="rule"><span></span><span></span><span></span></div>
</a>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="shared.js"></script>
<script>
const msg = document.getElementById('msg');
const token = new URLSearchParams(window.location.search).get('token');
const say = (t, ok) => { msg.innerHTML = `<div style="padding:9px 12px; border-radius:9px; font-size:13px; font-weight:600; ${ok ? 'background:#e6f6ee; color:#14633f; border:1px solid #9fd8b8;' : 'background:#fdecef; color:#9b1239; border:1px solid #f3b8c6;'}">${esc(t)}</div>`; };
async function call(payload) {
  const res = await fetch(`${FN_BASE}/password-reset`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_PUBLISHABLE_KEY },
    body: JSON.stringify(payload),
  });
  let out = {};
  try { out = await res.json(); } catch (e) { throw new Error('The service is not responding. Please try again shortly.'); }
  if (!res.ok) throw new Error(out.error || 'Something went wrong. Please try again.');
  return out;
}
try {
  const cached = localStorage.getItem('login_logo_cache');
  if (cached) { const i = document.getElementById('login-logo'); i.src = cached; i.style.display = 'block'; }
} catch (e) {}

if (token) {
  document.getElementById('reqForm').hidden = true;
  document.getElementById('title').textContent = 'Choose a new password';
  document.getElementById('sub').textContent = 'Checking your link\u2026';
  call({ action: 'check', token }).then(() => {
    document.getElementById('sub').textContent = 'Pick a password you have not used before.';
    document.getElementById('newForm').hidden = false;
    document.getElementById('pw1').focus();
  }).catch((err) => {
    document.getElementById('sub').textContent = '';
    say(err.message, false);
    document.getElementById('reqForm').hidden = false;
  });
}
document.getElementById('reqForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('reqBtn'); btn.disabled = true; btn.textContent = 'Sending\u2026'; msg.innerHTML = '';
  try {
    await call({ action: 'request', user_id: document.getElementById('uid').value.trim(), email: document.getElementById('email').value.trim() });
    document.getElementById('reqForm').hidden = true;
    say('If those details match a login, we have emailed a reset link. It works once and expires in 30 minutes. Check your junk folder if it does not arrive. If it still does not, ask an administrator to reset it for you.', true);
  } catch (err) { say(err.message, false); btn.disabled = false; btn.textContent = 'Send reset link'; }
});
document.getElementById('newForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw1 = document.getElementById('pw1').value, pw2 = document.getElementById('pw2').value;
  if (pw1 !== pw2) { say('The two passwords do not match.', false); return; }
  const btn = document.getElementById('newBtn'); btn.disabled = true; btn.textContent = 'Saving\u2026';
  try {
    await call({ action: 'complete', token, password: pw1 });
    document.getElementById('newForm').hidden = true; document.getElementById('sub').textContent = '';
    say('Your password has been changed. You can now log in.', true);
    setTimeout(() => { window.location.href = 'login.html'; }, 2500);
  } catch (err) { say(err.message, false); btn.disabled = false; btn.textContent = 'Save password'; }
});
</script>
<script>
(async () => { try { const { error } = await sb.from('system_settings').select('key').limit(1); if (error) throw error; }
  catch (e) { document.getElementById('sl-live').classList.add('down'); document.getElementById('sl-live-text').textContent = 'Unavailable'; } })();
</script>
</body>
