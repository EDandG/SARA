<link rel="icon" type="image/svg+xml" href="favicon.svg" />

  .cart-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#003087;color:#fff;box-shadow:0 -6px 20px rgba(0,0,0,.18);font-weight:700;}

<body data-page="order.html">
<div id="app">
<header class="topbar">
    <div class="brand">
      
      <div>
        <div class="name">StockFlow™</div>
        <div class="sub" data-ward-context></div>
      </div>
    </div>
    <div class="who">
      <span data-who-name></span>
      <button class="logout" data-logout>Log out</button>
    </div>
  </header>
  <div id="banner-root"></div>
  <div id="page-nav" class="tabs"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="shared.js"></script>
<script>
let cart = [], orderWardId = null, orderType = null;
let topupLockHeldByMe = false, topupLockPollTimer = null, topupHeartbeatTimer = null, topupLockLost = false;

// Whole-ward lock: acquired the moment a top-up cart gets its first
// item, blocks every OTHER user of the ward from building either an
// adhoc or top-up order (server-enforced via the orders insert
// policy, not just this banner) until submit, explicit cancel, or 30
// minutes of inactivity. The holder is unaffected by their own lock.
async function checkTopupLock(ward) {
  const { data: rows } = await sb.from('ward_ordering_locks').select('*').eq('ward_id', ward);
  const lock = rows && rows[0];
  if (!lock) return null;
  const staleCutoff = new Date(Date.now() - 30 * 60000);
  if (new Date(lock.last_activity_at) < staleCutoff) return null;
  if (lock.locked_by === profile.id) { topupLockHeldByMe = true; return null; }
  const { data: names } = await sb.rpc('staff_display_names');
  const holderName = (names || []).find(n => n.id === lock.locked_by)?.full_name || 'Another user';
  return holderName;
}

function stopTopupHeartbeat() {
  if (topupHeartbeatTimer) { clearInterval(topupHeartbeatTimer); topupHeartbeatTimer = null; }
}
async function releaseTopupLock(ward) {
  stopTopupHeartbeat();
  if (topupLockHeldByMe) {
    topupLockHeldByMe = false;
    await sb.rpc('release_topup_lock', { target_ward: ward });
  }
}
function startTopupHeartbeat(ward) {
  stopTopupHeartbeat();
  topupLockLost = false;
  topupHeartbeatTimer = setInterval(async () => {
    const { data: stillMine, error } = await sb.rpc('heartbeat_topup_lock', { target_ward: ward });
    if (!error && stillMine === false && !topupLockLost) {
      topupLockLost = true;
      toast('You no longer hold ordering for this ward (you may have been signed out, or someone else took over). This order can no longer be submitted from this screen \u2014 reload and start again.', true);
    }
  }, 5 * 60000);
}

// ---------- PREDICTIVE TOP-UP SUGGESTIONS ----------
// Only meaningful once there's a full 3-month window to analyse —
// availability (the ward toggle) and usefulness (enough history) are
// separate: a superuser can enable the toggle any time, but the
// option only appears to the ward once real data backs it.
async function wardHasEnoughHistory(wardId) {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 90);
  const { data } = await sb.from('orders').select('id')
    .eq('ward_id', wardId).lte('created_at', cutoff.toISOString()).limit(1);
  return !!(data && data.length);
}

async function fetchPredictiveSuggestions(wardId, stocklistItems) {
  const since = new Date(); since.setDate(since.getDate() - 90);
  const { data } = await sb.from('orders').select('medicine_name, parent_order_id')
    .eq('ward_id', wardId).in('order_type', ['adhoc', 'topup']).gte('created_at', since.toISOString());
  const stocklistNames = new Set(stocklistItems.map(i => i.medicine_name));
  const counts = {};
  (data || []).forEach(o => {
    if (o.parent_order_id) return; // the remainder row from a part-supply isn't a second request
    if (!stocklistNames.has(o.medicine_name)) return; // only suggest items still on the current stocklist
    counts[o.medicine_name] = (counts[o.medicine_name] || 0) + 1;
  });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 20).map(([name]) => name);
}

// ---------- OVERDUE TOP-UP: raise it for real ----------
// A ward whose top-up is due TODAY should have submitted YESTERDAY —
// same "on time" definition used everywhere else in this system.
// System-wide toggle (developer/superuser) governs whether this
// option can appear at all; being genuinely overdue is what actually
// triggers it, same distinction as the predictive-suggestions toggle.
async function isWardOverdueForTopup(wardId) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayName = WEEKDAY_NAMES[today.getDay()];
  const ward = wards.find(w => w.id === wardId);
  if (!ward || !(ward.topup_days || []).includes(todayName)) return false;
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
  const { data: sessions } = await sb.from('order_sessions').select('created_at')
    .eq('ward_id', wardId).eq('order_type', 'topup').gte('created_at', yesterday.toISOString());
  const onTime = (sessions || []).some(s => isoDate(new Date(s.created_at)) === isoDate(yesterday));
  return !onTime;
}

async function openTempStockModal() {
  let { data: catalogRows, error: catErr } = await sb.from('drug_catalog').select('medicine_name, pack_size').eq('hidden', false).order('medicine_name');
  if (catErr) {
    // Database not yet updated with the hide/unhide column: fall back to the whole catalogue.
    ({ data: catalogRows, error: catErr } = await sb.from('drug_catalog').select('medicine_name, pack_size').order('medicine_name'));
    if (catErr) { toast('Could not load the drug catalogue: ' + catErr.message, true); return; }
  }
  const catalog = catalogRows || [];
  openModal(`
    <h3>Temp stock</h3>
    <p class="muted">Order any drug from the drug catalog, even if it isn't on this ward's stocklist. It is marked as <b>Temp stock</b> on the order. If what's needed isn't listed, a developer can add it to the catalog first.</p>
    <label>Item</label>
    <select id="ts-name">${catalog.length ? catalog.map(c => `<option value="${esc(c.medicine_name)}">${esc(c.medicine_name)}${c.pack_size ? ` (${esc(c.pack_size)})` : ''}</option>`).join('') : '<option value="">Catalog is empty</option>'}</select>
    <label style="margin-top:10px;">Quantity</label>
    <input type="number" id="ts-qty" min="1" value="1" />
    <div class="modal-error" id="ts-error"></div>
    <div class="actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn magenta" id="ts-add">Add to order</button>
    </div>`);
  document.getElementById('ts-add').onclick = () => {
    const name = document.getElementById('ts-name').value;
    const qty = Math.max(1, parseInt(document.getElementById('ts-qty').value, 10) || 1);
    if (!name) { document.getElementById('ts-error').textContent = 'Choose an item.'; return; }
    cart.push({ medicine_name: `[Temp stock] ${name}`, quantity: qty, max_qty: qty, isTemp: true, pack_size: (catalog.find(c => c.medicine_name === name) || {}).pack_size || null });
    closeModal();
    renderWardOrder();
  };
}

async function renderWardOrder() {
  const body = document.getElementById('body');
  if (!myWards.length) { body.innerHTML = `<div class="card"><div class="empty">No wards have been allocated to your login yet. Contact an administrator.</div></div>`; return; }

  // Single-ward accounts skip straight past the tile step — there's
  // no real choice to make, so showing it would just be an extra click.
  if (!orderWardId && myWards.length === 1 && !readDraft()) orderWardId = myWards[0].id;

  if (!orderWardId) { renderWardTiles(); return; }
  if (!orderType) { await renderOrderTypeChoice(); return; }

  await renderOrderBuilder();
}

// ---------- unsent adhoc order drafts (kept on this device so a timeout doesn't lose them) ----------
const draftKey = () => `sr_draft_${profile?.id || 'x'}`;
function saveDraft() {
  try { if (orderType === 'adhoc' && orderWardId && cart.length) localStorage.setItem(draftKey(), JSON.stringify({ ward: orderWardId, type: 'adhoc', cart, ts: Date.now() })); } catch (e) {}
}
function clearDraft() { try { localStorage.removeItem(draftKey()); } catch (e) {} }
function readDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(draftKey()) || 'null');
    if (!d || !d.cart?.length || Date.now() - d.ts > 12 * 3600 * 1000 || !myWards.some(w => w.id === d.ward)) return null;
    return d;
  } catch (e) { return null; }
}

function renderWardTiles() {
  const body = document.getElementById('body');
  const sorted = myWards.slice().sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
  body.innerHTML = `
    <div class="card" style="text-align:center;">
      <h2>Make a new stock request</h2>
      <p class="muted">Choose a ward to request stock for.</p>
      <div style="max-width:420px; margin:14px auto 0;">
        <input type="search" id="ward-search" placeholder="Search wards${sorted.length > 1 ? ' (' + sorted.length + ')' : ''}\u2026" autocomplete="off" aria-label="Search wards" />
      </div>
      <div id="ward-tiles" style="display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:14px;"></div>
    </div>`;
  const draft = readDraft();
  if (draft) {
    const wn = myWards.find(w => w.id === draft.ward)?.name || 'a ward';
    const note = document.createElement('div'); note.className = 'draft-note';
    note.innerHTML = `<span>You have an unsent order for <b>${esc(wn)}</b> (${draft.cart.length} item${draft.cart.length === 1 ? '' : 's'}).</span><button class="btn magenta small" id="draft-resume">Resume</button><button class="btn ghost small" id="draft-discard">Discard</button>`;
    body.querySelector('.card').insertBefore(note, body.querySelector('.card > div[style*="max-width:420px"]'));
    document.getElementById('draft-resume').onclick = () => { cart = draft.cart; orderWardId = draft.ward; orderType = 'adhoc'; renderWardOrder(); };
    document.getElementById('draft-discard').onclick = () => { try { localStorage.removeItem(draftKey()); } catch (e) {} note.remove(); };
  }
  const tiles = document.getElementById('ward-tiles'), search = document.getElementById('ward-search');
  const paint = () => {
    const q = search.value.trim().toLowerCase();
    const list = sorted.filter(w => !q || w.name.toLowerCase().includes(q));
    tiles.innerHTML = list.length ? list.map(w => `
      <button class="btn ghost" data-ward-tile="${w.id}" style="width:160px; padding:20px 12px; font-size:14px; font-weight:600;">${esc(w.name)}</button>`).join('')
      : `<div class="empty" style="width:100%;">No wards match "${esc(search.value.trim())}".</div>`;
    tiles.querySelectorAll('[data-ward-tile]').forEach(b => b.onclick = () => { orderWardId = b.dataset.wardTile; renderWardOrder(); });
  };
  search.oninput = paint;
  search.onkeydown = (e) => { if (e.key === 'Enter') { const only = tiles.querySelectorAll('[data-ward-tile]'); if (only.length === 1) only[0].click(); } };
  paint();
  if (sorted.length > 6) search.focus();
}

async function renderOrderTypeChoice() {
  const body = document.getElementById('body');
  const ward = myWards.find(w => w.id === orderWardId);

  const historyDays = parseFloat(systemSettings.order_history_days) || 7;
  const since = new Date(Date.now() - historyDays * 24 * 3600 * 1000).toISOString();
  const { data: sessionsData } = await sb.from('order_sessions').select('*').eq('ward_id', orderWardId)
    .gte('created_at', since).order('created_at', { ascending: false }).limit(50);
  let historyHtml = `<div class="empty">No orders in the last ${historyDays} day${historyDays > 1 ? 's' : ''}.</div>`;
  if (sessionsData?.length) {
    const { data: lines } = await sb.from('orders').select('*').in('session_id', sessionsData.map(s => s.id));
    const nameById = await fetchNameMap(lines || []);
    historyHtml = sessionsData.map(s => renderSessionCard(s, lines || [], nameById)).join('');
  }

  body.innerHTML = `
    <div class="card" style="text-align:center;">
      ${myWards.length > 1 ? `<button class="btn ghost small" id="type-back" style="margin-bottom:10px;">\u2039 Change ward</button>` : ''}
      <h2>${esc(ward?.name || 'Ward')}</h2>
      <p class="muted">What are you requesting?</p>
      <div style="display:flex; flex-direction:column; gap:10px; margin:14px auto 0; max-width:360px;">
        <button class="btn magenta" data-order-type="adhoc" style="padding:16px; font-size:14px; font-weight:600;">Adhoc order</button>
        <button class="btn magenta" data-order-type="topup" style="padding:16px; font-size:14px; font-weight:600;">Complete full top up request</button>
      </div>
    </div>
    <div class="card" style="text-align:left;">
      <h2>Recent orders \u2014 last ${historyDays} day${historyDays > 1 ? 's' : ''}</h2>
      ${historyHtml}
    </div>`;
  const backBtn = document.getElementById('type-back');
  if (backBtn) backBtn.onclick = () => { orderWardId = null; renderWardOrder(); };
  body.querySelectorAll('[data-order-type]').forEach(b => b.onclick = () => {
    orderType = b.dataset.orderType;
    renderWardOrder();
  });
}

async function renderOrderBuilder() {
  const body = document.getElementById('body');
  const { data: items, error } = await sb.from('blist_items').select('*').eq('ward_id', orderWardId).order('medicine_name');
  if (error) { body.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }

  const currentWard = wards.find(w => w.id === orderWardId);
  const topupDays = currentWard?.topup_days || [];
  const wardAllowsAboveMax = aboveMaxEnabled() && currentWard?.allow_above_max_adhoc !== false;

  const lockHolderName = await checkTopupLock(orderWardId);
  const lockedOut = !!lockHolderName;

  let showPredictiveOption = false;
  if (orderType === 'topup' && predictiveEnabled() && currentWard?.predictive_ordering_enabled && !lockedOut) {
    showPredictiveOption = await wardHasEnoughHistory(orderWardId);
  }

  let showOverdueFillOption = false;
  if (orderType === 'topup' && remindersEnabled() && systemSettings.overdue_topup_preview_enabled === 'true' && !lockedOut) {
    showOverdueFillOption = await isWardOverdueForTopup(orderWardId);
  }

  const goBack = async () => {
    if (cart.length) {
      confirmDialog('Change ward or order type', 'This will discard the items added so far. Continue?', 'Discard and go back', async () => {
        cart = []; clearDraft(); await releaseTopupLock(orderWardId); orderWardId = null; orderType = null; renderWardOrder();
      }, true);
    } else {
      await releaseTopupLock(orderWardId);
      orderWardId = null;
      orderType = null;
      renderWardOrder();
    }
  };

  body.innerHTML = `
    <div id="topup-banner-mount"></div>
    ${lockedOut ? `<div class="card" style="border-color:var(--amber);"><p style="margin:0; color:var(--amber); font-weight:600;">${uiIcon('hourglass', 16)} ${esc(lockHolderName)} is currently building this ward's top-up order. Ordering is paused for everyone else here until they submit or cancel it — this'll clear automatically, no need to refresh.</p></div>` : ''}
    <div class="card">
      <button class="btn ghost small" id="order-back" style="margin-bottom:10px;">\u2039 Change ward or order type</button>
      <h2>${esc(currentWard?.name || 'Ward')} \u2014 ${orderType === 'topup' ? 'Complete full top up request' : 'Adhoc order'}</h2>
      ${orderType === 'topup' ? `<p class="muted" style="margin-bottom:10px; font-size:12px;">Top up orders can't exceed each item's usual maximum — this keeps them from needing pharmacist approval.</p>` : ''}
      ${orderType === 'adhoc' && wardAllowsAboveMax ? `<p class="muted" style="margin-bottom:10px; font-size:12px;">You can order above a stocklist item's usual max on this ward. If you do, please let your pharmacist know you've requested an above-max order — it will need their approval before it's processed.</p>` : ''}
      ${topupDays.length ? `<p class="muted" style="margin-bottom:10px;">Your top up days are: <b>${esc(topupDays.join(', '))}</b></p>` : ''}
      ${showPredictiveOption ? `<button class="btn ghost small" id="ord-predictive" style="margin-bottom:10px;">${uiIcon('sparkle', 15)} Add your usual top-up items</button>
        <p class="muted" style="margin-top:-6px; margin-bottom:10px; font-size:11.5px;">Based on what this ward has ordered most over the last 3 months. Everything's added at quantity 1 — adjust or remove as needed before submitting.</p>` : ''}
      ${(orderType === 'topup' && !lockedOut && items?.length) ? `<div class="ord-tools"><button class="btn ghost" id="ord-overdue-fill">Request max</button>
        <span class="muted" style="font-size:12.5px;">${showOverdueFillOption ? 'This ward\u2019s top-up is overdue. ' : ''}Adds every stocklist item at its usual maximum. Adjust or remove anything before submitting.</span></div>` : ''}
      ${lockedOut ? '' : (!items?.length ? `<div class="empty">No stocklist has been set up for this ward yet. Contact pharmacy or admin.</div>` : `
      <label>Search medicine</label>
      <div class="searchbox">
        <input type="text" id="ord-search" placeholder="Start typing a medicine name…" autocomplete="off" />
        <div class="results hidden" id="ord-results"></div>
      </div>`)}
      ${(canFreetextTempStock() && orderType === 'adhoc' && !lockedOut) ? `<button class="btn ghost small" id="ord-tempstock" style="margin-top:10px;">+ Temp stock</button>` : ''}
    </div>
    <div class="card">
      <h2>This order <span class="muted" id="cart-count"></span></h2>
      <div id="cart-list"></div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn magenta" id="cart-submit" disabled>Submit order</button>
        <button class="btn ghost" id="cart-cancel" disabled>Cancel order</button>
      </div>
    </div>
    <div id="cart-bar" class="cart-bar" hidden><span id="cart-bar-text"></span><button class="btn magenta" id="cart-bar-submit">Submit order</button></div>
    <div class="card">
      <h2>Recent submissions from this ward</h2>
      <div id="ord-recent">Loading…</div>
      ${statusLegendHtml()}
    </div>`;

  renderTopupBanner(currentWard, document.getElementById('topup-banner-mount'));

  if (topupLockPollTimer) clearInterval(topupLockPollTimer);
  topupLockPollTimer = setInterval(async () => {
    if (document.hidden) return;
    const stillLocked = await checkTopupLock(orderWardId);
    // Only re-render on a state change, to avoid interrupting typing.
    if (!!stillLocked !== lockedOut) renderWardOrder();
  }, 20000);

  document.getElementById('order-back').onclick = goBack;

  if (lockedOut) return;

  const tempStockBtn = document.getElementById('ord-tempstock');
  if (tempStockBtn) tempStockBtn.onclick = () => openTempStockModal();

  const predictiveBtn = document.getElementById('ord-predictive');
  if (predictiveBtn) predictiveBtn.onclick = async () => {
    predictiveBtn.disabled = true;
    predictiveBtn.textContent = 'Adding\u2026';
    if (cart.length === 0 && !topupLockHeldByMe) {
      const { data: acquired, error: lockErr } = await sb.rpc('acquire_topup_lock', { target_ward: orderWardId });
      if (lockErr) { toast(lockErr.message, true); renderWardOrder(); return; }
      if (!acquired) { toast("This ward's top-up order is currently being built by someone else.", true); renderWardOrder(); return; }
      topupLockHeldByMe = true;
      startTopupHeartbeat(orderWardId);
    }
    const suggestions = await fetchPredictiveSuggestions(orderWardId, items);
    let added = 0;
    suggestions.forEach(name => {
      if (cart.find(c => c.medicine_name === name)) return;
      const item = items.find(i => i.medicine_name === name);
      if (!item) return;
      cart.push({ medicine_name: item.medicine_name, quantity: 1, max_qty: item.max_qty, pack_size: packSizes[item.medicine_name] || null });
      added++;
    });
    renderCart();
    if (!added && !cart.length) toast('No suggestions yet \u2014 this ward may not have ordered these items in the last 3 months.', true);
    else if (!added) toast('Your usual items are already in this order.');
    else toast(`Added ${added} usual item${added > 1 ? 's' : ''} at quantity 1 \u2014 adjust as needed.`);
  };

  const overdueFillBtn = document.getElementById('ord-overdue-fill');
  if (overdueFillBtn) overdueFillBtn.onclick = async () => {
    overdueFillBtn.disabled = true;
    overdueFillBtn.textContent = 'Adding\u2026';
    if (cart.length === 0 && !topupLockHeldByMe) {
      const { data: acquired, error: lockErr } = await sb.rpc('acquire_topup_lock', { target_ward: orderWardId });
      if (lockErr) { toast(lockErr.message, true); renderWardOrder(); return; }
      if (!acquired) { toast("This ward's top-up order is currently being built by someone else.", true); renderWardOrder(); return; }
      topupLockHeldByMe = true;
      startTopupHeartbeat(orderWardId);
    }
    let added = 0;
    (items || []).forEach(item => {
      if (cart.find(c => c.medicine_name === item.medicine_name)) return;
      cart.push({ medicine_name: item.medicine_name, quantity: item.max_qty, max_qty: item.max_qty, pack_size: packSizes[item.medicine_name] || null });
      added++;
    });
    renderCart();
    if (!added) toast('Every stocklist item is already in this order.');
    else toast(`Added ${added} item${added > 1 ? 's' : ''} at usual max quantity \u2014 adjust or remove as needed.`);
    overdueFillBtn.disabled = false; overdueFillBtn.textContent = 'Request max';
  };

  renderCart();
  if (!items?.length) { loadRecent(); return; }

  const searchEl = document.getElementById('ord-search');
  const resultsEl = document.getElementById('ord-results');
  searchEl.oninput = () => {
    const q = searchEl.value.trim().toLowerCase();
    if (!q) { resultsEl.classList.add('hidden'); return; }
    const matches = items.filter(i => i.medicine_name.toLowerCase().includes(q)).slice(0, 12);
    resultsEl.innerHTML = matches.length
      ? matches.map(i => `<div data-id="${i.id}">${esc(i.medicine_name)}${packTag({ medicine_name: i.medicine_name })} <span class="muted">(max ${i.max_qty})</span></div>`).join('')
      : `<div class="none">No matches</div>`;
    resultsEl.classList.remove('hidden');
    resultsEl.querySelectorAll('[data-id]').forEach(d => d.onclick = () => addToCart(items.find(i => i.id === d.dataset.id)));
  };
  document.addEventListener('click', (e) => { if (!e.target.closest('.searchbox')) resultsEl.classList.add('hidden'); });

  async function addToCart(item) {
    document.getElementById('ord-search').value = '';
    resultsEl.classList.add('hidden');

    if (orderType === 'topup' && cart.length === 0 && !topupLockHeldByMe) {
      const { data: acquired, error: lockErr } = await sb.rpc('acquire_topup_lock', { target_ward: orderWardId });
      if (lockErr) { toast(lockErr.message, true); return; }
      if (!acquired) { toast("This ward's top-up order is currently being built by someone else.", true); renderWardOrder(); return; }
      topupLockHeldByMe = true;
      startTopupHeartbeat(orderWardId);
    }

    const addNow = () => {
      const existing = cart.find(c => c.medicine_name === item.medicine_name);
      if (existing) {
        if (orderType === 'topup' && !existing.isTemp && existing.quantity >= existing.max_qty) {
          renderCart(); return;
        }
        if (orderType === 'adhoc' && !existing.isTemp && !wardAllowsAboveMax && existing.quantity >= existing.max_qty) {
          toast(`${existing.medicine_name} is capped at ${existing.max_qty} for this ward — contact your pharmacist if you need more.`, true);
          renderCart(); return;
        }
        existing.quantity++;
      } else cart.push({ medicine_name: item.medicine_name, quantity: 1, max_qty: item.max_qty, pack_size: packSizes[item.medicine_name] || null });
      renderCart();
    };

    // Still awaiting processing: no time limit — however old, nobody's
    // acted on it yet, so it's always worth a nudge. Covers pending,
    // pending_approval, and non_urgent (deprioritised but still unmet).
    const { data: stillPending } = await sb.from('orders').select('id')
      .eq('ward_id', orderWardId).eq('medicine_name', item.medicine_name)
      .in('status', ['pending', 'pending_approval', 'non_urgent']).limit(1);

    if (stillPending && stillPending.length) {
      confirmDialog('Already awaiting processing',
        `${esc(item.medicine_name)} was already ordered by this ward and hasn't been processed yet. Add to this order anyway?`,
        'Add anyway', addNow);
      return;
    }

    // Fulfilled recently: within the configurable window (default
    // 48h), checked against when it was actually supplied/processed —
    // not when it was originally ordered — since a backlog order that
    // sat pending for days and was only just supplied is exactly the
    // "did we just do this?" case worth flagging.
    const dupWindowHours = parseFloat(systemSettings.duplicate_window_hours) || 48;
    const since = new Date(Date.now() - dupWindowHours * 3600000).toISOString();
    const { data: fulfilled } = await sb.from('orders').select('supplied_at, processed_at')
      .eq('ward_id', orderWardId).eq('medicine_name', item.medicine_name).eq('status', 'complete')
      .order('processed_at', { ascending: false }).limit(5);
    const recentFulfilled = (fulfilled || []).find(o => {
      const at = o.supplied_at || o.processed_at;
      return at && new Date(at) >= new Date(since);
    });

    if (recentFulfilled) {
      const at = recentFulfilled.supplied_at || recentFulfilled.processed_at;
      const hoursAgo = Math.round((Date.now() - new Date(at)) / 3600000);
      confirmDialog('Recently ordered',
        `${esc(item.medicine_name)} was already ordered and fulfilled by this ward ${hoursAgo <= 1 ? 'within the last hour' : hoursAgo + ' hour(s) ago'}. Add to this order anyway?`,
        'Add anyway', addNow);
      return;
    }

    // Out of stock, part-supplied, superseded, duplicate, or rejected:
    // silent. Out-of-stock resupply in particular relies on this —
    // the backend supersession trigger handles clearing the stale
    // to-follow line, no warning needed here.
    addNow();
  }

  function renderCart() {
    const listEl = document.getElementById('cart-list');
    const countEl = document.getElementById('cart-count');
    const submitBtn = document.getElementById('cart-submit');
    const cancelBtn = document.getElementById('cart-cancel');
    countEl.textContent = cart.length ? `(${cart.length} item${cart.length > 1 ? 's' : ''})` : '';
    const bar = document.getElementById('cart-bar');
    if (bar) {
      bar.hidden = !cart.length;
      document.getElementById('cart-bar-text').textContent = `${cart.length} item${cart.length === 1 ? '' : 's'} \u00b7 ${cart.reduce((n, c) => n + (c.quantity || 0), 0)} units`;
      document.getElementById('cart-bar-submit').onclick = () => document.getElementById('cart-submit').click();
    }
    saveDraft();
    submitBtn.disabled = !cart.length;
    cancelBtn.disabled = !cart.length;
    if (!cart.length) { listEl.innerHTML = `<div class="empty">No items added yet — search above to build the order.</div>`; return; }
    listEl.innerHTML = cart.map((c, i) => {
      const overMax = orderType === 'adhoc' && !c.isTemp && c.quantity > c.max_qty;
      const capsAtMax = (orderType === 'topup' || (orderType === 'adhoc' && !wardAllowsAboveMax)) && !c.isTemp;
      const it = (items || []).find(x => x.medicine_name === c.medicine_name);
      const range = c.isTemp ? 'Temp stock' : `Min ${it?.min_qty ?? '\u2014'} \u00b7 Max ${c.max_qty}`;
      const last = c.quantity <= 1;
      return `
      <div>
        <div class="ord-row">
          <div class="ord-name"><b>${esc(c.medicine_name)}${packTag({ medicine_name: c.medicine_name, pack_size: c.pack_size })}</b><small>${esc(range)}</small></div>
          <div class="ord-step">
            <button data-dec="${i}" class="${last ? 'rm' : ''}" aria-label="${last ? 'Remove ' : 'One fewer '}${esc(c.medicine_name)}" title="${last ? 'Remove from this order' : 'One fewer'}">${last ? uiIcon('x', 16) : '\u2212'}</button>
            <input type="number" min="1" ${capsAtMax ? `max="${c.max_qty}"` : ''} id="cart-qty-${i}" value="${c.quantity}" aria-label="Quantity of ${esc(c.medicine_name)}" />
            <button data-inc="${i}" aria-label="One more ${esc(c.medicine_name)}">+</button>
          </div>
        </div>
        ${overMax ? `<p class="ord-warn">${uiIcon('warn', 14)} Items above max quantity require pharmacist approval and may cause delays in processing.</p>` : ''}
      </div>`;
    }).join('');
    listEl.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => {
      const i = +b.dataset.dec;
      if (cart[i].quantity > 1) cart[i].quantity--;
      else cart.splice(i, 1);   // pressing minus at 1 takes the drug off the order list
      renderCart();
    });
    listEl.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => {
      const i = +b.dataset.inc;
      const c = cart[i];
      if (orderType === 'topup' && !c.isTemp && c.quantity >= c.max_qty) { renderCart(); return; }
      if (orderType === 'adhoc' && !c.isTemp && !wardAllowsAboveMax && c.quantity >= c.max_qty) {
        toast(`${c.medicine_name} is capped at ${c.max_qty} for this ward — contact your pharmacist if you need more.`, true);
        renderCart(); return;
      }
      c.quantity++;
      renderCart();
    });
    listEl.querySelectorAll('input[type=number]').forEach(inp => {
      const i = +inp.id.replace('cart-qty-', '');
      inp.onchange = () => {
        let qty = Math.max(1, parseInt(inp.value, 10) || 1);
        const c = cart[i];
        if (orderType === 'topup' && !c.isTemp) qty = Math.min(qty, c.max_qty);
        if (orderType === 'adhoc' && !c.isTemp && !wardAllowsAboveMax && qty > c.max_qty) {
          toast(`${c.medicine_name} is capped at ${c.max_qty} for this ward.`, true);
          qty = c.max_qty;
        }
        c.quantity = qty;
        renderCart();
      };
    });
    listEl.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => { cart.splice(+b.dataset.remove, 1); renderCart(); });
  }

  document.getElementById('cart-submit').onclick = async () => {
    if (!cart.length) return;
    if (orderType === 'adhoc' && !wardAllowsAboveMax) {
      const blocked = cart.filter(c => !c.isTemp && c.quantity > c.max_qty);
      if (blocked.length) {
        toast(`This ward isn't authorised to order above max — fix ${blocked.map(c => c.medicine_name).join(', ')} before submitting.`, true);
        return;
      }
    }
    if (topupLockLost) { toast('You no longer hold ordering for this ward. Reload the page and start again.', true); return; }
    const submitBtn = document.getElementById('cart-submit');
    submitBtn.disabled = true;
    if (!topupLockHeldByMe) {
      // a screen that never took the ward's lock (for example a restored draft) must take it now; the database refuses the save otherwise
      const { data: got, error: lockErr2 } = await sb.rpc('acquire_topup_lock', { target_ward: orderWardId });
      if (lockErr2 || !got) { toast(lockErr2 ? lockErr2.message : 'Another person is ordering for this ward right now.', true); submitBtn.disabled = false; return; }
      topupLockHeldByMe = true; startTopupHeartbeat(orderWardId);
    }

    const { data: session, error: sessErr } = await sb.from('order_sessions')
      .insert({ ward_id: orderWardId, submitted_by: profile.id, order_type: orderType }).select().single();
    if (sessErr) { toast(sessErr.message, true); submitBtn.disabled = false; return; }

    const { error: linesErr } = await sb.from('orders').insert(cart.map(c => ({
      ward_id: orderWardId, ordered_by: profile.id, session_id: session.id,
      medicine_name: c.medicine_name, pack_size: c.pack_size || null, quantity: c.quantity, order_type: orderType,
      status: (orderType === 'adhoc' && !c.isTemp && c.quantity > c.max_qty) ? 'pending_approval' : 'pending',
    })));
    if (linesErr) {
      toast(`Order was not submitted — ${linesErr.message}`, true);
      submitBtn.disabled = false;
      return;
    }

    const anyAboveMax = orderType === 'adhoc' && cart.some(c => !c.isTemp && c.quantity > c.max_qty);
    toast(anyAboveMax
      ? `Order submitted — ${cart.length} item${cart.length > 1 ? 's' : ''} (some await pharmacist approval).`
      : `Order submitted — ${cart.length} item${cart.length > 1 ? 's' : ''}.`);
    cart = []; clearDraft();
    await releaseTopupLock(orderWardId);
    renderCart();
    loadRecent();
  };

  document.getElementById('cart-cancel').onclick = async () => {
    if (!cart.length) return;
    confirmDialog('Cancel this order', 'Discard everything added so far? This can\'t be undone.', 'Discard order', async () => {
      cart = []; clearDraft();
      await releaseTopupLock(orderWardId);
      renderCart();
      if (orderType === 'topup') renderWardOrder();
    }, true);
  };

  await loadRecent();
  async function loadRecent() {
    const since = new Date(Date.now() - (parseFloat(systemSettings.order_history_days) || 7) * 24 * 3600 * 1000).toISOString();
    const { data: sessionsData } = await sb.from('order_sessions').select('*').eq('ward_id', orderWardId)
      .gte('created_at', since).order('created_at', { ascending: false }).limit(20);
    const el = document.getElementById('ord-recent');
    if (!sessionsData?.length) { el.innerHTML = `<div class="empty">No orders submitted in the last 7 days.</div>`; return; }
    const { data: lines } = await sb.from('orders').select('*').in('session_id', sessionsData.map(s => s.id));
    const nameById = await fetchNameMap(lines || []);
    el.innerHTML = sessionsData.map(s => renderSessionCard(s, lines || [], nameById)).join('');
  }
}

(async () => {
  const p = await requireAuth({ require: (pr) => !!pr.can_order });
  if (!p) return;
  const requestedWardId = new URLSearchParams(window.location.search).get('ward');
  if (requestedWardId && myWards.some(w => w.id === requestedWardId)) orderWardId = requestedWardId;
  document.getElementById('main').innerHTML = '<div id="body"></div>';
  renderWardOrder();
})();
</script>
</body>
</html>
