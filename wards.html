<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Req — Wards</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="shared.css" />
</head>
<body data-page="wards.html">
<div id="app">
<header class="topbar">
    <div class="brand">
      
      <div>
        <div class="name">Stock Req</div>
        <div class="sub" data-ward-context></div>
      </div>
    </div>
    <div class="who">
      <span data-who-name></span>
      <button class="logout" data-logout>Log out</button>
    </div>
  </header>
  <div id="banner-root"></div>
  <div id="page-nav" class="tabs"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="shared.js"></script>
<script>
async function renderWards() {
  const body = document.getElementById('body');
  if (!sites.length) { body.innerHTML = `<div class="card"><div class="empty">Create a hospital site first, then add wards to it.</div></div>`; return; }

  const fullAccess = isSuperuser(); // top tier (developer or superuser) \u2014 full CRUD
  // Admin only gets suspend/activate, scoped to wards at sites they
  // themselves have access to \u2014 never full ward editing.
  let adminSiteIds = [];
  if (!fullAccess && isAdminRole()) {
    const { data: mySites } = await sb.from('user_sites').select('site_id').eq('user_id', profile.id);
    adminSiteIds = (mySites || []).map(s => s.site_id);
  }
  const visibleWards = fullAccess ? wards : wards.filter(w => adminSiteIds.includes(w.site_id));

  body.innerHTML = `
    ${fullAccess ? `<div class="card">
      <h2>Create ward</h2>
      <div class="row">
        <div><label>Site</label><select id="new-ward-site">${sites.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
        <div><label>Ward name</label><input type="text" id="new-ward-name" placeholder="e.g. ED Majors" /></div>
      </div>
      <button class="btn magenta" style="margin-top:14px;" id="create-ward-btn">Create ward</button>
    </div>` : ''}
    ${isDeveloper() ? `<div class="card">
      <h2>Bulk upload wards (Excel)</h2>
      <p class="muted">Upload an Excel or CSV file with a <b>Ward</b> column and, optionally, a <b>Site</b> column (matched to an existing site name). You can check and edit every name before anything is saved. Existing wards are never overwritten.</p>
      <input type="file" id="bulk-file" accept=".xlsx,.xls,.csv" />
      <button class="btn ghost small" id="bulk-template" style="margin-top:8px;">Download template</button>
      <div id="bulk-preview"></div>
    </div>` : ''}
    <div class="card"><h2>Wards</h2><div id="ward-list">Loading\u2026</div></div>`;

  if (fullAccess) {
    document.getElementById('create-ward-btn').onclick = async () => {
      const site_id = document.getElementById('new-ward-site').value;
      const name = document.getElementById('new-ward-name').value.trim();
      if (!name) return toast('Enter a ward name.', true);
      const { error } = await sb.from('wards').insert({ site_id, name });
      if (error) return toast(error.message, true);
      toast('Ward created.');
      document.getElementById('new-ward-name').value = '';
      await refreshSitesWards(); renderWards();
    };
  }

  if (isDeveloper()) {
    document.getElementById('bulk-template').onclick = () => {
      const ws = XLSX.utils.aoa_to_sheet([['Site', 'Ward'], [sites[0]?.name || 'Site name', 'Ward name']]);
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Wards');
      XLSX.writeFile(wb, 'ward-upload-template.xlsx');
    };
    document.getElementById('bulk-file').onchange = async (ev) => {
      const f = ev.target.files[0]; if (!f) return;
      const prev = document.getElementById('bulk-preview');
      let rows;
      try {
        const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      } catch (e) { prev.innerHTML = '<div class="modal-error">Could not read that file.</div>'; return; }
      rows = rows.filter(r => r.some(c => String(c).trim()));
      if (!rows.length) { prev.innerHTML = '<div class="empty">The file is empty.</div>'; return; }
      const head = rows[0].map(c => String(c).trim().toLowerCase());
      let wi = head.indexOf('ward'), si = head.indexOf('site');
      let data = rows;
      if (wi >= 0 || si >= 0) data = rows.slice(1); else { wi = 0; si = rows[0].length > 1 ? 0 : -1; if (rows[0].length > 1) { si = 0; wi = 1; } }
      if (wi < 0) wi = 0;
      const list = data.map(r => ({ name: String(r[wi] ?? '').trim(), site: si >= 0 ? String(r[si] ?? '').trim() : '' })).filter(x => x.name);
      const siteIdFor = (nm) => (sites.find(x => x.name.toLowerCase() === nm.toLowerCase()) || {}).id || '';
      prev.innerHTML = `<p class="muted" style="margin-top:12px;">${list.length} ward${list.length === 1 ? '' : 's'} found. Edit any name, choose a site, untick any you don't want, then import.</p>
        <table><thead><tr><th></th><th>Ward name</th><th>Site</th><th>Note</th></tr></thead><tbody>
        ${list.map((x, i) => `<tr data-i="${i}"><td><input type="checkbox" class="bk-on" checked /></td>
          <td><input type="text" class="bk-name" value="${esc(x.name)}" /></td>
          <td><select class="bk-site">${sites.map(st => `<option value="${st.id}" ${st.id === (siteIdFor(x.site) || sites[0].id) ? 'selected' : ''}>${esc(st.name)}</option>`).join('')}</select>${x.site && !siteIdFor(x.site) ? `<div class="muted" style="font-size:11px;">"${esc(x.site)}" not found</div>` : ''}</td>
          <td class="bk-note muted"></td></tr>`).join('')}
        </tbody></table>
        <button class="btn magenta" id="bulk-go" style="margin-top:12px;">Import selected wards</button>`;
      const check = () => {
        const seen = new Set();
        prev.querySelectorAll('tbody tr').forEach(tr => {
          const nm = tr.querySelector('.bk-name').value.trim(), st = tr.querySelector('.bk-site').value;
          const key = st + '|' + nm.toLowerCase();
          const dupe = wards.some(w => w.site_id === st && w.name.trim().toLowerCase() === nm.toLowerCase()) || seen.has(key);
          seen.add(key);
          tr.querySelector('.bk-note').textContent = !nm ? 'Name needed' : dupe ? 'Already exists \u2014 will be skipped' : '';
          tr.dataset.skip = (!nm || dupe) ? '1' : '';
        });
      };
      prev.querySelectorAll('input,select').forEach(e => e.oninput = e.onchange = check);
      check();
      document.getElementById('bulk-go').onclick = async () => {
        const toAdd = [...prev.querySelectorAll('tbody tr')].filter(tr => tr.querySelector('.bk-on').checked && !tr.dataset.skip)
          .map(tr => ({ name: tr.querySelector('.bk-name').value.trim(), site_id: tr.querySelector('.bk-site').value }));
        if (!toAdd.length) return toast('Nothing new to import.', true);
        const { error } = await sb.from('wards').insert(toAdd);
        if (error) return toast(error.message, true);
        toast(`${toAdd.length} ward${toAdd.length === 1 ? '' : 's'} imported.`);
        await refreshSitesWards(); renderWards();
      };
    };
  }

  const el = document.getElementById('ward-list');
  if (!visibleWards.length) { el.innerHTML = `<div class="empty">No wards yet.</div>`; return; }
  el.innerHTML = `<table><thead><tr><th>Name</th><th>Site</th><th>Status</th>${fullAccess ? (aboveMaxEnabled() ? '<th>Above-max adhoc</th>' : '') + (predictiveEnabled() ? '<th>Predictive ordering</th>' : '') + (alternativesEnabled() ? '<th>Stock substitution</th>' : '') : ''}<th></th></tr></thead><tbody>
    ${visibleWards.map(w => `<tr>
      <td>${esc(w.name)}</td><td>${w.site_id ? esc(siteName(w.site_id)) : '<span class="muted">Unassigned</span>'}</td>
      <td><span class="badge ${w.active ? 'active' : 'suspended'}">${w.active ? 'Active' : 'Inactive'}</span></td>
      ${fullAccess ? `${aboveMaxEnabled() ? `<td><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" class="above-max-cb" data-ward="${w.id}" ${w.allow_above_max_adhoc !== false ? 'checked' : ''} style="width:auto;" />Allowed</label></td>` : ''}
      ${predictiveEnabled() ? `<td><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" class="predictive-cb" data-ward="${w.id}" ${w.predictive_ordering_enabled ? 'checked' : ''} style="width:auto;" />Enabled</label></td>` : ''}
      ${alternativesEnabled() ? `<td><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" class="substitution-cb" data-ward="${w.id}" ${w.allow_stock_substitution ? 'checked' : ''} style="width:auto;" />Enabled</label></td>` : ''}` : ''}
      <td style="text-align:right;"><div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:330px; margin-left:auto;">
        ${fullAccess ? `
        <button class="btn small ghost" data-site="${w.id}">Set site</button>
        <button class="btn small ghost" data-topup="${w.id}">Top-up days</button>
        <button class="btn small ghost" data-rename="${w.id}">Rename</button>
        ` : ''}
        <button class="btn small ghost" data-toggle="${w.id}">${w.active ? 'Deactivate' : 'Activate'}</button>
        ${fullAccess ? `<button class="btn small danger" data-del="${w.id}">Delete</button>` : ''}
      </div></td>
    </tr>`).join('')}
  </tbody></table>`;

  el.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    const w = visibleWards.find(x => x.id === b.dataset.toggle);
    const { error } = await sb.rpc('set_ward_active', { target_ward: w.id, is_active: !w.active });
    if (error) return toast(error.message, true);
    toast(w.active ? 'Ward suspended.' : 'Ward reactivated.');
    await refreshSitesWards(); renderWards();
  });
  el.querySelectorAll('.above-max-cb').forEach(cb => cb.onchange = async () => {
    const { error } = await sb.from('wards').update({ allow_above_max_adhoc: cb.checked }).eq('id', cb.dataset.ward);
    if (error) { toast(error.message, true); cb.checked = !cb.checked; return; }
    toast(cb.checked ? 'Above-max adhoc orders now allowed for this ward.' : 'Above-max adhoc orders now blocked for this ward.');
    await refreshSitesWards();
  });
  el.querySelectorAll('.predictive-cb').forEach(cb => cb.onchange = async () => {
    const { error } = await sb.from('wards').update({ predictive_ordering_enabled: cb.checked }).eq('id', cb.dataset.ward);
    if (error) { toast(error.message, true); cb.checked = !cb.checked; return; }
    toast(cb.checked ? 'Predictive ordering enabled for this ward.' : 'Predictive ordering disabled for this ward.');
    await refreshSitesWards();
  });
  el.querySelectorAll('.substitution-cb').forEach(cb => cb.onchange = async () => {
    const { error } = await sb.from('wards').update({ allow_stock_substitution: cb.checked }).eq('id', cb.dataset.ward);
    if (error) { toast(error.message, true); cb.checked = !cb.checked; return; }
    toast(cb.checked ? 'Stock substitution now allowed for this ward.' : 'Stock substitution now blocked for this ward.');
    await refreshSitesWards();
  });
  el.querySelectorAll('[data-rename]').forEach(b => b.onclick = () => {
    const w = wards.find(x => x.id === b.dataset.rename);
    openModal(`<h3>Rename ward</h3><label>Name</label><input type="text" id="rn-input" value="${esc(w.name)}" />
      <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn magenta" id="rn-save">Save</button></div>`);
    document.getElementById('rn-save').onclick = async () => {
      const name = document.getElementById('rn-input').value.trim();
      if (!name) return;
      const { error } = await sb.from('wards').update({ name }).eq('id', w.id);
      closeModal();
      if (error) return toast(error.message, true);
      await refreshSitesWards(); renderWards();
    };
  });
  el.querySelectorAll('[data-site]').forEach(b => b.onclick = () => {
    const w = wards.find(x => x.id === b.dataset.site);
    openModal(`<h3>Set site for ${esc(w.name)}</h3><label>Site</label>
      <select id="sw-select">${sites.map(s => `<option value="${s.id}" ${s.id === w.site_id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
      <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn magenta" id="sw-save">Save</button></div>`);
    document.getElementById('sw-save').onclick = async () => {
      const site_id = document.getElementById('sw-select').value;
      const { error } = await sb.from('wards').update({ site_id }).eq('id', w.id);
      closeModal();
      if (error) return toast(error.message, true);
      await refreshSitesWards(); renderWards();
    };
  });
  el.querySelectorAll('[data-topup]').forEach(b => b.onclick = () => {
    openTopupModal(wards.find(x => x.id === b.dataset.topup), renderWards);
  });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const w = wards.find(x => x.id === b.dataset.del);
    const name = w ? w.name : 'this ward';
    // Three separate confirmations before a ward can be deleted.
    confirmDialog('Delete ward (1 of 3)', `Delete <b>${esc(name)}</b>? This also deletes its stocklist and order history. This cannot be undone.`, 'Continue', () => {
      confirmDialog('Delete ward (2 of 3)', `Are you sure? Everyone allocated to <b>${esc(name)}</b> will lose it, and its stocklist and orders will be permanently removed.`, 'Yes, continue', () => {
        openModal(`${modalIcon('warn')}<h3>Delete ward (3 of 3)</h3>
          <p class="muted">Final check. Type the ward name <b>${esc(name)}</b> to delete it permanently.</p>
          <input type="text" id="del-ward-name" autocomplete="off" />
          <div class="modal-error" id="del-ward-error"></div>
          <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="del-ward-go">Delete ward</button></div>`);
        document.getElementById('del-ward-go').onclick = async () => {
          if (document.getElementById('del-ward-name').value.trim().toLowerCase() !== name.trim().toLowerCase()) {
            document.getElementById('del-ward-error').textContent = 'The name does not match.'; return;
          }
          const { error } = await sb.from('wards').delete().eq('id', b.dataset.del);
          if (error) { document.getElementById('del-ward-error').textContent = error.message; return; }
          closeModal();
          toast('Ward deleted.');
          await refreshSitesWards(); renderWards();
        };
      }, true);
    }, true);
  });
}

(async () => {
  const p = await requireAuth({ require: () => canManageWardsSites() });
  if (!p) return;
  document.getElementById('main').innerHTML = '<div id="body"></div>';
  renderWards();
})();
</script>
</body>
</html>
