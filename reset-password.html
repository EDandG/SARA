<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SARA — Choose a new passcode</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>

<div id="reset-screen">
  <div class="login-card">
    
    <h1 style="font-size:18px;">Choose a new passcode</h1>
    <div class="tag">Required before you can continue</div>
    <label>New passcode (min. 12 characters)</label>
    <input type="password" id="reset-new-pass" autocomplete="new-password" />
    <label>Confirm new passcode</label>
    <input type="password" id="reset-confirm-pass" autocomplete="new-password" onkeydown="if(event.key==='Enter')doPasswordReset()" />
    <div class="login-error" id="reset-error"></div>
    <button class="btn magenta" onclick="doPasswordReset()">Set passcode &amp; continue</button>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="shared.js"></script>
<script>
// This page is only reachable mid-flow: not authenticated -> login.html,
// authenticated and NOT needing a reset -> home.html.
(async () => {
  const { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = 'login.html'; return; }
  const { data: p } = await sb.from('profiles').select('*').eq('id', data.session.user.id).single();
  if (!p) { await sb.auth.signOut(); window.location.href = 'login.html'; return; }
  if (!p.active) { await sb.auth.signOut(); window.location.href = 'login.html?deactivated=1'; return; }
  if (!p.must_reset_password) { window.location.href = 'home.html'; return; }
})();

window.doPasswordReset = async function () {
  const p1 = document.getElementById('reset-new-pass').value;
  const p2 = document.getElementById('reset-confirm-pass').value;
  const errEl = document.getElementById('reset-error');
  errEl.textContent = '';
  if (!p1 || p1.length < 12) { errEl.textContent = 'Passcode must be at least 12 characters.'; return; }
  if (p1 !== p2) { errEl.textContent = 'Passcodes do not match.'; return; }

  const { error: updErr } = await sb.auth.updateUser({ password: p1 });
  if (updErr) { errEl.textContent = updErr.message; return; }

  // must_reset_password is cleared server-side by a trigger on the
  // actual auth.users password change above (see schema.sql) — no
  // client RPC involved, and none is needed here.
  window.location.href = 'home.html';
};
</script>
</body>
</html>
