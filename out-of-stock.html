<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StockFlow™ — Out of stock</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="shared.css" />
</head>
<body data-page="out-of-stock.html">
<div id="app">
<header class="topbar">
    <div class="brand">
      
      <div>
        <div class="name">StockFlow™</div>
        <div class="sub" data-ward-context></div>
      </div>
    </div>
    <div class="who">
      <span data-who-name></span>
      <button class="logout" data-logout>Log out</button>
    </div>
  </header>
  <div id="banner-root"></div>
  <div id="page-nav" class="tabs"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
<script src="shared.js"></script>
<script>
function downloadFollowPdf(rows, nameById) {
  if (!rows.length) return toast('Nothing to print.', true);
  const jsPDF = window.jspdf?.jsPDF; if (!jsPDF) return toast('PDF library not loaded.', true);
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 14; let y = 18;
  const head = () => { doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text('Ward', M, y); doc.text('Medicine', 58, y); doc.text('Qty', 140, y); doc.text('Type', 154, y); doc.text('Supplied', 178, y); y += 2; doc.line(M, y, W - M, y); y += 5; doc.setFont('helvetica', 'normal'); };
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text('To follow list', M, y); y += 6;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.text('Printed ' + new Date().toLocaleString('en-GB') + ' \u2014 ' + rows.length + ' item(s)', M, y); y += 8;
  head();
  const sorted = [...rows].sort((a, b) => wardName(a.ward_id).localeCompare(wardName(b.ward_id)) || a.medicine_name.localeCompare(b.medicine_name));
  sorted.forEach(o => {
    const med = doc.splitTextToSize(String(o.medicine_name).replace(/^\[Temp stock\] /, '') + (o.pack_size ? ' (' + o.pack_size + ')' : ''), 78);
    const h = Math.max(med.length * 4.2, 5) + 2;
    if (y + h > 285) { doc.addPage(); y = 18; head(); }
    doc.text(doc.splitTextToSize(wardName(o.ward_id), 42), M, y);
    doc.text(med, 58, y); doc.text(String(o.quantity), 140, y);
    doc.text(o.status === 'non_urgent' ? 'Non-urgent' : o.parent_order_id ? 'To follow' : 'Out of stock', 154, y);
    doc.rect(180, y - 3, 4, 4); // tick box
    y += h;
  });
  doc.save('to-follow-list-' + new Date().toISOString().slice(0, 10) + '.pdf');
}

async function renderOutOfStock() {
  const body = document.getElementById('body');
  const { data, error } = await sb.from('orders').select('*').in('status', ['out_of_stock', 'non_urgent']).order('created_at');
  if (error) { body.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  const nameById = await fetchNameMap(data || []);
  body.innerHTML = `<div class="card"><h2>Out of stock</h2>
    <div style="float:right;"><button class="btn small ghost" id="print-follow">Print list (PDF)</button></div>
    <p class="muted">Click an item once it's ready to mark it supplied and record the date/time. Includes items marked out of stock, part-order remainders, and items marked non-urgent.</p>
    ${!data?.length ? `<div class="empty">Nothing currently sitting here.</div>` : `
    <table><thead><tr><th>Ward</th><th>Medicine</th><th>Qty</th><th></th></tr></thead><tbody>
      ${data.map(o => `<tr><td>${esc(wardName(o.ward_id))}</td><td>${esc(o.medicine_name)}${packTag(o)}
        ${o.parent_order_id ? '<span class="badge part_supplied">To follow</span>' : ''}
        ${o.status === 'non_urgent' ? '<span class="badge non_urgent">Non-urgent</span>' : ''}
        ${attribution('Marked by', nameById[o.processed_by], o.processed_at)}</td><td>${o.quantity}</td>
        <td style="text-align:right; white-space:nowrap;">${o.session_id ? `<button class="btn small ghost" data-viewreq="${o.session_id}">View request</button> ` : ''}<button class="btn small magenta" data-supplied="${o.id}">Mark supplied</button></td></tr>`).join('')}
    </tbody></table>`}
  </div>`;
  const pf = document.getElementById('print-follow');
  if (pf) pf.onclick = () => downloadFollowPdf(data || [], nameById);
  body.querySelectorAll('[data-viewreq]').forEach(b => b.onclick = () => openRequestSummary(b.dataset.viewreq));
  body.querySelectorAll('[data-supplied]').forEach(b => b.onclick = async () => {
    const { error } = await sb.rpc('mark_supplied', { target_order: b.dataset.supplied });
    if (error) return toast(error.message, true);
    toast('Marked supplied.');
    renderOutOfStock();
  });
}

(async () => {
  const p = await requireAuth({ require: (pr) => !!pr.can_process });
  if (!p) return;
  document.getElementById('main').innerHTML = '<div id="body"></div>';
  renderOutOfStock();
})();
</script>
</body>
</html>
