<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Req — Logs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="shared.css" />
<script src="vendor/xlsx.full.min.js"></script>
</head>
<body data-page="logs.html">
<div id="app">
<header class="topbar">
    <div class="brand">
      
      <div>
        <div class="name">Stock Req</div>
        <div class="sub" data-ward-context></div>
      </div>
    </div>
    <div class="who">
      <span data-who-name></span>
      <button class="logout" data-logout>Log out</button>
    </div>
  </header>
  <div id="banner-root"></div>
  <div id="page-nav" class="tabs"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="shared.js"></script>
<script>async function fetchAllOrdersEnriched() {
  const [{ data: orderRows }] = await Promise.all([
    sb.from('orders').select('*').order('created_at', { ascending: false }),
  ]);
  const { data: userRows } = await sb.from('profiles').select('id, full_name');
  const nameById = Object.fromEntries((userRows || []).map(u => [u.id, u.full_name]));
  return (orderRows || []).map(o => {
    const ward = wards.find(w => w.id === o.ward_id);
    return {
      ...o,
      _wardName: ward?.name || '',
      _siteName: ward?.site_id ? siteName(ward.site_id) : '',
      _orderedByName: nameById[o.ordered_by] || '',
      _processedByName: nameById[o.processed_by] || '',
    };
  });
}

async function renderLogs() {
  const body = document.getElementById('body');
  const { count } = await sb.from('orders').select('*', { count: 'exact', head: true });
  const { count: loginCount } = await sb.from('login_events').select('*', { count: 'exact', head: true });
  const { count: histCount } = await sb.from('blist_item_history').select('*', { count: 'exact', head: true });
  const { data: stRows } = await sb.from('system_settings').select('key, value').in('key', ['orders_cleared', 'audit_log_cleared']);
  (stRows || []).forEach(r => { systemSettings[r.key] = r.value; });
  body.innerHTML = `
    <div class="card">
      <h2>Export logs</h2>
      <p class="muted">Every order across every site and ward, as an Excel file.</p>
      <label>Scope</label>
      <select id="export-scope">
        <option value="all">All sites</option>
        ${sites.map(s => `<option value="${s.id}">${esc(s.name)} only</option>`).join('')}
      </select>
      <button class="btn magenta" id="export-logs-btn" style="margin-top:14px;">Download logs (Excel)</button>
    </div>
    <div class="card">
      <h2>Clear all orders</h2>
      <p class="muted">Permanently deletes every order and every submission session across the whole system (${count ?? 0} order record${count === 1 ? '' : 's'} currently). Users, wards, sites and stocklists are not touched. This cannot be undone \u2014 download the export above first if you need a record.</p>
      ${systemSettings.orders_cleared ? `<p class="muted" style="font-size:12px;">Last cleared: ${esc(systemSettings.orders_cleared)}</p>` : ''}
      <button class="btn danger" id="clear-logs-btn">Clear all orders\u2026</button>
    </div>
    <div class="card">
      <h2>Clear audit log</h2>
      <p class="muted">Permanently deletes the login / logout history (${loginCount ?? 0} event${loginCount === 1 ? '' : 's'}) and the stocklist change history (${histCount ?? 0} change${histCount === 1 ? '' : 's'}). Orders, users and current stocklists are not touched, and nobody is signed out.</p>
      ${systemSettings.audit_log_cleared ? `<p class="muted" style="font-size:12px;">Last cleared: ${esc(systemSettings.audit_log_cleared)}</p>` : ''}
      <button class="btn ghost" id="export-audit-btn">Download audit log (Excel)</button>
      <button class="btn danger" id="clear-audit-btn">Clear audit log\u2026</button>
    </div>`;

  document.getElementById('export-logs-btn').onclick = async () => {
    const scope = document.getElementById('export-scope').value;
    let rows = await fetchAllOrdersEnriched();
    let filenamePart = 'all-logs';
    if (scope !== 'all') {
      const scopedWardIds = new Set(wards.filter(w => w.site_id === scope).map(w => w.id));
      rows = rows.filter(r => scopedWardIds.has(r.ward_id));
      filenamePart = `${siteName(scope).toLowerCase().replace(/[^a-z0-9]+/g, '-')}-logs`;
    }
    if (!rows.length) return toast('Nothing to export.', true);
    exportRowsToExcel(rows, `stock-req-${filenamePart}-${new Date().toISOString().slice(0, 10)}.xlsx`);
  };

  // Shared "are you really sure" step: type the word, re-enter the password, then call the RPC.
  function confirmWipe({ title, text, word, rpc, done }) {
    openModal(`<h3>${esc(title)}</h3>
      <p>${text}</p>
      <label>Type <b>${esc(word)}</b> to confirm</label>
      <input type="text" id="wipe-word" autocomplete="off" />
      <label style="margin-top:8px;">Re-enter your password</label>
      <input type="password" id="wipe-pw" autocomplete="current-password" />
      <div class="modal-error" id="wipe-error"></div>
      <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="wipe-confirm">${esc(title)}</button></div>`);
    document.getElementById('wipe-confirm').onclick = async () => {
      const errEl = document.getElementById('wipe-error');
      if (document.getElementById('wipe-word').value.trim() !== word) { errEl.textContent = `Type ${word} exactly to continue.`; return; }
      const pw = document.getElementById('wipe-pw').value;
      if (!pw) { errEl.textContent = 'Enter your password.'; return; }
      const btn = document.getElementById('wipe-confirm'); btn.disabled = true;
      const { data: { session } } = await sb.auth.getSession();
      const { error: authErr } = await sb.auth.signInWithPassword({ email: session.user.email, password: pw });
      if (authErr) { errEl.textContent = 'Incorrect password.'; btn.disabled = false; return; }
      const { data: n, error } = await sb.rpc(rpc);
      if (error) { errEl.textContent = error.message; btn.disabled = false; return; }
      closeModal();
      toast(`${done} (${n ?? 0} record${n === 1 ? '' : 's'} removed).`);
      renderLogs();
    };
  }
  document.getElementById('clear-logs-btn').onclick = () => confirmWipe({
    title: 'Clear all orders', word: 'CLEAR ORDERS', rpc: 'clear_all_orders', done: 'All orders cleared',
    text: 'This permanently deletes <b>every order and submission session</b> for every site and ward. It cannot be undone.' });
  document.getElementById('clear-audit-btn').onclick = () => confirmWipe({
    title: 'Clear audit log', word: 'CLEAR AUDIT', rpc: 'clear_audit_log', done: 'Audit log cleared',
    text: 'This permanently deletes the <b>login / logout history and the stocklist change history</b>. It cannot be undone.' });
  document.getElementById('export-audit-btn').onclick = async () => {
    const [{ data: ev }, { data: hist }, { data: ppl }] = await Promise.all([
      sb.from('login_events').select('*').order('created_at', { ascending: false }),
      sb.from('blist_item_history').select('*').order('changed_at', { ascending: false }),
      sb.from('profiles').select('id, full_name'),
    ]);
    const nm = Object.fromEntries((ppl || []).map(p => [p.id, p.full_name]));
    const rows = [
      ...(ev || []).map(e => ({ when: e.created_at, kind: 'Login event', who: nm[e.user_id] || '', detail: e.event_type, ward: '' })),
      ...(hist || []).map(h => ({ when: h.changed_at, kind: 'Stocklist change', who: nm[h.changed_by] || '', detail: `${h.change_type}: ${h.medicine_name} ${h.old_value ?? ''} \u2192 ${h.new_value ?? ''}`, ward: wardName(h.ward_id) })),
    ].sort((x, y) => String(y.when).localeCompare(String(x.when)));
    if (!rows.length) return toast('Nothing to export.', true);
    exportRowsToExcel(rows, `stock-req-audit-log-${new Date().toISOString().slice(0, 10)}.xlsx`);
  };
}

(async () => {
  const p = await requireAuth({ require: (pr) => ['developer','superuser'].includes(pr.role) });
  if (!p) return;
  document.getElementById('main').innerHTML = '<div id="body"></div>';
  renderLogs();
})();
</script>
</body>
</html>
