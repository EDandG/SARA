<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Req — Picking List</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="shared.css" />
</head>
<body data-page="picking-list.html">
<div id="app">
<header class="topbar">
    <div class="brand">
      
      <div>
        <div class="name">Stock Req</div>
        <div class="sub" data-ward-context></div>
      </div>
    </div>
    <div class="who">
      <span data-who-name></span>
      <button class="logout" data-logout>Log out</button>
    </div>
  </header>
  <div id="banner-root"></div>
  <div id="page-nav" class="tabs"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/supabase.js"></script>
<script src="shared.js"></script>
<style>
  /* Print-specific layout — deliberately plain (no card shadows,
     rounded corners or brand chrome) since this is a physical
     document someone marks up by hand, not an on-screen surface. */
  .picking-sheet { background: #fff; border: 1px solid var(--border-soft); border-radius: 10px; padding: 28px 32px; }
  .picking-sheet h1 { font-size: 19px; margin: 0 0 2px; color: var(--navy); }
  .picking-sheet .meta { display: flex; flex-wrap: wrap; gap: 24px; margin: 14px 0 20px; font-size: 13px; color: var(--text-dim); }
  .picking-sheet .meta strong { color: var(--text); font-weight: 600; }
  .picking-sheet table { width: 100%; border-collapse: collapse; }
  .picking-sheet th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); padding: 8px 10px; border-bottom: 2px solid var(--border); }
  .picking-sheet td { padding: 10px; border-bottom: 1px solid var(--border-soft); font-size: 13.5px; vertical-align: middle; }
  .mark-box { display: inline-block; width: 16px; height: 16px; border: 1.5px solid var(--text-dim); border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  .mark-cell { white-space: nowrap; }
  .sign-off { margin-top: 36px; display: flex; gap: 48px; flex-wrap: wrap; }
  .sign-off .field { flex: 1; min-width: 200px; }
  .sign-off .field .line { border-bottom: 1px solid var(--text); height: 34px; }
  .sign-off .field .label { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }
  @media print {
    header.topbar, #page-nav, #banner-root, .no-print { display: none !important; }
    main { max-width: none; padding: 0; margin: 0; }
    body { background: #fff; }
    .picking-sheet { border: none; border-radius: 0; padding: 0; box-shadow: none; }
  }
</style>
<script>
async function renderPickingList() {
  const body = document.getElementById('body');
  const sessionId = new URLSearchParams(window.location.search).get('session');
  if (!sessionId) { body.innerHTML = `<div class="empty">No request specified.</div>`; return; }

  const { data: s, error: sErr } = await sb.from('order_sessions').select('*').eq('id', sessionId).single();
  if (sErr || !s) { body.innerHTML = `<div class="empty">${esc(sErr?.message || 'Not found')}</div>`; return; }
  const { data: lines } = await sb.from('orders').select('*').eq('session_id', sessionId).is('parent_order_id', null).order('medicine_name');

  body.innerHTML = `
    <div class="card no-print">
      <p class="muted" style="margin-top:0;" id="pl-note">Preparing your PDF\u2026 it downloads automatically. If it doesn't, use the button below.</p>
      <button class="btn magenta" id="print-btn">Download PDF</button>
    </div>
    <div class="picking-sheet">
      <h1>Picking list</h1>
      <div class="meta">
        <div><strong>${esc(wardName(s.ward_id))}</strong></div>
        <div>${s.order_type === 'topup' ? 'Top-up' : 'Adhoc'} request</div>
        <div>Submitted ${fmtDate(s.created_at)}</div>
        <div>Picked by: <strong>${esc(profile.full_name)}</strong></div>
        <div>Printed: ${fmtDate(new Date().toISOString())}</div>
      </div>
      <table>
        <thead><tr><th>Medicine</th><th>Qty</th><th>To follow</th><th>Part order</th><th>Out of stock</th></tr></thead>
        <tbody>
          ${(lines || []).map(o => `<tr>
            <td>${esc(o.medicine_name)}${packTag(o)}</td>
            <td>${o.quantity}</td>
            <td class="mark-cell"><span class="mark-box"></span></td>
            <td class="mark-cell"><span class="mark-box"></span></td>
            <td class="mark-cell"><span class="mark-box"></span></td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="sign-off">
        <div class="field"><div class="line"></div><div class="label">Picked by (print name): ${esc(profile.full_name)}</div></div>
        <div class="field"><div class="line"></div><div class="label">Checked by (print name)</div></div>
        <div class="field"><div class="line"></div><div class="label">Checked by (signature)</div></div>
        <div class="field"><div class="line"></div><div class="label">Date</div></div>
      </div>
    </div>`;

  const download = () => downloadPickingPdf(s, lines || []);
  document.getElementById('print-btn').onclick = download;

  // Record the download once, best-effort — doesn't block showing the sheet.
  sb.rpc('mark_picking_list_printed', { target_session: sessionId });

  setTimeout(() => {
    try {
      download();
      document.getElementById('pl-note').textContent = 'PDF downloaded. You can close this tab, or download it again below.';
      if (window.opener) setTimeout(() => window.close(), 1200);
    } catch (e) {
      document.getElementById('pl-note').textContent = 'Could not create the PDF: ' + e.message;
    }
  }, 300);
}

// Builds the picking list as a real PDF and downloads it \u2014 no print dialog.
function downloadPickingPdf(s, lines) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const M = 40, navy = [19, 38, 74], dim = [110, 118, 135];
  // jsPDF's built-in font covers Latin-1 only \u2014 swap common typographic characters.
  const clean = (t) => String(t ?? '').replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/\u00b7/g, '-').replace(/[^\x20-\x7e\u00a0-\u00ff]/g, '');
  const colQty = M + 300, colTf = M + 345, colPart = M + 405, colOos = M + 470;
  let y = M, page = 1;

  const header = () => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(...navy);
    doc.text('Picking list', M, y + 14); y += 28;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...dim);
    const meta = [
      `${clean(wardName(s.ward_id))}  |  ${s.order_type === 'topup' ? 'Top-up' : 'Adhoc'} request`,
      `Submitted ${clean(fmtDate(s.created_at))}  |  Picked by: ${clean(profile.full_name)}  |  Downloaded: ${clean(fmtDate(new Date().toISOString()))}`,
    ];
    meta.forEach((m) => { doc.text(m, M, y + 10); y += 14; });
    y += 8;
  };
  const tableHead = () => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...dim);
    doc.text('MEDICINE', M, y + 8); doc.text('QTY', colQty, y + 8);
    doc.text('TO FOLLOW', colTf - 6, y + 8); doc.text('PART ORDER', colPart - 6, y + 8); doc.text('OUT OF STOCK', colOos - 8, y + 8);
    y += 14; doc.setDrawColor(...navy); doc.setLineWidth(1.2); doc.line(M, y, W - M, y); y += 4;
  };
  const footer = () => {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...dim);
    doc.text(`Stock Req - Page ${page}`, W - M, H - 20, { align: 'right' });
  };

  header(); tableHead();
  doc.setFontSize(10.5);
  lines.forEach((o) => {
    doc.setFont('helvetica', 'normal'); doc.setTextColor(30, 35, 50);
    const label = clean(o.medicine_name + (o.pack_size ? ` (${o.pack_size})` : ''));
    const wrapped = doc.splitTextToSize(label, 285);
    const rowH = Math.max(24, wrapped.length * 13 + 10);
    if (y + rowH > H - 60) { footer(); doc.addPage(); page++; y = M; tableHead(); doc.setFontSize(10.5); }
    doc.text(wrapped, M, y + 15);
    doc.text(String(o.quantity), colQty, y + 15);
    doc.setDrawColor(...dim); doc.setLineWidth(0.8);
    [colTf + 4, colPart + 8, colOos + 12].forEach((x) => doc.rect(x, y + 5, 13, 13));
    y += rowH; doc.setDrawColor(225, 228, 235); doc.setLineWidth(0.5); doc.line(M, y, W - M, y);
  });

  // sign-off block (keep together on one page)
  if (y + 150 > H - 40) { footer(); doc.addPage(); page++; y = M; }
  y += 34;
  const field = (x, w, label) => {
    doc.setDrawColor(30, 35, 50); doc.setLineWidth(0.8); doc.line(x, y + 22, x + w, y + 22);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...dim); doc.text(label, x, y + 34);
  };
  const half = (W - 2 * M - 30) / 2;
  field(M, half, `Picked by (print name): ${clean(profile.full_name)}`); field(M + half + 30, half, 'Checked by (print name)'); y += 58;
  field(M, half, 'Checked by (signature)'); field(M + half + 30, half, 'Date');
  footer();

  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  doc.save(`picking-list-${clean(wardName(s.ward_id)).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '')}-${stamp}.pdf`);
}

(async () => {
  const p = await requireAuth({ require: (pr) => !!pr.can_process });
  if (!p) return;
  document.getElementById('main').innerHTML = "<div id='body'></div>";
  renderPickingList();
})();
</script></script>
</body>
</html>
