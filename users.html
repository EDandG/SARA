<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Req — Users</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="shared.css" />
</head>
<body data-page="users.html">
<div id="app">
<header class="topbar">
    <div class="brand">
      
      <div>
        <div class="name">Stock Req</div>
        <div class="sub" data-ward-context></div>
      </div>
    </div>
    <div class="who">
      <span data-who-name></span>
      <button class="logout" data-logout>Log out</button>
    </div>
  </header>
  <div id="banner-root"></div>
  <div id="page-nav" class="tabs"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="shared.js"></script>
<script>async function renderUsers() {
  const body = document.getElementById('body');

  if (isWardManager() && !isAdminRole() && !isSuperuser()) return renderWardManagerNurseList();

  let scopeSiteIds = [];
  if (isAdminRole()) {
    const { data: mySites } = await sb.from('user_sites').select('site_id').eq('user_id', profile.id);
    scopeSiteIds = (mySites || []).map(s => s.site_id);
  }
  const wardsForForm = (isAdminRole()) ? wards.filter(w => scopeSiteIds.includes(w.site_id)) : wards;

  const { data: titleRows } = await sb.from('titles').select('name').order('name');
  let roleOptions = (titleRows || []).map(t => t.name);
  if (isDeveloper()) roleOptions = [...roleOptions, 'governance', 'superuser'];
  else if (isSuperuser()) roleOptions = [...roleOptions, 'governance'];
  // A title is just a label now — it grants nothing on its own, so
  // every tickbox below is offered regardless of which one is chosen.
  // The backend enforces who can actually be seen or managed; this is
  // only a display narrowing on top of that.
  const visibleFilter = isSuperuser() ? () => true : (u) => !['developer', 'superuser', 'governance'].includes(u.role);

  body.innerHTML = `
    <div class="card">
      <h2>Invite by email</h2>
      <p class="muted">Set up a group once: choose the title, tick the permissions and pick the wards, then paste their email addresses. Each person gets a personal link and only has to enter their name and choose a password &mdash; their access is already in place. Send a different group by changing the settings and sending again.</p>
      <label>Email addresses <span class="muted" style="font-weight:400;">(one per line, or separated by commas)</span></label>
      <textarea id="iv-emails" rows="4" spellcheck="false" style="width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font:inherit; font-size:14px;" placeholder="name@example.nhs.uk"></textarea>
      <div class="row" style="margin-top:10px;">
        <div><label>Title <span class="muted" style="font-weight:400;">(a label only)</span></label><select id="iv-role">${roleOptions.map(r => `<option value="${r}">${roleLabel(r)}</option>`).join('')}</select></div>
      </div>
      <div style="margin-top:10px;"><label>Permissions</label><div class="perm-grid" id="iv-perms"></div></div>
      <div style="margin-top:10px;"><label>Wards <span class="muted" style="font-weight:400;">(ward access they will have from day one)</span></label><div id="iv-wards"></div></div>
      <div style="margin-top:10px;"><label>Site access <span class="muted" style="font-weight:400;">(only needed for approving orders or managing users, stocklists or wards)</span></label>
        <div class="checklist">${sites.map(s => `<label><input type="checkbox" class="iv-site-cb" value="${s.id}">${esc(s.name)}</label>`).join('') || '<span class="muted">No sites yet.</span>'}</div></div>
      <button class="btn magenta" style="margin-top:14px;" id="iv-send">Send invitations</button>
      <div id="iv-result" style="margin-top:14px;"></div>
    </div>
    <div class="card"><h2>Invitations</h2><div id="iv-list">Loading\u2026</div></div>
    <div class="card">
      <h2>Create login</h2>
      <div class="row">
        <div><label>First name</label><input type="text" id="nu-first" maxlength="60" autocomplete="off" /></div>
        <div><label>Last name</label><input type="text" id="nu-last" maxlength="60" autocomplete="off" /></div>
        <div><label>User ID <span class="muted" id="nu-userid-status" style="font-weight:400;"></span></label><input type="text" id="nu-userid" autocapitalize="off" spellcheck="false" placeholder="e.g. jsmith" /></div>
        <div><label>Temporary passcode</label>
          <div style="display:flex; gap:6px;">
            <input type="password" id="nu-pass" style="flex:1;" />
            <button type="button" class="btn ghost small" id="nu-pass-toggle" style="white-space:nowrap;">Show</button>
          </div>
        </div>
      </div>
      <p class="muted" style="margin-top:6px; font-size:11.5px;">New logins start inactive and must change their passcode on first login — activate them from the list below once set up.</p>
      <div class="row" style="margin-top:10px;">
        <div><label>Title <span class="muted" style="font-weight:400;">(a label only — tick whatever this account actually needs below)</span></label><select id="nu-role">${roleOptions.map(r => `<option value="${r}">${roleLabel(r)}</option>`).join('')}</select></div>
      </div>
      <div id="nu-clinical-fields"></div>
      <div id="nu-site-fields"></div>
      <button class="btn magenta" style="margin-top:14px;" id="create-user-btn">Create login</button>
    </div>
    <div class="card"><h2>Logins</h2><div id="user-list">Loading\u2026</div></div>`;
  applySubtabs(body, [
    { id: 'logins', label: 'Logins', heads: ['Logins'] },
    { id: 'add', label: 'Add people', heads: ['Invite by email', 'Invitations', 'Create login'] },
  ], 'logins');

  const formSites = sites.filter(s => wardsForForm.some(w => w.site_id === s.id));
  let formCheckedWards = new Set();

  function renderRoleDependentFields() {
    const clinicalWrap = document.getElementById('nu-clinical-fields');
    const siteWrap = document.getElementById('nu-site-fields');

    clinicalWrap.innerHTML = `
      <div class="perm-grid">
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-order" style="width:auto;"> Order stock</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-process" style="width:auto;"> Process stock</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-check-picking" style="width:auto;"> Can check picked requests</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-dashboard" style="width:auto;"> Can see the daily dashboard</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-nonurgent" style="width:auto;"> Can mark non-urgent</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-freetext" style="width:auto;"> Temp stock (order any catalog drug)</label></div>
      </div>
      <div class="perm-grid">
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-manage-users" style="width:auto;"> Manage users (site-scoped)</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-manage-ward-staff" style="width:auto;"> Manage ward staff (ward-scoped)</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-manage-stocklists" style="width:auto;"> Manage stocklists</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-manage-wards-sites" style="width:auto;"> Manage wards &amp; sites</label></div>
        ${isDeveloper() ? `<div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-view-bi" style="width:auto;"> Business Intelligence access</label></div>` : ''}
      </div>
      <div style="margin-top:10px;">
        <label>Sites (tick one or more to reveal their wards below)</label>
        <div class="checklist">${formSites.map(s => `<label><input type="checkbox" class="nu-site-scope-cb" value="${s.id}">${esc(s.name)}</label>`).join('') || '<span class="muted">No sites available to you yet.</span>'}</div>
      </div>
      <div style="margin-top:10px;">
        <label>Ward access (a login can be allocated to more than one)</label>
        <div id="nu-ward-groups"><span class="muted">Tick one or more sites above to see their wards.</span></div>
      </div>`;
    siteWrap.innerHTML = `
      <div style="margin-top:10px;">
        <label>Approval access <span class="muted" style="font-weight:400;">(which sites this login can approve above-max or restricted-reorder requests for — independent of their own ward access; requires "Approve orders" to actually be ticked below)</span></label>
        <div class="checklist">${sites.map(s => `<label><input type="checkbox" class="nu-approval-site-cb" value="${s.id}">${esc(s.name)}</label>`).join('') || '<span class="muted">No sites yet.</span>'}</div>
      </div>
      <div style="margin-top:6px;"><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="nu-can-approve" style="width:auto;"> Approve orders</label></div>
      <div style="margin-top:10px;">
        <label>Site access <span class="muted" style="font-weight:400;">(for Manage users / Manage stocklists / Manage wards &amp; sites — which sites this login can manage)</span></label>
        <div class="checklist">${sites.map(s => `<label><input type="checkbox" class="nu-site-cb" value="${s.id}">${esc(s.name)}</label>`).join('') || '<span class="muted">No sites yet.</span>'}</div>
      </div>`;

    const checkedWards = formCheckedWards;
    checkedWards.clear();
    const updateWardGroups = () => {
      document.querySelectorAll('.nu-ward-cb').forEach(cb => { if (cb.checked) checkedWards.add(cb.value); else checkedWards.delete(cb.value); });
      const tickedSites = [...document.querySelectorAll('.nu-site-scope-cb:checked')].map(c => c.value);
      const groupsEl = document.getElementById('nu-ward-groups');
      if (!tickedSites.length) { groupsEl.innerHTML = '<span class="muted">Tick one or more sites above to see their wards.</span>'; return; }
      groupsEl.innerHTML = tickedSites.map(sid => {
        const siteWards = wardsForForm.filter(w => w.site_id === sid);
        return `<div style="margin-bottom:10px;">
          <div style="font-weight:600; font-size:12.5px; color:var(--navy); margin-bottom:4px;">${esc(siteName(sid))}</div>
          <div class="checklist">${siteWards.map(w => `<label><input type="checkbox" class="nu-ward-cb" value="${w.id}" ${checkedWards.has(w.id) ? 'checked' : ''}>${esc(w.name)}</label>`).join('') || '<span class="muted">No wards at this site.</span>'}</div>
        </div>`;
      }).join('');
      wardPickerSetup(groupsEl, 'nu-ward-cb');
    };
    document.querySelectorAll('.nu-site-scope-cb').forEach(cb => cb.onchange = updateWardGroups);
  }

  // The database refuses these anyway (profiles permission trigger); greying
  // the boxes out just stops people trying. You can't change your own
  // permissions, and can only switch ON what you hold yourself.
  const GRANT_IDS = { 'order': 'can_order', 'process': 'can_process', 'check-picking': 'can_check_picking',
    'dashboard': 'can_view_dashboard', 'nonurgent': 'can_mark_nonurgent', 'freetext': 'can_freetext_temp_stock',
    'manage-users': 'can_manage_users', 'manage-ward-staff': 'can_manage_ward_staff',
    'manage-stocklists': 'can_manage_stocklists', 'manage-wards-sites': 'can_manage_wards_sites', 'approve': 'can_approve_orders' };
  const MANAGEMENT_FLAGS = ['can_manage_users', 'can_manage_ward_staff', 'can_manage_stocklists', 'can_manage_wards_sites'];
  function limitGrantBoxes(root, isSelf) {
    if (isSuperuser()) return;
    root.querySelectorAll('input[type=checkbox]').forEach(cb => {
      let flag = cb.dataset.perm;
      if (!flag) { const m = /^(?:ea-|nu-can-)(.+)$/.exec(cb.id || ''); flag = m && GRANT_IDS[m[1]]; }
      if (!flag) return;
      const hideIt = () => { const l = cb.closest('label') || cb.parentElement; if (l) l.style.display = 'none'; };
      if (MANAGEMENT_FLAGS.includes(flag)) {
        if (!cb.checked) { hideIt(); return; } // not theirs to give, so don't show it
        cb.disabled = true;
        cb.title = 'Only a Superuser or Developer can give or change management permissions.';
      } else if (!isSelf && !profile?.[flag] && !cb.checked) {
        hideIt();
      } else if (isSelf || !profile?.[flag]) {
        cb.disabled = true;
        cb.title = isSelf ? "You can't change your own permissions." : 'You can only grant permissions you hold yourself.';
      }
    });
  }

  // ---------- Invite by email ----------
  const IV_PERMS = [
    ['can_order', 'Order stock'], ['can_process', 'Process stock'], ['can_check_picking', 'Check picked requests'],
    ['can_view_dashboard', 'See the daily dashboard'], ['can_mark_nonurgent', 'Mark non-urgent'], ['can_freetext_temp_stock', 'Temp stock (order any catalog drug)'],
    ['can_approve_orders', 'Approve orders'], ['can_manage_users', 'Manage users'],
    ['can_manage_ward_staff', 'Manage ward staff'], ['can_manage_stocklists', 'Manage stocklists'],
    ['can_manage_wards_sites', 'Manage wards & sites'],
    ...(isDeveloper() ? [['can_view_bi', 'Business Intelligence access']] : []),
  ];
  document.getElementById('iv-perms').innerHTML = IV_PERMS.map(([k, label]) =>
    `<div><label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:3px 0;"><input type="checkbox" class="iv-perm" data-perm="${k}" style="width:auto;"> ${esc(label)}</label></div>`).join('');
  limitGrantBoxes(document, false);  // create-login form and invite tickboxes
  document.getElementById('iv-wards').innerHTML = formSites.map(sv => {
    const ws = wardsForForm.filter(w => w.site_id === sv.id);
    return `<div style="margin-bottom:10px;">
      <div style="font-weight:600; font-size:12.5px; color:var(--navy); margin-bottom:4px;">${esc(sv.name)}</div>
      <div class="checklist" style="max-height:140px;">${ws.map(w => `<label><input type="checkbox" class="iv-ward-cb" value="${w.id}">${esc(w.name)}</label>`).join('') || '<span class="muted">No wards at this site.</span>'}</div>
    </div>`;
  }).join('') || '<span class="muted">No wards available to you yet.</span>';
  wardPickerSetup(document.getElementById('iv-wards'), 'iv-ward-cb');

  async function callInviteFn(payload) {
    const { data: { session: s } } = await sb.auth.getSession();
    const res = await fetch(`${FN_BASE}/admin-invite-users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${s.access_token}` },
      body: JSON.stringify({ ...payload, join_url: new URL('join.html', window.location.href).href }),
    });
    let out = {};
    try { out = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(out.error || 'Could not send invitations');
    return out;
  }

  function renderInviteResult(out) {
    const el = document.getElementById('iv-result');
    const rows = out.results || [];
    const needLinks = rows.filter(r => r.link);
    const okMailed = rows.filter(r => r.emailed).length;
    const bad = rows.filter(r => !r.ok && !r.link);
    let html = '';
    if (okMailed) html += `<div class="diffline add">${uiIcon('check', 14)} ${okMailed} invitation${okMailed > 1 ? 's' : ''} emailed.</div>`;
    if (bad.length) html += bad.map(r => `<div class="diffline rem">${esc(r.email)}: ${esc(r.error || 'failed')}</div>`).join('');
    if (needLinks.length) {
      html += `<div class="muted" style="margin:8px 0;">${out.email_configured === false
        ? 'Email sending isn’t set up yet, so the invitations have been created but not emailed. Copy each personal link below and send it to that person yourself.'
        : 'These emails couldn’t be sent, but the invitations are valid. Copy each link and send it yourself.'}</div>
        <table><thead><tr><th>Email</th><th>Personal link (works once, 7 days)</th><th></th></tr></thead><tbody>
        ${needLinks.map((r, i) => `<tr><td>${esc(r.email)}</td><td><input type="text" readonly value="${esc(r.link)}" id="iv-link-${i}" style="font-size:12px;" /></td><td><button class="btn ghost small" data-copy="iv-link-${i}">Copy</button></td></tr>`).join('')}
        </tbody></table>`;
    }
    el.innerHTML = html;
    el.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
      const inp = document.getElementById(b.dataset.copy);
      try { await navigator.clipboard.writeText(inp.value); } catch (e) { inp.select(); document.execCommand('copy'); }
      b.textContent = 'Copied';
    });
  }

  document.getElementById('iv-send').onclick = async () => {
    const emails = document.getElementById('iv-emails').value.split(/[\s,;]+/).map(x => x.trim()).filter(Boolean);
    if (!emails.length) return toast('Add at least one email address.', true);
    const grants = {};
    document.querySelectorAll('.iv-perm').forEach(cb => { if (cb.checked) grants[cb.dataset.perm] = true; });
    const ward_ids = [...document.querySelectorAll('.iv-ward-cb:checked')].map(c => c.value);
    const site_ids = [...document.querySelectorAll('.iv-site-cb:checked')].map(c => c.value);
    const role = document.getElementById('iv-role').value;
    if (!Object.keys(grants).length && !confirm('No permissions are ticked, so these accounts won’t be able to do anything yet. Send anyway?')) return;
    const btn = document.getElementById('iv-send');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const out = await callInviteFn({ emails, role, grants, ward_ids, site_ids });
      renderInviteResult(out);
      document.getElementById('iv-emails').value = '';
      loadInvitations();
    } catch (e) { toast(e.message, true); }
    btn.disabled = false; btn.textContent = 'Send invitations';
  };

  async function loadInvitations() {
    const el = document.getElementById('iv-list');
    const { data, error } = await sb.from('invitations')
      .select('id, email, email_masked, role, ward_ids, status, created_at, expires_at, last_sent_at, email_error')
      .order('created_at', { ascending: false }).limit(100);
    if (error) { el.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
    if (!data || !data.length) { el.innerHTML = '<div class="empty">No invitations sent yet.</div>'; return; }
    const fmt = d => d ? new Date(d).toLocaleDateString('en-GB') : '—';
    const statusBadge = (r) => {
      const expired = r.status === 'pending' && new Date(r.expires_at) < new Date();
      if (r.status === 'accepted') return '<span class="badge active">Joined</span>';
      if (r.status === 'revoked') return '<span class="badge suspended">Revoked</span>';
      return expired ? '<span class="badge out_of_stock">Expired</span>' : '<span class="badge pending">Waiting</span>';
    };
    el.innerHTML = `<table><thead><tr><th>Email</th><th>Title</th><th>Wards</th><th>Status</th><th>Sent</th><th>Expires</th><th></th></tr></thead><tbody>
      ${data.map(r => `<tr>
        <td>${esc(r.email || r.email_masked)}${r.email_error ? `<div class="attribution" style="color:var(--red);">Email not sent</div>` : ''}</td>
        <td>${esc(roleLabel(r.role))}</td>
        <td>${(r.ward_ids || []).map(id => esc(wardName(id))).join(', ') || '—'}</td>
        <td>${statusBadge(r)}</td>
        <td>${fmt(r.last_sent_at || r.created_at)}</td>
        <td>${r.status === 'pending' ? fmt(r.expires_at) : '—'}</td>
        <td style="text-align:right; white-space:nowrap;">${r.status === 'pending' ? `
          <button class="btn ghost small" data-iv-resend="${r.id}">New link</button>
          <button class="btn danger small" data-iv-revoke="${r.id}">Revoke</button>` : ''}</td>
      </tr>`).join('')}</tbody></table>`;
    el.querySelectorAll('[data-iv-resend]').forEach(b => b.onclick = async () => {
      try {
        const out = await callInviteFn({ resend_ids: [b.dataset.ivResend] });
        renderInviteResult(out);
        window.scrollTo({ top: document.getElementById('iv-result').getBoundingClientRect().top + window.scrollY - 120, behavior: 'smooth' });
        loadInvitations();
      } catch (e) { toast(e.message, true); }
    });
    el.querySelectorAll('[data-iv-revoke]').forEach(b => b.onclick = async () => {
      if (!confirm('Revoke this invitation? The link will stop working.')) return;
      const { error: rErr } = await sb.rpc('revoke_invitation', { p_id: b.dataset.ivRevoke });
      if (rErr) return toast(rErr.message, true);
      toast('Invitation revoked.');
      loadInvitations();
    });
  }
  loadInvitations();

  document.getElementById('nu-role').onchange = renderRoleDependentFields;
  renderRoleDependentFields();

  document.getElementById('nu-pass-toggle').onclick = () => {
    const input = document.getElementById('nu-pass');
    const btn = document.getElementById('nu-pass-toggle');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.textContent = showing ? 'Show' : 'Hide';
  };

  const firstEl = document.getElementById('nu-first'), lastEl = document.getElementById('nu-last');
  const nameEl = { get value() { return `${firstEl.value.trim()} ${lastEl.value.trim()}`.trim(); } };
  const useridEl = document.getElementById('nu-userid');
  const useridStatusEl = document.getElementById('nu-userid-status');
  let useridManuallyEdited = false;
  useridEl.oninput = () => { useridManuallyEdited = useridEl.value.trim().length > 0; useridStatusEl.textContent = ''; };
  const suggestId = async () => {
    if (useridManuallyEdited || !firstEl.value.trim() || !lastEl.value.trim()) return;
    useridStatusEl.textContent = 'suggesting\u2026';
    const suggestion = await suggestAvailableUserId(nameEl.value);
    if (suggestion && !useridManuallyEdited) {
      useridEl.value = suggestion;
      useridStatusEl.textContent = '(suggested \u2014 edit freely)';
    } else {
      useridStatusEl.textContent = '';
    }
  };
  firstEl.onblur = suggestId; lastEl.onblur = suggestId;
  let useridCheckTimer;
  useridEl.addEventListener('input', () => {
    clearTimeout(useridCheckTimer);
    const val = useridEl.value.trim();
    if (!val) { useridStatusEl.textContent = ''; return; }
    useridCheckTimer = setTimeout(async () => {
      const { data: exists } = await sb.rpc('user_id_exists', { candidate: val });
      useridStatusEl.innerHTML = exists ? uiIcon('warn', 13) + ' already taken' : uiIcon('check', 13) + ' available';
      useridStatusEl.style.color = exists ? 'var(--red)' : 'var(--teal)';
    }, 400);
  });

  document.getElementById('create-user-btn').onclick = async () => {
    const first_name = firstEl.value.trim(), last_name = lastEl.value.trim();
    const user_id = document.getElementById('nu-userid').value.trim();
    const passcode = document.getElementById('nu-pass').value;
    const role = document.getElementById('nu-role').value;
    if (!first_name || !last_name) return toast('Enter both a first name and a last name.', true);
    if (!user_id || !passcode) return toast('Fill in all fields.', true);
    if (passcode.length < 12) return toast('Passcode must be at least 12 characters.', true);

    const payload = {
      user_id, passcode, first_name, last_name, role,
      can_order: document.getElementById('nu-can-order')?.checked || false,
      can_process: document.getElementById('nu-can-process')?.checked || false,
      can_check_picking: document.getElementById('nu-can-check-picking')?.checked || false,
      can_view_dashboard: document.getElementById('nu-can-dashboard')?.checked || false,
      can_mark_nonurgent: document.getElementById('nu-can-nonurgent')?.checked || false,
      can_freetext_temp_stock: document.getElementById('nu-can-freetext')?.checked || false,
      can_manage_users: document.getElementById('nu-can-manage-users')?.checked || false,
      can_manage_ward_staff: document.getElementById('nu-can-manage-ward-staff')?.checked || false,
      can_manage_stocklists: document.getElementById('nu-can-manage-stocklists')?.checked || false,
      can_manage_wards_sites: document.getElementById('nu-can-manage-wards-sites')?.checked || false,
      can_approve_orders: document.getElementById('nu-can-approve')?.checked || false,
    };
    if (isDeveloper()) payload.can_view_bi = document.getElementById('nu-can-view-bi')?.checked || false;

    document.querySelectorAll('.nu-ward-cb').forEach(cb => { if (cb.checked) formCheckedWards.add(cb.value); else formCheckedWards.delete(cb.value); });
    payload.ward_ids = [...formCheckedWards];

    // user_sites is purpose-agnostic reach — the same grant backs
    // approval access, user management and stocklist/ward management —
    // so both checklists above feed the same combined set.
    const approvalSites = [...document.querySelectorAll('.nu-approval-site-cb:checked')].map(c => c.value);
    const manageSites = [...document.querySelectorAll('.nu-site-cb:checked')].map(c => c.value);
    payload.site_ids = [...new Set([...approvalSites, ...manageSites])];

    const { data: { session: s } } = await sb.auth.getSession();
    try {
      const res = await fetch(`${FN_BASE}/admin-create-user`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${s.access_token}` },
        body: JSON.stringify(payload),
      });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error || 'Failed to create login');
      toast('Login created.');
      renderUsers();
    } catch (e) { toast(e.message, true); }
  };

  const { data: users, error } = await sb.from('profiles').select('*').order('full_name');
  const listEl = document.getElementById('user-list');
  if (error) { listEl.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }

  const visibleUsers = (users || []).filter(visibleFilter);
  if (!visibleUsers?.length) { listEl.innerHTML = `<div class="empty">No logins yet.</div>`; return; }

  const { data: allUserWards } = await sb.from('user_wards').select('user_id, ward_id');
  const { data: allUserSites } = await sb.from('user_sites').select('user_id, site_id');
  const wardsFor = (uid) => (allUserWards || []).filter(x => x.user_id === uid).map(x => wardName(x.ward_id)).join(', ') || '\u2014';
  const sitesFor = (uid) => (allUserSites || []).filter(x => x.user_id === uid).map(x => siteName(x.site_id)).join(', ') || '\u2014';

  function effectiveSiteIds(u) {
    const directSites = (allUserSites || []).filter(x => x.user_id === u.id).map(x => x.site_id);
    const wardIds = (allUserWards || []).filter(x => x.user_id === u.id).map(x => x.ward_id);
    const wardSites = wardIds.map(wid => wards.find(w => w.id === wid)?.site_id).filter(Boolean);
    return [...new Set([...directSites, ...wardSites])];
  }

  listEl.innerHTML = `
    <div class="row" style="margin-bottom:14px;">
      <div><label>Search name, initials or User ID</label><input type="text" id="uf-search" placeholder="Start typing\u2026" /></div>
      <div><label>Type</label><select id="uf-role"><option value="">All types</option>${[...new Set(visibleUsers.map(u => u.role))].map(r => `<option value="${r}">${roleLabel(r)}</option>`).join('')}</select></div>
      <div><label>Site</label><select id="uf-site"><option value="">All sites</option>${sites.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
    </div>
    <div id="user-table-root"></div>`;

  function userRowHtml(u) {
    const caps = [
      u.can_order && 'Order', u.can_process && 'Process', u.can_check_picking && 'Checker', u.can_view_dashboard && 'Dashboard',
      u.can_approve_orders && 'Approve', u.can_mark_nonurgent && 'Non-urgent', u.can_manage_users && 'Manage users',
      u.can_manage_ward_staff && 'Manage ward staff', u.can_manage_stocklists && 'Stocklists', u.can_manage_wards_sites && 'Wards/sites',
      u.can_view_bi && 'BI', u.can_post_banners && 'Banners', u.can_check_own_picking && 'Checks own work',
    ].filter(Boolean);
    const where = [wardsFor(u.id), sitesFor(u.id)].filter(t => t !== '\u2014').join(' / ') || '';
    const canSusp = !(u.id === profile.id || (isSuperuserRole() && u.role === 'developer'));
    const ini = (u.initials || (u.full_name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2)).toUpperCase();
    return `<div class="u-item${u.active ? '' : ' u-off'}">
      <div class="u-head" data-access="${u.id}" role="button" tabindex="0" aria-expanded="false">
        <span class="u-av" title="${esc(u.full_name || '')}" aria-label="${esc(u.full_name || '')}">${esc(ini)}</span>
        <div class="u-main"><b>${esc(u.full_name || 'Unnamed')}</b>${isSuperuser() ? `<span class="u-id"> ${esc(u.user_id || '')}</span>` : ''}</div>
        <span class="u-where muted" title="${esc(where)}">${esc(where)}</span>
        <span class="u-count" title="${esc(caps.join(', ') || 'No functions')}">${caps.length} function${caps.length === 1 ? '' : 's'}</span>
        ${!u.active && u.suspended_at ? `<span class="u-susp" title="Suspended on ${esc(new Date(u.suspended_at).toLocaleString('en-GB'))}">Suspended ${esc(new Date(u.suspended_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }))}</span>` : ''}
        <span class="u-dot ${u.active ? 'on' : ''}" title="${u.active ? 'Active' : (u.suspended_at ? 'Suspended' : 'Inactive')}"></span>
        <span class="u-chev" aria-hidden="true">\u203a</span>
      </div>
      <div id="access-row-${u.id}" class="u-body hidden">
        <div class="u-actions">
          <span class="muted" style="font-size:12px; margin-right:auto;">${caps.length ? esc(caps.join(' \u00b7 ')) : 'No functions ticked'}<br>Email for password reset: ${u.email_hash ? `<b>${esc(u.email_masked || 'linked')}</b>` : '<b style="color:#9b1239;">none linked</b>'}</span>
          ${u.role === 'developer' || u.id === profile.id ? '' : `<button class="btn small ghost" data-setemail="${u.id}">${u.email_hash ? 'Change email' : 'Add email'}</button>`}
          ${u.role === 'developer' ? '<span class="muted" style="font-size:12px;">Managed via Supabase</span>' : `
          ${u.id !== profile.id ? `<button class="btn small ghost" data-reset="${u.id}">Reset password</button>` : ''}
          ${canSusp ? `<button class="btn small ${u.active ? 'danger' : 'magenta'}" data-susp="${u.id}">${u.active ? 'Suspend' : 'Reactivate'}</button>` : ''}
          ${isDeveloper() && u.id !== profile.id ? `<button class="btn small danger" data-deluser="${u.id}">Delete</button>` : ''}`}
        </div>
        <div class="access-panel" id="access-panel-${u.id}"></div>
      </div>
    </div>`;
  }

  const roleRank = (r) => { const i = ['developer', 'superuser', 'governance'].indexOf(r); return i < 0 ? 99 : i; };
  function groupByTitle(list) {
    const roles = [...new Set(list.map(u => u.role))].sort((x, y) => roleRank(x) - roleRank(y) || roleLabel(x).localeCompare(roleLabel(y)));
    return roles.map(r => ({ role: r, users: list.filter(u => u.role === r) }));
  }
  function userTableHtml(list) {
    if (!list.length) return `<div class="empty">No matching logins.</div>`;
    return list.map(userRowHtml).join('');
  }

  const openTitles = new Set();
  function renderUserTableRoot() {
    const root = document.getElementById('user-table-root');
    const search = document.getElementById('uf-search').value.trim().toLowerCase();
    const roleFilter = document.getElementById('uf-role').value;
    const siteFilter = document.getElementById('uf-site').value;
    const filtersActive = !!(search || roleFilter || siteFilter);

    let filtered = visibleUsers;
    if (search) filtered = filtered.filter(u => u.full_name?.toLowerCase().includes(search) || u.user_id?.toLowerCase().includes(search) || u.initials?.toLowerCase().includes(search));
    if (roleFilter) filtered = filtered.filter(u => u.role === roleFilter);
    if (siteFilter) filtered = filtered.filter(u => effectiveSiteIds(u).includes(siteFilter));

    if (!filtered.length) { root.innerHTML = `<div class="empty">No matching logins.</div>`; return; }
    root.innerHTML = groupByTitle(filtered).map(g => {
      const inactive = g.users.filter(u => !u.active).length;
      return `<details class="u-group" ${(filtersActive || openTitles.has(g.role)) ? 'open' : ''} data-role="${esc(g.role)}">
        <summary>${esc(roleLabel(g.role))} <span class="muted" style="font-weight:400;">(${g.users.length}${inactive ? `, ${inactive} inactive` : ''})</span></summary>
        <div class="u-list">${userTableHtml(g.users)}</div>
      </details>`;
    }).join('');
    root.querySelectorAll('details.u-group').forEach(d => d.addEventListener('toggle', () => { d.open ? openTitles.add(d.dataset.role) : openTitles.delete(d.dataset.role); }));
    attachRowHandlers(root, filtered);
  }

  document.getElementById('uf-search').oninput = renderUserTableRoot;
  document.getElementById('uf-role').onchange = renderUserTableRoot;
  document.getElementById('uf-site').onchange = renderUserTableRoot;
  renderUserTableRoot();

  function attachRowHandlers(root, list) {
    root.querySelectorAll('[data-deluser]').forEach(b => b.onclick = () => {
      if (!isDeveloper()) return;
      const u = list.find(x => x.id === b.dataset.deluser);
      openModal(`${modalIcon('warn')}<h3>Delete ${esc(u.full_name || 'this user')}?</h3>
        <p class="muted">This permanently removes the login and their ward and site access. It cannot be undone. If they appear on any orders it is refused \u2014 suspend them instead.</p>
        <label>Type <b>DELETE</b> to confirm</label><input type="text" id="du-word" autocomplete="off" />
        <div class="modal-error" id="du-err"></div>
        <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="du-go">Delete user</button></div>`);
      document.getElementById('du-go').onclick = async () => {
        if (document.getElementById('du-word').value.trim() !== 'DELETE') { document.getElementById('du-err').textContent = 'Type DELETE exactly to continue.'; return; }
        const { error } = await sb.rpc('developer_delete_user', { p_target: u.id });
        if (error) { document.getElementById('du-err').textContent = error.message; return; }
        closeModal(); toast('User deleted.'); renderUsers();
      };
    });

    root.querySelectorAll('[data-susp]').forEach(b => b.onclick = async () => {
      const u = list.find(x => x.id === b.dataset.susp);
      const { error } = await sb.from('profiles').update({ active: !u.active }).eq('id', u.id);
      if (error) return toast(error.message, true);
      toast(u.active ? 'Login deactivated.' : 'Login activated.');
      renderUsers();
    });

    root.querySelectorAll('[data-setemail]').forEach(b => b.onclick = () => {
      const u = list.find(x => x.id === b.dataset.setemail);
      openModal(`<h3>${u.email_hash ? 'Change' : 'Add'} email</h3>
        <p class="muted">For ${esc(u.full_name)}. Used only for password reset emails (their own \u201cForgotten password\u201d, or a manager\u2019s Reset password). It is stored securely and never shown in the app.</p>
        <label>Email address</label><input type="email" id="se-email" placeholder="name@nhs.net" autocomplete="off" />
        <div class="modal-error" id="se-err"></div>
        <div class="actions">${u.email_hash ? '<button class="btn ghost" id="se-remove" style="margin-right:auto;">Remove</button>' : ''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn magenta" id="se-save">Save</button></div>`);
      const send = async (email) => {
        const { data: { session: s } } = await sb.auth.getSession();
        const res = await fetch(`${FN_BASE}/admin-set-user-email`, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${s.access_token}` }, body: JSON.stringify({ target_user_id: u.id, email }) });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) { document.getElementById('se-err').textContent = out.error || 'Could not save.'; return; }
        closeModal(); toast(email ? 'Email saved.' : 'Email removed.'); renderUsers();
      };
      document.getElementById('se-save').onclick = () => { const v = document.getElementById('se-email').value.trim(); if (!v) { document.getElementById('se-err').textContent = 'Enter an email address.'; return; } send(v); };
      document.getElementById('se-remove')?.addEventListener('click', () => send(''));
    });

    root.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
      const u = list.find(x => x.id === b.dataset.reset);
      const call = async (mode) => {
        const { data: { session: s } } = await sb.auth.getSession();
        const res = await fetch(`${FN_BASE}/admin-reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${s.access_token}` },
          body: JSON.stringify({ target_id: u.id, mode }),
        });
        const out = await res.json().catch(() => ({}));
        return { ok: res.ok, out };
      };
      const noEmail = () => openModal(`${modalIcon('ask')}<h3>No email linked</h3>
        <p class="muted">${esc(u.full_name)} has no email address linked, so a reset link can't be sent. Add one first (then press Reset password again), or give them a temporary passcode in person.</p>
        <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ghost" id="rp-temp">Temporary passcode</button><button class="btn magenta" id="rp-add">Add email</button></div>`);
      const showNoEmail = () => {
        noEmail();
        document.getElementById('rp-add').onclick = () => { closeModal(); root.querySelector(`[data-setemail="${u.id}"]`)?.click(); };
        document.getElementById('rp-temp').onclick = async () => {
          const { ok, out } = await call('temp');
          if (!ok) return toast(out.error || 'Failed to reset password', true);
          openModal(`<h3>Temporary passcode</h3>
            <p class="muted">Give this to ${esc(u.full_name)} \u2014 they'll be asked to set their own on next login.</p>
            <p style="font-size:22px; font-weight:700; letter-spacing:2px; text-align:center; margin:16px 0; color:var(--navy);">${esc(out.temp_passcode)}</p>
            <div class="actions"><button class="btn magenta" onclick="closeModal()">Done</button></div>`);
        };
      };
      if (!u.email_hash) return showNoEmail();
      confirmDialog('Email a reset link', `Send a password reset link to ${esc(u.full_name)}'s email (${esc(u.email_masked || 'linked address')})? They'll choose their own new password. You won't see or type the address.`, 'Send reset link', async () => {
        try {
          const { ok, out } = await call('email');
          if (out.no_email) return showNoEmail();
          if (!ok) throw new Error(out.error || 'Failed to send the reset link');
          toast(`Reset link sent to ${out.emailed_to || 'their email'}.`);
        } catch (e) { toast(e.message, true); }
      });
    });

    root.querySelectorAll('[data-access]').forEach(b => {
      const go = () => { b.setAttribute('aria-expanded', String(document.getElementById(`access-row-${b.dataset.access}`).classList.contains('hidden'))); toggleAccessPanel(b.dataset.access, list); };
      b.onclick = go; b.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    });
  }

  async function toggleAccessPanel(userId, list) {
    const row = document.getElementById(`access-row-${userId}`);
    const panel = document.getElementById(`access-panel-${userId}`);
    if (!row.classList.contains('hidden')) { row.classList.add('hidden'); return; }
    row.classList.remove('hidden');
    panel.innerHTML = 'Loading\u2026';
    const u = list.find(x => x.id === userId) || visibleUsers.find(x => x.id === userId);

    const { data: uw } = await sb.from('user_wards').select('ward_id').eq('user_id', userId);
    const wardIds = (uw || []).map(x => x.ward_id);
    const { data: us } = await sb.from('user_sites').select('site_id').eq('user_id', userId);
    const currentSiteIds = (us || []).map(x => x.site_id);
    const options = (isAdminRole() && !isSuperuser()) ? wards.filter(w => scopeSiteIds.includes(w.site_id)) : wards;
    const optionSites = sites.filter(s => options.some(w => w.site_id === s.id));
    const currentWardSiteIds = [...new Set(wardIds.map(wid => options.find(w => w.id === wid)?.site_id).filter(Boolean))];

    panel.innerHTML = `
      <div class="perm-grid">
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-order" style="width:auto;" ${u.can_order ? 'checked' : ''}> Order stock</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-process" style="width:auto;" ${u.can_process ? 'checked' : ''}> Process stock</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-check-picking" style="width:auto;" ${u.can_check_picking ? 'checked' : ''}> Can check picked requests</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-dashboard" style="width:auto;" ${u.can_view_dashboard ? 'checked' : ''}> Can see the daily dashboard</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-nonurgent" style="width:auto;" ${u.can_mark_nonurgent ? 'checked' : ''}> Can mark non-urgent</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-freetext" style="width:auto;" ${u.can_freetext_temp_stock ? 'checked' : ''}> Temp stock (order any catalog drug)</label></div>
      </div>
      <div class="perm-grid">
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-manage-users" style="width:auto;" ${u.can_manage_users ? 'checked' : ''}> Manage users (site-scoped)</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-manage-ward-staff" style="width:auto;" ${u.can_manage_ward_staff ? 'checked' : ''}> Manage ward staff (ward-scoped)</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-manage-stocklists" style="width:auto;" ${u.can_manage_stocklists ? 'checked' : ''}> Manage stocklists</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-manage-wards-sites" style="width:auto;" ${u.can_manage_wards_sites ? 'checked' : ''}> Manage wards &amp; sites</label></div>
        <div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-approve" style="width:auto;" ${u.can_approve_orders ? 'checked' : ''}> Approve orders</label></div>
        ${isSuperuser() ? `<div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-check-own" style="width:auto;" ${u.can_check_own_picking ? 'checked' : ''}> Can check their own work</label></div>` : ''}
        ${isSuperuser() ? `<div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-post-banners" style="width:auto;" ${u.can_post_banners ? 'checked' : ''}> Can post banners</label></div>` : ''}
        ${isDeveloper() ? `<div><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="ea-view-bi" style="width:auto;" ${u.can_view_bi ? 'checked' : ''}> Business Intelligence access</label></div>` : ''}
      </div>
      <label style="margin-top:10px;">Sites (tick one or more to reveal their wards below \u2014 also used as this login's reach for user/stocklist/ward/site management and order approval)</label>
      <div class="checklist">${optionSites.map(s => `<label><input type="checkbox" class="ea-site-scope" value="${s.id}" ${(currentWardSiteIds.includes(s.id) || currentSiteIds.includes(s.id)) ? 'checked' : ''}>${esc(s.name)}</label>`).join('') || '<span class="muted">No sites available.</span>'}</div>
      <label style="margin-top:10px;">Ward access</label>
      <div id="ea-ward-groups-${userId}"></div>
      <button class="btn magenta small" id="save-access-${userId}" style="margin-top:10px;">Save access</button>`;

    limitGrantBoxes(panel, userId === profile?.id);
    const updateWardGroups = () => {
      panel.querySelectorAll('.ea-ward').forEach(cb => { if (cb.checked) checkedWards.add(cb.value); else checkedWards.delete(cb.value); });
      const tickedSites = [...panel.querySelectorAll('.ea-site-scope:checked')].map(c => c.value);
      const groupsEl = document.getElementById(`ea-ward-groups-${userId}`);
      if (!tickedSites.length) { groupsEl.innerHTML = '<span class="muted">Tick one or more sites above to see their wards.</span>'; return; }
      groupsEl.innerHTML = tickedSites.map(sid => {
        const siteWards = options.filter(w => w.site_id === sid);
        return `<div style="margin-bottom:10px;">
          <div style="font-weight:600; font-size:12.5px; color:var(--navy); margin-bottom:4px;">${esc(siteName(sid))}</div>
          <div class="checklist">${siteWards.map(w => `<label><input type="checkbox" class="ea-ward" value="${w.id}" ${checkedWards.has(w.id) ? 'checked' : ''}>${esc(w.name)}</label>`).join('') || '<span class="muted">No wards at this site.</span>'}</div>
        </div>`;
      }).join('');
      wardPickerSetup(groupsEl, 'ea-ward');
    };
    const checkedWards = new Set(wardIds);
    panel.querySelectorAll('.ea-site-scope').forEach(cb => cb.onchange = updateWardGroups);
    updateWardGroups();

    document.getElementById(`save-access-${userId}`).onclick = async () => {
      panel.querySelectorAll('.ea-ward').forEach(cb => { if (cb.checked) checkedWards.add(cb.value); else checkedWards.delete(cb.value); });
      const newWardIds = [...checkedWards];
      const newSiteIds = [...panel.querySelectorAll('.ea-site-scope:checked')].map(c => c.value);
      const updates = {
        can_order: document.getElementById('ea-order').checked,
        can_process: document.getElementById('ea-process').checked,
        can_check_picking: document.getElementById('ea-check-picking').checked,
        can_view_dashboard: document.getElementById('ea-dashboard').checked,
        can_mark_nonurgent: document.getElementById('ea-nonurgent').checked,
        can_freetext_temp_stock: document.getElementById('ea-freetext').checked,
        can_manage_users: document.getElementById('ea-manage-users').checked,
        can_manage_ward_staff: document.getElementById('ea-manage-ward-staff').checked,
        can_manage_stocklists: document.getElementById('ea-manage-stocklists').checked,
        can_manage_wards_sites: document.getElementById('ea-manage-wards-sites').checked,
        can_approve_orders: document.getElementById('ea-approve').checked,
      };
      if (isSuperuser()) updates.can_check_own_picking = document.getElementById('ea-check-own').checked;
      if (isSuperuser()) updates.can_post_banners = document.getElementById('ea-post-banners').checked;
      if (isDeveloper()) updates.can_view_bi = document.getElementById('ea-view-bi').checked;
      const { error: updErr } = await sb.from('profiles').update(updates).eq('id', userId);
      if (updErr) return toast(updErr.message, true);
      await sb.from('user_wards').delete().eq('user_id', userId);
      if (newWardIds.length) await sb.from('user_wards').insert(newWardIds.map(ward_id => ({ user_id: userId, ward_id })));
      await sb.from('user_sites').delete().eq('user_id', userId);
      if (newSiteIds.length) await sb.from('user_sites').insert(newSiteIds.map(site_id => ({ user_id: userId, site_id })));
      toast('Access updated.');
      row.classList.add('hidden');
      renderUsers();
    };
  }
}

async function renderWardManagerNurseList() {
  const body = document.getElementById('body');
  const { data: myWardRows } = await sb.from('user_wards').select('ward_id').eq('user_id', profile.id);
  const myWardIds = (myWardRows || []).map(w => w.ward_id);
  if (!myWardIds.length) { body.innerHTML = `<div class="card"><div class="empty">No wards have been allocated to your login yet.</div></div>`; return; }

  const { data: nurseWardRows } = await sb.from('user_wards').select('user_id, ward_id').in('ward_id', myWardIds);
  const nurseIds = [...new Set((nurseWardRows || []).map(w => w.user_id))];
  if (!nurseIds.length) { body.innerHTML = `<div class="card"><h2>Ward staff in your ward(s)</h2><div class="empty">No one found.</div></div>`; return; }

  const { data: shared } = await sb.from('profiles').select('*').in('id', nurseIds).order('full_name');
  const nurses = (shared || []).filter(u =>
    !['developer', 'superuser', 'governance'].includes(u.role)
    && !(u.can_manage_users || u.can_manage_ward_staff || u.can_manage_stocklists || u.can_manage_wards_sites || u.can_approve_orders)
  );
  body.innerHTML = `<div class="card"><h2>Ward staff in your ward(s)</h2>
    <p class="muted">Deactivating here is one-way \u2014 reactivation needs a superuser or someone with Manage users access. Accounts with their own manager-level access aren't shown here.</p>
    ${!nurses?.length ? `<div class="empty">No one found.</div>` : `
    <table><thead><tr><th>Name</th><th>Status</th><th></th></tr></thead><tbody>
      ${nurses.map(n => `<tr>
        <td>${esc(n.full_name)}</td>
        <td><span class="badge ${n.active ? 'active' : 'suspended'}">${n.active ? 'Active' : 'Inactive'}</span></td>
        <td style="text-align:right;">${n.active ? `<button class="btn small danger" data-deactivate="${n.id}">Deactivate</button>` : `<span class="muted">Already inactive</span>`}</td>
      </tr>`).join('')}
    </tbody></table>`}
  </div>`;
  body.querySelectorAll('[data-deactivate]').forEach(b => b.onclick = () => {
    const n = nurses.find(x => x.id === b.dataset.deactivate);
    confirmDialog('Deactivate account', `Deactivate ${esc(n.full_name)}? They will need to contact support to be reactivated.`, 'Deactivate', async () => {
      const { error } = await sb.from('profiles').update({ active: false }).eq('id', n.id);
      if (error) return toast(error.message, true);
      toast('Account deactivated.');
      renderWardManagerNurseList();
    }, true);
  });
}

(async () => {
  const p = await requireAuth({ require: (pr) => isAnyManagerType() });
  if (!p) return;
  document.getElementById('main').innerHTML = '<div id="body"></div>';
  renderUsers();
})();
</script>
