<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Req — Log in</title>
<link rel="stylesheet" href="shared.css" />
<style>
  /* Login sits on the shared animated background (.bg-anim, shared.css). */
  #login-screen{ background:transparent; }
  .login-card{ background:rgba(255,255,255,.9); backdrop-filter:blur(6px); }

  /* ED&G lockup (bottom-right) — fixed brand identity. */
  .edg-brand{position:fixed;right:40px;bottom:28px;z-index:6;text-align:right;pointer-events:none;animation:edgFadeUp .6s .5s ease both;}
  .edg-brand .mark{font-size:30px;font-weight:800;color:#1a2744;line-height:1;}
  .edg-brand .mark .amp{color:#12a0ad;}
  .edg-brand .mark .tm{font-size:12px;font-weight:700;vertical-align:super;margin-left:1px;}
  .edg-brand .name{margin-top:3px;font-size:12.5px;font-weight:700;color:#1a2744;}
  .edg-brand .rule{height:3px;margin-top:7px;border-radius:2px;overflow:hidden;display:flex;}
  .edg-brand .rule span{flex:1;}
  .edg-brand .rule span:nth-child(1){background:#1a2744;}
  .edg-brand .rule span:nth-child(2){background:#12a0ad;}
  .edg-brand .rule span:nth-child(3){background:#4caf50;}
  @keyframes edgFadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @media (max-width:520px){.edg-brand{right:20px;bottom:18px;}.edg-brand .mark{font-size:24px;}}
</style>
</head>
<body>

<div class="edg-brand" aria-hidden="true">
  <div class="mark">ED<span class="amp">&amp;</span>G<span class="tm">&trade;</span></div>
  <div class="name">Evolve Digital &amp; Governance</div>
  <div class="rule"><span></span><span></span><span></span></div>
</div>

<div id="login-screen">
  <div class="login-card">
    
    <img id="login-logo" alt="" style="display:none; max-height:90px; max-width:240px; margin:0 auto 14px;" />
    <h1>Stock Req</h1>
    <div class="tag" style="margin-top:2px;">Digital ward medicines stock management</div>
    <div class="tag" style="margin-top:2px; font-size:0.85em;">by ED&amp;G</div>
    <label>User ID</label>
    <input type="text" id="login-userid" autocomplete="username" autocapitalize="off" spellcheck="false" />
    <label>Passcode</label>
    <input type="password" id="login-password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" />
    <div class="login-error" id="login-error"></div>
    <button class="btn magenta" onclick="doLogin()">Log in</button>
    <p class="muted" style="margin-top:16px; font-size:11.5px;">Sign in with your Trust-issued User ID.</p>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="shared.js"></script>
<script>
// Developer-set login logo (system_settings.login_logo_data_url, readable pre-login).
(function () {
  const img = document.getElementById('login-logo');
  const show = (u) => { if (u) { img.src = u; img.style.display = 'block'; } else { img.style.display = 'none'; } };
  try { show(localStorage.getItem('login_logo_cache')); } catch (e) {}
  sb.from('system_settings').select('value').eq('key', 'login_logo_data_url').maybeSingle().then(({ data, error }) => {
    if (error) return;
    const v = (data && data.value) || '';
    show(v);
    try { v ? localStorage.setItem('login_logo_cache', v) : localStorage.removeItem('login_logo_cache'); } catch (e) {}
  });
})();
</script>
<script>
// If already logged in (and not needing a reset), skip straight to home.
sb.auth.getSession().then(async ({ data }) => {
  const params = new URLSearchParams(window.location.search);
  const errEl = document.getElementById('login-error');
  if (params.get('deactivated')) errEl.textContent = 'This account is inactive. Contact an administrator.';
  if (params.get('expired')) errEl.textContent = 'Your temporary passcode has expired. Contact an administrator for a new one.';
  if (params.get('ended')) errEl.textContent = 'Your session was ended by an administrator. Please log in again.';

  if (data.session) {
    const { data: p } = await sb.from('profiles').select('*').eq('id', data.session.user.id).single();
    if (p && p.active && !p.must_reset_password) {
      window.location.href = 'home.html';
    } else if (p && p.active && p.must_reset_password) {
      window.location.href = 'reset-password.html';
    }
  }
});

window.doLogin = async function () {
  const userId = document.getElementById('login-userid').value.trim();
  const passcode = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!userId || !passcode) { errEl.textContent = 'Enter your User ID and passcode.'; return; }

  const { data: email, error: lookupError } = await sb.rpc('email_for_user_id', { lookup_user_id: userId });
  if (lookupError || !email) { errEl.textContent = 'Incorrect User ID or passcode.'; return; }

  const { error: signInError } = await sb.auth.signInWithPassword({ email, password: passcode });
  if (signInError) { errEl.textContent = 'Incorrect User ID or passcode.'; return; }

  const { data: { user } } = await sb.auth.getUser();
  const { data: p } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (!p || !p.active) { errEl.textContent = 'This account is inactive. Contact an administrator.'; await sb.auth.signOut(); return; }
  await sb.from('login_events').insert({ user_id: p.id, event_type: 'login' });
  // Any stale revoked_at from a previous kicked session is cleared
  // automatically by a database trigger on auth.sessions — the
  // signInWithPassword() call above already created that new session
  // row server-side, so there's nothing to do here client-side. That
  // reset is deliberately NOT a callable RPC: a still-valid access
  // token from a kicked session could otherwise call it directly,
  // out of band, and clear its own kick before the heartbeat saw it.
  window.location.href = p.must_reset_password ? 'reset-password.html' : 'home.html';
};
</script>
</body>
</html>
