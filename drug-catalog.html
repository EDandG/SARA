<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StockFlow — Drug Catalog</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="shared.css" />
</head>
<body data-page="drug-catalog.html">
<div id="app">
<header class="topbar">
    <div class="brand">
      
      <div>
        <div class="name">StockFlow</div>
        <div class="sub" data-ward-context></div>
      </div>
    </div>
    <div class="who">
      <span data-who-name></span>
      <button class="logout" data-logout>Log out</button>
    </div>
  </header>
  <div id="banner-root"></div>
  <div id="page-nav" class="tabs"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="vendor/supabase.js"></script>
<script src="shared.js"></script>
<script>
let catalogPreview = [];

async function renderDrugCatalog() {
  const body = document.getElementById('body');
  body.innerHTML = `
    <div class="card">
      <h2>Classes</h2>
      <p class="muted">Step 1. Create a class for each kind of drug (for example Injection, TTO pack, Fridge storage). Every drug in the catalogue is tagged with its class, and stocklists and printed lists group drugs by it. Change a drug\u2019s class here and it moves in every stocklist automatically. A class with no drugs never shows on a printed list.</p>
      <div class="row"><div><label>New class name</label><input type="text" id="new-section-name" placeholder="e.g. Cold store" /></div>
        <div style="align-self:flex-end;"><button class="btn magenta small" id="add-section-btn">Add class</button></div></div>
      <div id="section-list" style="margin-top:10px;">Loading\u2026</div>
    </div>
    ${isDeveloper() ? `
    <div class="card">
      <h2>Import from spreadsheets</h2>
      <p class="muted">Drop one or more Excel or CSV sheets at once. For each sheet, choose its <b>class</b> (for example Injection or TTO pack \u2014 create these under Classes first), then pick the drug name and pack size columns. Drugs already in the catalogue, or repeated across sheets, are only added once, and every drug is tagged with its sheet\u2019s class so it lands in the right section when you build stocklists.</p>
      <div class="file-drop" id="drop-zone">Drop Excel or CSV sheets here, or click to choose them</div>
      <input type="file" id="csv-input" accept=".csv,.xlsx,.xls" class="hidden" multiple />
      <div id="csv-preview"></div>
    </div>
    <div class="card">
      <h2>Add a drug</h2>
      <div class="row">
        <div><label>Medicine name</label><input type="text" id="add-drug-name" placeholder="e.g. Diazepam 5mg" /></div>
        <div><label>Pack size <span class="muted" style="font-weight:400;">(optional)</span></label><input type="text" id="add-drug-pack" placeholder="e.g. 28 tablets" /></div>
        <div><label>Class <span class="muted" style="font-weight:400;">(optional)</span></label><select id="add-drug-class"><option value="">\u2014 no class \u2014</option></select></div>
        <div style="align-self:flex-end;"><button class="btn magenta small" id="add-drug-btn">Add</button></div>
      </div>
    </div>` : ''}
    <div class="card">
      <h2>Substitution groups</h2>
      <p class="muted">For when the exact pack requested is out of stock but a different pack size of the <b>same drug, same strength</b> is available \u2014 e.g. Diazepam 5mg 28-tablet pack and Diazepam 5mg 30-tablet pack. Group only genuinely interchangeable packs together; whoever's processing an order will only ever be offered what's explicitly linked here. Turned on per ward from the Wards page.</p>
      <div class="row"><div><label>New group name</label><input type="text" id="new-subgroup-name" placeholder="e.g. Diazepam 5mg" /></div>
        <div style="align-self:flex-end;"><button class="btn magenta small" id="add-subgroup-btn">Add group</button></div></div>
      <div id="subgroup-list" style="margin-top:10px;">Loading\u2026</div>
    </div>
    <div class="card"><h2>Catalog</h2><div id="catalog-list">Loading\u2026</div></div>`;

  if (isDeveloper()) {
    document.getElementById('drop-zone').onclick = () => document.getElementById('csv-input').click();
    document.getElementById('csv-input').onchange = () => { addCatalogFiles(Array.from(document.getElementById('csv-input').files)); document.getElementById('csv-input').value = ''; };
    document.getElementById('drop-zone').ondragover = (e) => e.preventDefault();
    document.getElementById('drop-zone').ondrop = (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) { addCatalogFiles(Array.from(e.dataTransfer.files)); } };

    document.getElementById('add-drug-btn').onclick = async () => {
      const name = document.getElementById('add-drug-name').value.trim();
      const packSize = document.getElementById('add-drug-pack').value.trim();
      if (!name) return toast('Enter a medicine name.', true);
      const { data: ins, error } = await sb.from('drug_catalog').insert({ medicine_name: name, pack_size: packSize || null, created_by: profile.id }).select('id').single();
      if (error) return toast(error.message.includes('duplicate') ? 'Already in the catalog.' : error.message, true);
      const cls = document.getElementById('add-drug-class').value;
      if (cls && ins?.id) await sb.from('drug_catalog_sections').insert({ drug_catalog_id: ins.id, section_id: cls });
      document.getElementById('add-drug-name').value = '';
      document.getElementById('add-drug-pack').value = '';
      toast(`${name} added to the catalog.`);
      loadCatalogList();
    };
  }

  document.getElementById('add-section-btn').onclick = async () => {
    const name = document.getElementById('new-section-name').value.trim();
    if (!name) return toast('Enter a class name.', true);
    const { error } = await sb.from('drug_sections').insert({ name, created_by: profile.id });
    if (error) return toast(error.message.includes('duplicate') ? 'That class already exists.' : error.message, true);
    document.getElementById('new-section-name').value = '';
    toast('Class added.');
    loadSectionList();
    loadCatalogList();
  };

  document.getElementById('add-subgroup-btn').onclick = async () => {
    const name = document.getElementById('new-subgroup-name').value.trim();
    if (!name) return toast('Enter a group name.', true);
    const { error } = await sb.from('substitution_groups').insert({ name, created_by: profile.id });
    if (error) return toast(error.message, true);
    document.getElementById('new-subgroup-name').value = '';
    toast('Substitution group added.');
    loadSubstitutionGroups();
  };

  await loadSectionList();
  await loadSubstitutionGroups();
  await loadCatalogList();
}

// A soft, non-blocking check — not a hard rule, since drug names
// don't follow one consistent format, but enough to catch an obvious
// mistake before it goes live for whoever's processing orders.
function firstWord(name) {
  return (name || '').trim().split(/\s+/)[0]?.toLowerCase() || '';
}

async function loadSubstitutionGroups() {
  const el = document.getElementById('subgroup-list');
  const { data: groups, error } = await sb.from('substitution_groups').select('*').order('name');
  if (error) { el.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!groups?.length) { el.innerHTML = `<div class="empty">No substitution groups yet \u2014 add one above.</div>`; return; }

  const { data: catalogRows } = await sb.from('drug_catalog').select('id, medicine_name').order('medicine_name');
  const { data: memberRows } = await sb.from('substitution_group_members').select('*');
  const catalogById = Object.fromEntries((catalogRows || []).map(c => [c.id, c]));

  el.innerHTML = groups.map(g => {
    const memberIds = (memberRows || []).filter(m => m.group_id === g.id).map(m => m.drug_catalog_id);
    const members = memberIds.map(id => catalogById[id]).filter(Boolean);
    const availableOptions = (catalogRows || []).filter(c => !memberIds.includes(c.id));
    return `<div style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>${esc(g.name)}</strong>
        <button class="btn small danger" data-delete-group="${g.id}" data-name="${esc(g.name)}">Delete group</button>
      </div>
      <div style="margin-top:8px;">
        ${members.length ? members.map(m => `<span class="capsule" style="margin-right:6px;">${esc(m.medicine_name)} <button data-remove-member="${g.id}::${m.id}" style="border:none; background:none; cursor:pointer; color:inherit; font-weight:700; padding:0 0 0 4px;">\u00d7</button></span>`).join('') : '<span class="muted">No drugs in this group yet.</span>'}
      </div>
      <div class="row" style="margin-top:8px;">
        <div><select class="subgroup-add-select" data-group="${g.id}"><option value="">Add a drug\u2026</option>${availableOptions.map(c => `<option value="${c.id}">${esc(c.medicine_name)}</option>`).join('')}</select></div>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('[data-delete-group]').forEach(b => b.onclick = () => {
    confirmDialog('Delete this substitution group?', `Drugs in "${esc(b.dataset.name)}" will no longer be offered as alternatives for each other.`, 'Delete', async () => {
      const { error: e } = await sb.from('substitution_groups').delete().eq('id', b.dataset.deleteGroup);
      if (e) return toast(e.message, true);
      toast('Substitution group deleted.');
      loadSubstitutionGroups();
    }, true);
  });

  el.querySelectorAll('[data-remove-member]').forEach(b => b.onclick = async () => {
    const [groupId, drugId] = b.dataset.removeMember.split('::');
    const { error: e } = await sb.from('substitution_group_members').delete().eq('group_id', groupId).eq('drug_catalog_id', drugId);
    if (e) return toast(e.message, true);
    loadSubstitutionGroups();
  });

  el.querySelectorAll('.subgroup-add-select').forEach(sel => sel.onchange = async () => {
    const drugId = sel.value;
    if (!drugId) return;
    const groupId = sel.dataset.group;
    const chosenName = sel.options[sel.selectedIndex].text;
    const memberIds = (memberRows || []).filter(m => m.group_id === groupId).map(m => m.drug_catalog_id);
    const existingNames = memberIds.map(id => catalogById[id]?.medicine_name).filter(Boolean);
    const mismatched = existingNames.length && !existingNames.some(n => firstWord(n) === firstWord(chosenName));

    const doAdd = async () => {
      const { error: e } = await sb.from('substitution_group_members').insert({ group_id: groupId, drug_catalog_id: drugId });
      if (e) return toast(e.message, true);
      toast('Added to group.');
      loadSubstitutionGroups();
    };
    if (mismatched) {
      confirmDialog('Same drug?', `"${esc(chosenName)}" doesn\u2019t look like the same drug as what\u2019s already in this group (${esc(existingNames.join(', '))}). Only add it if it\u2019s genuinely the same drug and strength, just a different pack.`, 'Add anyway', doAdd, true);
    } else {
      await doAdd();
    }
  });
}

async function loadSectionList() {
  const el = document.getElementById('section-list');
  const { data, error } = await sb.from('drug_sections').select('*').order('name');
  if (error) { el.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!data?.length) { el.innerHTML = `<div class="empty">No classes yet \u2014 add one above.</div>`; return; }
  const addSel = document.getElementById('add-drug-class');
  if (addSel) { const cur = addSel.value; addSel.innerHTML = '<option value="">\u2014 no class \u2014</option>' + data.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join(''); addSel.value = cur; }
  const { data: lk } = await sb.from('drug_catalog_sections').select('section_id');
  const cnt = {}; (lk || []).forEach(l => { cnt[l.section_id] = (cnt[l.section_id] || 0) + 1; });
  el.innerHTML = data.map(s => `<div style="display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--border);">
      <b style="flex:1;">${esc(s.name)}</b>
      <span class="muted" style="font-size:12.5px;">${cnt[s.id] ? cnt[s.id] + ' drug' + (cnt[s.id] === 1 ? '' : 's') : 'No drugs \u2014 not shown on printed stocklists'}</span>
      <button class="btn small ghost" data-pick-section="${s.id}" data-name="${esc(s.name)}">Choose drugs\u2026</button>
      <button class="btn small danger" data-remove-section="${s.id}" data-name="${esc(s.name)}">Remove</button>
    </div>`).join('');
  el.querySelectorAll('[data-pick-section]').forEach(b => b.onclick = () => openSectionPicker(b.dataset.pickSection, b.dataset.name));
  el.querySelectorAll('[data-remove-section]').forEach(b => b.onclick = () => {
    confirmDialog('Remove this class?', `"${esc(b.dataset.name)}" will no longer group any drug on a stocklist. This doesn't remove the drugs themselves from the catalog.`, 'Remove', async () => {
      const { error } = await sb.from('drug_sections').delete().eq('id', b.dataset.removeSection);
      if (error) return toast(error.message, true);
      toast('Class removed.');
      loadSectionList();
      loadCatalogList();
    }, true);
  });
}

// Multiselect: choose which catalogue drugs belong to a section. A section with
// no drugs never appears on a printed stocklist.
async function openSectionPicker(sectionId, sectionName) {
  const [{ data: drugs }, { data: links }] = await Promise.all([
    sb.from('drug_catalog').select('id, medicine_name, pack_size, hidden').order('medicine_name'),
    sb.from('drug_catalog_sections').select('drug_catalog_id').eq('section_id', sectionId),
  ]);
  const all = drugs || [];
  const original = new Set((links || []).map(l => l.drug_catalog_id));
  const chosen = new Set(original);
  openModal(`<h3>Drugs in "${esc(sectionName)}"</h3>
    <input type="text" id="sp-search" placeholder="Search drugs\u2026" autocomplete="off" />
    <div style="display:flex; gap:8px; margin:8px 0; align-items:center;">
      <button class="btn small ghost" id="sp-all">Select all shown</button>
      <button class="btn small ghost" id="sp-none">Clear all shown</button>
      <span class="muted" id="sp-count" style="margin-left:auto; font-size:12.5px;"></span>
    </div>
    <div id="sp-list" style="max-height:340px; overflow:auto; border:1px solid var(--border); border-radius:8px; padding:4px 8px;"></div>
    <div class="modal-error" id="sp-error"></div>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn magenta" id="sp-save">Save</button></div>`);
  const listEl = document.getElementById('sp-list');
  const shown = () => { const q = document.getElementById('sp-search').value.trim().toLowerCase(); return all.filter(d => !q || d.medicine_name.toLowerCase().includes(q)); };
  const draw = () => {
    const rows = shown();
    listEl.innerHTML = rows.length ? rows.map(d => `<label style="display:flex; gap:8px; align-items:center; font-weight:400; padding:4px 0;"><input type="checkbox" data-d="${d.id}" ${chosen.has(d.id) ? 'checked' : ''} style="width:auto;" />
      <span style="flex:1;">${esc(d.medicine_name)}${d.hidden ? ' <span class="muted">(hidden)</span>' : ''}</span><span class="muted" style="font-size:12px;">${esc(d.pack_size || '')}</span></label>`).join('') : '<div class="empty">No drugs match.</div>';
    listEl.querySelectorAll('[data-d]').forEach(cb => cb.onchange = () => { cb.checked ? chosen.add(cb.dataset.d) : chosen.delete(cb.dataset.d); count(); });
    count();
  };
  const count = () => { document.getElementById('sp-count').textContent = chosen.size + ' selected'; };
  document.getElementById('sp-search').oninput = draw;
  document.getElementById('sp-all').onclick = () => { shown().forEach(d => chosen.add(d.id)); draw(); };
  document.getElementById('sp-none').onclick = () => { shown().forEach(d => chosen.delete(d.id)); draw(); };
  document.getElementById('sp-save').onclick = async () => {
    const add = [...chosen].filter(id => !original.has(id)).map(id => ({ drug_catalog_id: id, section_id: sectionId }));
    const del = [...original].filter(id => !chosen.has(id));
    const btn = document.getElementById('sp-save'); btn.disabled = true;
    if (add.length) { const { error } = await sb.from('drug_catalog_sections').insert(add); if (error) { document.getElementById('sp-error').textContent = error.message; btn.disabled = false; return; } }
    if (del.length) { const { error } = await sb.from('drug_catalog_sections').delete().eq('section_id', sectionId).in('drug_catalog_id', del); if (error) { document.getElementById('sp-error').textContent = error.message; btn.disabled = false; return; } }
    closeModal(); toast('Class updated.'); loadSectionList(); loadCatalogList();
  };
  draw();
}

// ---------- Multi-sheet import: each sheet is tagged with a class (section) ----------
let catalogFiles = [];     // { id, name, rows, header, nameCol, packCol, sectionId }
let catalogSections = [];
let catFileSeq = 0;
const catColLabel = (i, h) => String.fromCharCode(65 + (i % 26)) + (h ? ': ' + h : '');

async function addCatalogFiles(fileList) {
  const { data: secs } = await sb.from('drug_sections').select('id, name').order('name');
  catalogSections = secs || [];
  for (const file of Array.from(fileList || [])) {
    try {
      if (file.size > 5 * 1024 * 1024) { toast('That file is too large (limit 5 MB). Use a smaller spreadsheet.', true); return; }
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' })
        .filter(r => r.some(c => String(c).trim() !== ''));
      if (!rows.length) { toast(`${file.name} is empty.`, true); continue; }
      const first = rows[0].map(c => String(c).trim());
      const header = first.filter(c => c && isNaN(Number(c))).length >= Math.ceil(first.filter(Boolean).length / 2);
      const find = re => first.findIndex(c => re.test(c));
      // a sheet named like a class (e.g. "Injection.xlsx") pre-selects that class
      const base = file.name.replace(/\.[^.]+$/, '').toLowerCase();
      const guessSec = catalogSections.find(x => base.includes(x.name.toLowerCase()));
      catalogFiles.push({ id: ++catFileSeq, name: file.name, rows, header,
        nameCol: header ? find(/drug|medic|item|name|product|description/i) : 0,
        packCol: header ? find(/pack|size|form/i) : -1,
        sectionId: guessSec ? guessSec.id : '' });
    } catch (e) { toast(`Could not read ${file.name}: ${e.message}`, true); }
  }
  renderCatalogFiles();
}

function renderCatalogFiles() {
  const out = document.getElementById('csv-preview');
  if (!catalogFiles.length) { out.innerHTML = ''; return; }
  const secOpts = (sel) => `<option value="">— no class —</option>` + catalogSections.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  out.innerHTML = `
    ${catalogSections.length ? '' : '<p class="muted" style="margin-top:12px; color:var(--amber);">No classes exist yet. Create them under Classes above first, then drop the sheets again to tag them.</p>'}
    ${catalogFiles.map(f => {
      const ncol = Math.max(...f.rows.map(r => r.length));
      const head = f.rows[0].map(c => String(c).trim());
      const opt = (sel, req) => `<option value="-1">${req ? 'Choose a column…' : '— none —'}</option>` +
        Array.from({ length: ncol }, (_, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${esc(catColLabel(i, f.header ? head[i] : ''))}</option>`).join('');
      return `<div class="cat-file" data-f="${f.id}" style="border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:12px;">
        <div style="display:flex; align-items:center; gap:8px;"><b style="flex:1;">${esc(f.name)}</b><span class="muted" style="font-size:12.5px;">${f.rows.length} row${f.rows.length === 1 ? '' : 's'}</span>
          <button class="btn small ghost" data-rmfile="${f.id}" title="Remove this sheet">${uiIcon('x', 13)}</button></div>
        <div class="row" style="margin-top:8px;">
          <div><label>Class for this sheet</label><select data-k="sectionId">${secOpts(f.sectionId)}</select></div>
          <div><label>Drug name column</label><select data-k="nameCol">${opt(f.nameCol, true)}</select></div>
          <div><label>Pack size column <span class="muted" style="font-weight:400;">(optional)</span></label><select data-k="packCol">${opt(f.packCol, false)}</select></div>
        </div>
        <label style="display:flex; gap:6px; align-items:center; font-weight:400; margin-top:6px;"><input type="checkbox" data-k="header" style="width:auto;" ${f.header ? 'checked' : ''} /> First row is a heading row</label>
      </div>`;
    }).join('')}
    <label style="display:flex; gap:6px; align-items:center; font-weight:400; margin-top:12px;"><input type="checkbox" id="cat-tag-existing" style="width:auto;" checked /> Also tag drugs already in the catalogue with the sheet’s class</label>
    <label style="display:flex; gap:6px; align-items:center; font-weight:400; margin-top:4px;"><input type="checkbox" id="cat-upd" style="width:auto;" /> Also update the pack size of drugs already in the catalogue</label>
    <div id="cat-prev" style="margin-top:12px;"></div>`;
  out.querySelectorAll('.cat-file').forEach(card => {
    const f = catalogFiles.find(x => x.id === +card.dataset.f);
    card.querySelectorAll('[data-k]').forEach(el => el.onchange = () => {
      const k = el.dataset.k;
      f[k] = k === 'header' ? el.checked : (k === 'sectionId' ? el.value : parseInt(el.value, 10));
      renderCatalogPreview();
    });
    card.querySelector('[data-rmfile]').onclick = () => { catalogFiles = catalogFiles.filter(x => x.id !== f.id); renderCatalogFiles(); };
  });
  ['cat-tag-existing', 'cat-upd'].forEach(id => document.getElementById(id).onchange = renderCatalogPreview);
  renderCatalogPreview();
}

async function renderCatalogPreview() {
  const out = document.getElementById('cat-prev');
  if (!out) return;
  const secName = Object.fromEntries(catalogSections.map(x => [x.id, x.name]));
  // merge every sheet: one entry per drug, with the union of its classes
  const merged = new Map();
  let dupInFiles = 0, skippedNoCol = 0;
  for (const f of catalogFiles) {
    if (f.nameCol < 0) { skippedNoCol++; continue; }
    (f.header ? f.rows.slice(1) : f.rows).forEach(row => {
      const name = String(row[f.nameCol] ?? '').replace(/\s+/g, ' ').trim();
      if (!name) return;
      const pack = f.packCol >= 0 ? String(row[f.packCol] ?? '').trim() : '';
      const key = name.toLowerCase();
      const e = merged.get(key);
      if (e) { dupInFiles++; if (!e.pack_size && pack) e.pack_size = pack; if (f.sectionId) e.sections.add(f.sectionId); }
      else merged.set(key, { medicine_name: name, pack_size: pack || null, sections: new Set(f.sectionId ? [f.sectionId] : []) });
    });
  }
  const items = [...merged.values()];
  catalogPreview = items;
  if (!items.length) { out.innerHTML = `<p class="muted">${skippedNoCol ? 'Choose the drug name column for each sheet.' : 'No drug names found.'}</p>`; return; }
  const { data: existing } = await sb.from('drug_catalog').select('id, medicine_name, pack_size');
  const exMap = new Map((existing || []).map(r => [r.medicine_name.trim().toLowerCase(), r]));
  const tagExisting = document.getElementById('cat-tag-existing').checked;
  const updPack = document.getElementById('cat-upd').checked;
  const newOnes = items.filter(i => !exMap.has(i.medicine_name.toLowerCase()));
  const already = items.length - newOnes.length;
  const packUpdates = updPack ? items.filter(i => { const e = exMap.get(i.medicine_name.toLowerCase()); return e && i.pack_size && e.pack_size !== i.pack_size; }).map(i => ({ id: exMap.get(i.medicine_name.toLowerCase()).id, pack_size: i.pack_size })) : [];
  const tagLinks = [];   // { name(lower), sectionId }
  items.forEach(i => { const isNew = !exMap.has(i.medicine_name.toLowerCase()); if (isNew || tagExisting) i.sections.forEach(sid => tagLinks.push({ key: i.medicine_name.toLowerCase(), sectionId: sid })); });
  const untagged = newOnes.filter(i => !i.sections.size).length;
  out.innerHTML = `
    <p class="muted"><b>${items.length}</b> different drug${items.length === 1 ? '' : 's'} across ${catalogFiles.length} sheet${catalogFiles.length === 1 ? '' : 's'} — <b>${newOnes.length}</b> new, ${already} already in the catalogue${dupInFiles ? `, ${dupInFiles} repeated between rows or sheets (counted once)` : ''}. ${tagLinks.length} class tag${tagLinks.length === 1 ? '' : 's'} to apply${packUpdates.length ? `, ${packUpdates.length} pack size${packUpdates.length === 1 ? '' : 's'} to update` : ''}.${untagged ? ` <span style="color:var(--amber);">${untagged} new drug${untagged === 1 ? ' has' : 's have'} no class.</span>` : ''}</p>
    <table><thead><tr><th>Drug name</th><th>Pack size</th><th>Class</th><th></th></tr></thead><tbody>
    ${items.slice(0, 12).map(i => `<tr><td>${esc(i.medicine_name)}</td><td>${esc(i.pack_size || '')}</td><td>${esc([...i.sections].map(x => secName[x]).join(', ') || '—')}</td><td class="muted">${exMap.has(i.medicine_name.toLowerCase()) ? 'Already there' : 'New'}</td></tr>`).join('')}
    </tbody></table>${items.length > 12 ? `<p class="muted" style="font-size:12px;">Showing the first 12 of ${items.length}.</p>` : ''}
    <button class="btn magenta" id="confirm-catalog-import" style="margin-top:10px;" ${(newOnes.length || tagLinks.length || packUpdates.length) ? '' : 'disabled'}>Import ${newOnes.length} new drug${newOnes.length === 1 ? '' : 's'}${tagLinks.length ? ` and apply ${tagLinks.length} class tag${tagLinks.length === 1 ? '' : 's'}` : ''}</button>`;

  document.getElementById('confirm-catalog-import').onclick = async () => {
    const btn = document.getElementById('confirm-catalog-import'); btn.disabled = true;
    if (newOnes.length) {
      const { error } = await sb.from('drug_catalog').insert(newOnes.map(i => ({ medicine_name: i.medicine_name, pack_size: i.pack_size, created_by: profile.id })));
      if (error) { toast(error.message, true); btn.disabled = false; return; }
    }
    for (const u of packUpdates) await sb.from('drug_catalog').update({ pack_size: u.pack_size }).eq('id', u.id);
    if (tagLinks.length) {
      const { data: all } = await sb.from('drug_catalog').select('id, medicine_name');
      const idBy = new Map((all || []).map(r => [r.medicine_name.trim().toLowerCase(), r.id]));
      const rows = tagLinks.map(t => ({ drug_catalog_id: idBy.get(t.key), section_id: t.sectionId })).filter(r => r.drug_catalog_id);
      const { error } = await sb.from('drug_catalog_sections').upsert(rows, { onConflict: 'drug_catalog_id,section_id', ignoreDuplicates: true });
      if (error) { toast(error.message, true); btn.disabled = false; return; }
    }
    toast(`${newOnes.length} new drug${newOnes.length === 1 ? '' : 's'} imported${tagLinks.length ? `, ${tagLinks.length} class tag${tagLinks.length === 1 ? '' : 's'} applied` : ''}.`);
    catalogFiles = []; catalogPreview = [];
    document.getElementById('csv-preview').innerHTML = '';
    loadCatalogList(); loadSectionList();
  };
}

const selectedDrugs = new Set();
async function loadCatalogList() {
  const el = document.getElementById('catalog-list');
  const { data, error } = await sb.from('drug_catalog').select('*').order('medicine_name');
  if (error) { el.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!data?.length) { el.innerHTML = `<div class="empty">Catalog is empty \u2014 import a spreadsheet or add drugs above.</div>`; return; }

  const { data: sections } = await sb.from('drug_sections').select('*').order('name');
  const { data: links } = await sb.from('drug_catalog_sections').select('*');
  const secName = Object.fromEntries((sections || []).map(x => [x.id, x.name]));
  const tagsByDrug = {};
  (links || []).forEach(l => { (tagsByDrug[l.drug_catalog_id] ??= []).push(l.section_id); });

  const q = (document.getElementById('cat-search')?.value || '').trim().toLowerCase();
  const cf = document.getElementById('cat-class-filter')?.value || '';
  const shown = data.filter(d => (!q || d.medicine_name.toLowerCase().includes(q)) &&
    (!cf || (cf === 'restricted' ? d.restricted : cf === 'none' ? !(tagsByDrug[d.id] || []).length : (tagsByDrug[d.id] || []).includes(cf))));
  const allShownTicked = shown.length > 0 && shown.every(d => selectedDrugs.has(d.id));
  const nSel = selectedDrugs.size;

  el.innerHTML = `<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
      <input type="text" id="cat-search" placeholder="Search the catalogue\u2026" value="${esc(q)}" style="max-width:260px;" />
      <select id="cat-class-filter" style="max-width:220px;"><option value="">All classes</option>
        ${(sections || []).map(x => `<option value="${x.id}" ${cf === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}<option value="none" ${cf === 'none' ? 'selected' : ''}>No class</option><option value="restricted" ${cf === 'restricted' ? 'selected' : ''}>Restricted only</option></select>
      <span class="muted" style="font-size:12.5px;">${shown.length} of ${data.length} drug${data.length === 1 ? '' : 's'}</span></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; padding:8px 10px; background:var(--teal-pale); border-radius:8px;">
      <b style="font-size:13px;">${nSel} selected</b>
      <button class="btn small" id="cat-tag-restricted" ${nSel ? '' : 'disabled'}>Tag as restricted</button>
      <button class="btn small ghost" id="cat-untag-restricted" ${nSel ? '' : 'disabled'}>Remove restricted tag</button>
      <button class="btn small" id="cat-tag-emerg" ${nSel ? '' : 'disabled'}>Mark emergency stock</button>
      <button class="btn small ghost" id="cat-untag-emerg" ${nSel ? '' : 'disabled'}>Unmark emergency stock</button>
      <button class="btn small ghost" id="cat-clear-sel" ${nSel ? '' : 'disabled'}>Clear selection</button>
      <span class="muted" style="font-size:12px; margin-left:auto;">Restricted drugs ordered again by the same ward within ${esc(systemSettings.reorder_approval_window_hours || '24')} hours need approval \u2014 currently <b>${restrictedReorderOn() ? 'ON' : 'OFF'}</b> (the Developer switches this in System settings).</span>
    </div>
    <table><thead><tr><th style="width:28px;"><input type="checkbox" id="cat-all" style="width:auto;" ${allShownTicked ? 'checked' : ''} title="Tick every drug shown" /></th><th>Medicine</th><th class="muted">Pack size</th><th>Class</th><th></th></tr></thead><tbody>
    ${shown.map(d => `<tr style="${d.hidden ? 'opacity:.6;' : ''}">
      <td><input type="checkbox" class="cat-sel" data-id="${d.id}" style="width:auto;" ${selectedDrugs.has(d.id) ? 'checked' : ''} /></td>
      <td>${esc(d.medicine_name)}${d.restricted ? ' <span class="capsule" style="margin-left:4px;">Restricted</span>' : ''}${d.emergency_stock ? ' <span class="capsule" style="margin-left:4px;">Emergency stock</span>' : ''}${d.hidden ? ' <span class="muted" style="font-size:12px;">(hidden)</span>' : ''}</td>
      <td class="muted">${esc(d.pack_size || '\u2014')}</td>
      <td>${(tagsByDrug[d.id] || []).map(id => `<span class="capsule" style="margin-right:4px;">${esc(secName[id] || '')}</span>`).join('') || '<span class="muted">\u2014</span>'}</td>
      <td style="text-align:right; white-space:nowrap;"><button class="btn small" data-hide="${d.id}" data-to="${d.hidden ? 'false' : 'true'}">${d.hidden ? 'Unhide' : 'Hide'}</button>${isDeveloper() ? ` <button class="btn small danger" data-delete="${d.id}" data-name="${esc(d.medicine_name)}">Remove</button>` : ''}</td>
    </tr>`).join('')}
  </tbody></table>${!shown.length ? '<div class="empty">No drugs match.</div>' : ''}`;
  const reload = () => { const cs = document.getElementById('cat-search'); const pos = cs.selectionStart; loadCatalogList().then(() => { const n = document.getElementById('cat-search'); n.focus(); n.setSelectionRange(pos, pos); }); };
  document.getElementById('cat-search').oninput = reload;
  document.getElementById('cat-class-filter').onchange = () => loadCatalogList();
  el.querySelectorAll('.cat-sel').forEach(cb => cb.onchange = () => {
    if (cb.checked) selectedDrugs.add(cb.dataset.id); else selectedDrugs.delete(cb.dataset.id);
    loadCatalogList();
  });
  document.getElementById('cat-all').onchange = (e) => {
    shown.forEach(x => { if (e.target.checked) selectedDrugs.add(x.id); else selectedDrugs.delete(x.id); });
    loadCatalogList();
  };
  document.getElementById('cat-clear-sel').onclick = () => { selectedDrugs.clear(); loadCatalogList(); };
  const tagSelected = async (value) => {
    const ids = [...selectedDrugs];
    if (!ids.length) return;
    const { error: e } = await sb.from('drug_catalog').update({ restricted: value }).in('id', ids);
    if (e) return toast(e.message, true);
    ids.forEach(id => { const row = data.find(x => x.id === id); if (row) { if (value) restrictedDrugs.add(row.medicine_name); else restrictedDrugs.delete(row.medicine_name); } });
    toast(value ? `${ids.length} drug${ids.length === 1 ? '' : 's'} tagged as restricted.` : `Restricted tag removed from ${ids.length} drug${ids.length === 1 ? '' : 's'}.`);
    selectedDrugs.clear();
    loadCatalogList();
  };
  document.getElementById('cat-tag-restricted').onclick = () => tagSelected(true);
  document.getElementById('cat-untag-restricted').onclick = () => tagSelected(false);
  const emergSelected = async (value) => {
    const ids = [...selectedDrugs]; if (!ids.length) return;
    const { error: e } = await sb.from('drug_catalog').update({ emergency_stock: value }).in('id', ids);
    if (e) return toast(e.message, true);
    ids.forEach(id => { const row = data.find(x => x.id === id); if (row) row.emergency_stock = value; });
    toast(value ? `${ids.length} marked as emergency stock.` : `${ids.length} no longer marked as emergency stock.`);
    render();
  };
  document.getElementById('cat-tag-emerg').onclick = () => emergSelected(true);
  document.getElementById('cat-untag-emerg').onclick = () => emergSelected(false);

  el.querySelectorAll('[data-hide]').forEach(b => b.onclick = async () => {
    const { error: e } = await sb.rpc('set_drug_hidden', { p_id: b.dataset.hide, p_hidden: b.dataset.to === 'true' });
    if (e) return toast(e.message, true);
    toast(b.dataset.to === 'true' ? 'Hidden from ordering and stocklist building.' : 'Visible again.');
    loadCatalogList();
  });

  if (isDeveloper()) {
    el.querySelectorAll('[data-delete]').forEach(b => b.onclick = () => {
      confirmDialog('Remove from catalog?', `"${esc(b.dataset.name)}" will no longer appear as an option when building ward stocklists. Wards that already stock it are unaffected.`, 'Remove', async () => {
        const { error: e } = await sb.from('drug_catalog').delete().eq('id', b.dataset.delete);
        if (e) return toast(e.message, true);
        toast('Removed from catalog.');
        loadCatalogList();
      }, true);
    });
  }
}

(async () => {
  const p = await requireAuth({ require: () => canManageCatalogue() });
  if (!p) return;
  document.getElementById('main').innerHTML = '<div id="body"></div>';
  await renderDrugCatalog();
  if (!alternativesEnabled()) [...document.querySelectorAll('#body .card')].find(c => /^Substitution groups/.test(c.querySelector('h2')?.textContent.trim() || ''))?.remove();
})();
</script>
</body>
