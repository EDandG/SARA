<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Req — System settings</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="shared.css" />
</head>
<body data-page="system-settings.html">
<div id="app">
<header class="topbar">
    <div class="brand">
      
      <div>
        <div class="name">Stock Req</div>
        <div class="sub" data-ward-context></div>
      </div>
    </div>
    <div class="who">
      <span data-who-name></span>
      <button class="logout" data-logout>Log out</button>
    </div>
  </header>
  <div id="banner-root"></div>
  <div id="page-nav" class="tabs"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="shared.js"></script>
<script>function fixSvgMime(dataUrl, file) {
  // Some browsers report an empty type for .svg files; make sure it's tagged as SVG.
  if (/\.svg$/i.test(file.name) && !dataUrl.startsWith('data:image/svg+xml')) {
    return dataUrl.replace(/^data:[^;,]*/, 'data:image/svg+xml');
  }
  return dataUrl;
}

async function renderSystemSettings() {
  const body = document.getElementById('body');
  body.innerHTML = `
    <div class="card">
      <h2>Processing cutoff times</h2>
      <p class="muted">Adhoc orders placed before the cutoff are due same working day (green); after it, due the next working day (amber). Weekends and bank holidays always use the weekend/holiday cutoff.</p>
      <div class="row">
        <div><label>Weekdays (Mon\u2013Fri)</label><input type="time" id="cutoff-weekday" value="${processingCutoffs.weekday}" /></div>
        <div><label>Weekends &amp; bank holidays</label><input type="time" id="cutoff-weekend" value="${processingCutoffs.weekend_or_holiday}" /></div>
      </div>
      <button class="btn magenta" style="margin-top:14px;" id="save-cutoffs">Save cutoff times</button>
    </div>
    ${isDeveloper() ? `
    <div class="card">
      <h2>Top-up countdown window</h2>
      <p class="muted">Developer-only. Controls when the top-up reminder banner and countdown appear on a ward's ordering page the day before its top-up day.</p>
      <div class="row">
        <div><label>Window start</label><input type="time" id="topup-start" value="${systemSettings.topup_window_start}" /></div>
        <div><label>Window end</label><input type="time" id="topup-end" value="${systemSettings.topup_window_end}" /></div>
      </div>
      <button class="btn magenta" style="margin-top:14px;" id="save-topup-window">Save top-up window</button>
    </div>` : `
    <div class="card"><p class="muted">The top-up countdown window is Developer-only.</p></div>`}
    <div class="card">
      <h2>Duplicate-order warning window</h2>
      <p class="muted">How far back a ward checks for a recent matching order before warning "already ordered" — and how far back processing checks before allowing an item to be marked duplicate. Developer and Superuser can both set this.</p>
      <label>Window (hours)</label>
      <input type="number" min="1" id="dup-window" value="${systemSettings.duplicate_window_hours || '48'}" style="max-width:120px;" />
      <button class="btn magenta" style="margin-top:14px;" id="save-dup-window">Save duplicate window</button>
    </div>
    <div class="card">
      <h2>Inactivity sign-out</h2>
      <p class="muted">Signs people out after this many minutes with no activity, with a one-minute warning. Unsent adhoc orders are kept on the device. Set 0 to turn it off.</p>
      <label>Minutes</label>
      <input type="number" min="0" id="idle-minutes" value="${systemSettings.idle_timeout_minutes ?? '30'}" style="max-width:120px;" />
      <button class="btn magenta" style="margin-top:14px;" id="save-idle">Save inactivity sign-out</button>
    </div>
    <div class="card">
      <h2>Order history window</h2>
      <p class="muted">How far back a ward's order history shows, everywhere it's displayed. Developer and Superuser can both set this.</p>
      <label>Window (days)</label>
      <input type="number" min="1" id="history-window" value="${systemSettings.order_history_days || '7'}" style="max-width:120px;" />
      <button class="btn magenta" style="margin-top:14px;" id="save-history-window">Save order history window</button>
    </div>
    ${isDeveloper() ? `<div class="card">
      <h2>Paid features</h2>
      <p class="muted">These are separate paid modules. Each stays off and hidden from everyone \u2014 including Superusers \u2014 until you switch it on here. Only the Developer sees this card. ED&G™ Business Intelligence Suite additionally still needs the per-user BI tickbox.</p>
      <label style="display:flex; align-items:flex-start; gap:8px; font-weight:400; margin-top:8px;"><input type="checkbox" id="feat-insights" style="width:auto; margin-top:3px;" ${insightsEnabled() ? 'checked' : ''} /><span><b>Insights</b><br><span class="muted" style="font-size:12.5px;">Orders due today and percentage processed</span> <a href="insights.html" style="font-size:12.5px; margin-left:6px;">Where it appears</a></span></label>
      <label style="display:flex; align-items:flex-start; gap:8px; font-weight:400; margin-top:8px;"><input type="checkbox" id="feat-bi" style="width:auto; margin-top:3px;" ${biEnabled() ? 'checked' : ''} /><span><b>ED&G™ Business Intelligence Suite</b><br><span class="muted" style="font-size:12.5px;">Analytics, item usage and predictive top-up reporting</span> <a href="bi-analytics.html" style="font-size:12.5px; margin-left:6px;">Where it appears</a></span></label>
      <label style="display:flex; align-items:flex-start; gap:8px; font-weight:400; margin-top:8px;"><input type="checkbox" id="feat-abovemax" style="width:auto; margin-top:3px;" ${aboveMaxEnabled() ? 'checked' : ''} /><span><b>Above-max ordering</b><br><span class="muted" style="font-size:12.5px;">Wards can order above stocklist max, with the approval step</span> <a href="approvals.html" style="font-size:12.5px; margin-left:6px;">Where it appears</a></span></label>
      <label style="display:flex; align-items:flex-start; gap:8px; font-weight:400; margin-top:8px;"><input type="checkbox" id="feat-alternatives" style="width:auto; margin-top:3px;" ${alternativesEnabled() ? 'checked' : ''} /><span><b>Send alternative</b><br><span class="muted" style="font-size:12.5px;">Processors can send a different pack/strength from a substitution group</span> <a href="sessions.html" style="font-size:12.5px; margin-left:6px;">Where it appears</a></span></label>
      <label style="display:flex; align-items:flex-start; gap:8px; font-weight:400; margin-top:8px;"><input type="checkbox" id="feat-checking" style="width:auto; margin-top:3px;" ${checkingEnabled() ? 'checked' : ''} /><span><b>Second-person checking</b><br><span class="muted" style="font-size:12.5px;">Independent check of picked requests before they are complete</span> <a href="sessions.html#awaiting-check" style="font-size:12.5px; margin-left:6px;">Where it appears</a></span></label>
      <label style="display:flex; align-items:flex-start; gap:8px; font-weight:400; margin-top:8px;"><input type="checkbox" id="feat-reminders" style="width:auto; margin-top:3px;" ${remindersEnabled() ? 'checked' : ''} /><span><b>Ward reminders and countdowns</b><br><span class="muted" style="font-size:12.5px;">Top-up countdown banner and overdue top-up prompts on the ordering page</span> <a href="order.html" style="font-size:12.5px; margin-left:6px;">Where it appears</a></span></label>
      <label style="display:flex; align-items:flex-start; gap:8px; font-weight:400; margin-top:8px;"><input type="checkbox" id="feat-predictive" style="width:auto; margin-top:3px;" ${predictiveEnabled() ? 'checked' : ''} /><span><b>Predictive ordering</b><br><span class="muted" style="font-size:12.5px;">"Add your usual top-up items" suggestions for wards</span> <a href="bi-predictive.html" style="font-size:12.5px; margin-left:6px;">Where it appears</a></span></label>
    </div>` : ''}
    ${isDeveloper() ? `<div class="card" id="backup-card">
      <h2>Stocklist backup by email</h2>
      <p class="muted">Emails an Excel copy of every ward\u2019s stocklist at the interval you choose, so a stocklist can be restored from the Stocklists page if anything goes wrong. The file holds drug names and quantities only \u2014 no patient information. Developer only.</p>
      <label style="display:flex; align-items:center; gap:8px; font-weight:400;"><input type="checkbox" id="bk-enabled" style="width:auto;" />Send backups automatically</label>
      <div class="row" style="margin-top:10px;">
        <div><label for="bk-interval">Send every</label>
          <select id="bk-interval">${[1,2,3,4,6,8,12,24,48,168].map(h => `<option value="${h}">${h === 168 ? 'week' : h === 48 ? '2 days' : h === 24 ? 'day' : h + ' hour' + (h > 1 ? 's' : '')}</option>`).join('')}</select></div>
        <div style="flex:2;"><label for="bk-recipients">Send to (up to 5 email addresses, separated by commas)</label>
          <input id="bk-recipients" placeholder="name@example.com, name2@example.com" /></div>
      </div>
      <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn small" id="bk-save">Save</button>
        <button class="btn ghost small" id="bk-now">Send a backup now</button>
      </div>
      <p class="muted" id="bk-status" style="margin-top:8px;">Loading\u2026</p>
    </div>` : ''}
    <div class="card">
      <h2>Second-person picking check</h2>
      <p class="muted">When on, a picked request must be checked by a different person (someone with the check permission) before it counts as complete. When off, a request is complete as soon as the picker confirms it, and the record shows the check was not required. Developer and Superuser can both set this.</p>
      <label style="display:flex; align-items:center; gap:8px; font-weight:400;"><input type="checkbox" id="check-toggle" style="width:auto;" ${pickingCheckRequired() ? 'checked' : ''} />Require a second-person check</label>
      <div id="nocheck-wrap" style="margin-top:12px;${pickingCheckRequired() ? ' display:none;' : ''}">
        <label for="nocheck-label">Wording shown in the audit trail while the check is off</label>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <input id="nocheck-label" maxlength="30" style="max-width:220px;" value="${esc(noCheckLabel())}" />
          <button class="btn small" id="nocheck-save">Save wording</button>
        </div>
        <p class="muted" style="margin-top:6px;">Appears as \u201c<b>Processed</b> by Sam on 14 Oct\u201d. Use a past-tense word, e.g. Processed, Completed or Supplied. With the check on, the trail reads \u201cProcessed by Sam on 14 Oct, checked by Alex on 14 Oct\u201d.</p>
      </div>
    </div>
    <div class="card">
      <h2>Overdue top-up preview &amp; prefill</h2>
      <p class="muted">When a ward's top-up is due and wasn't submitted on time, this lets processing staff preview what a full top-up would look like (every stocklist item at max quantity), and lets whoever has ordering access to that ward pull that same list into a real order to submit. Nothing is auto-created — this only controls whether the option appears. Developer and Superuser can both set this.</p>
      <label style="display:flex; align-items:center; gap:8px; font-weight:400;"><input type="checkbox" id="overdue-toggle" style="width:auto;" ${systemSettings.overdue_topup_preview_enabled === 'true' ? 'checked' : ''} />Enabled</label>
    </div>
    <div class="card">
      <h2>Trust logo</h2>
      <p class="muted">Shown at the top of the printable PDF stocklist export. Upload a small image (SVG, PNG or JPG) \u2014 it's stored directly, no separate file hosting needed.</p>
      ${systemSettings.trust_logo_data_url ? `<img src="${systemSettings.trust_logo_data_url}" alt="Current trust logo" style="max-height:70px; max-width:220px; display:block; margin-bottom:10px; border:1px solid var(--border); border-radius:6px; padding:6px;" />` : `<p class="muted" style="font-size:11.5px;">No logo set yet.</p>`}
      <input type="file" id="logo-input" accept="image/png,image/jpeg,image/svg+xml,.svg" class="hidden" />
      <button class="btn ghost small" id="logo-choose-btn">Choose image\u2026</button>
      ${systemSettings.trust_logo_data_url ? `<button class="btn ghost small" id="logo-remove-btn">Remove logo</button>` : ''}
    </div>
    ${isDeveloper() ? `<div class="card">
      <h2>Login screen logo</h2>
      <p class="muted">Shown above the Stock Req title on the sign-in page. Developer only. Upload a small image (SVG, PNG or JPG, under 1MB).</p>
      ${systemSettings.login_logo_data_url ? `<img src="${systemSettings.login_logo_data_url}" alt="Current login logo" style="max-height:90px; max-width:260px; display:block; margin-bottom:10px; border:1px solid var(--border); border-radius:6px; padding:6px;" />` : `<p class="muted" style="font-size:11.5px;">No login logo set yet.</p>`}
      <input type="file" id="login-logo-input" accept="image/png,image/jpeg,image/svg+xml,.svg" class="hidden" />
      <button class="btn ghost small" id="login-logo-choose-btn">Choose image\u2026</button>
      ${systemSettings.login_logo_data_url ? `<button class="btn ghost small" id="login-logo-remove-btn">Remove logo</button>` : ''}
    </div>` : ''}
  `;
  applySubtabs(body, [
    { id: 'processing', label: 'Processing & timing', heads: ['Processing cutoff', 'Top-up countdown', 'Inactivity', 'Duplicate-order', 'Order history', 'Overdue top-up'] },
    { id: 'checks', label: 'Picking check', heads: ['Second-person'] },
    { id: 'backup', label: 'Backups', heads: ['Stocklist backup'] },
    { id: 'branding', label: 'Logos & branding', heads: ['Trust logo', 'Login screen logo'] },
    { id: 'features', label: 'Paid features', heads: ['Paid features'] },
  ]);

  document.getElementById('save-cutoffs').onclick = async () => {
    const weekday = document.getElementById('cutoff-weekday').value;
    const weekend = document.getElementById('cutoff-weekend').value;
    if (!weekday || !weekend) return toast('Both cutoff times are required.', true);
    const { error: e1 } = await sb.from('processing_cutoffs').update({ cutoff_time: weekday }).eq('day_type', 'weekday');
    const { error: e2 } = await sb.from('processing_cutoffs').update({ cutoff_time: weekend }).eq('day_type', 'weekend_or_holiday');
    if (e1 || e2) return toast((e1 || e2).message, true);
    processingCutoffs.weekday = weekday;
    processingCutoffs.weekend_or_holiday = weekend;
    toast('Cutoff times updated.');
  };

  document.getElementById('save-dup-window').onclick = async () => {
    const hours = parseInt(document.getElementById('dup-window').value, 10);
    if (!hours || hours < 1) return toast('Enter a window of at least 1 hour.', true);
    const { error } = await sb.from('system_settings').update({ value: String(hours) }).eq('key', 'duplicate_window_hours');
    if (error) return toast(error.message, true);
    systemSettings.duplicate_window_hours = String(hours);
    toast('Duplicate-order window updated.');
  };

  document.getElementById('save-idle').onclick = async () => {
    const m = parseInt(document.getElementById('idle-minutes').value, 10);
    if (isNaN(m) || m < 0) return toast('Enter 0 or a number of minutes.', true);
    const { error } = await sb.from('system_settings').upsert({ key: 'idle_timeout_minutes', value: String(m) }, { onConflict: 'key' });
    if (error) return toast(error.message, true);
    systemSettings.idle_timeout_minutes = String(m);
    toast(m ? `Signing out after ${m} minutes of inactivity.` : 'Inactivity sign-out turned off.');
  };
  document.getElementById('save-history-window').onclick = async () => {
    const days = parseInt(document.getElementById('history-window').value, 10);
    if (!days || days < 1) return toast('Enter a window of at least 1 day.', true);
    const { error } = await sb.from('system_settings').update({ value: String(days) }).eq('key', 'order_history_days');
    if (error) return toast(error.message, true);
    systemSettings.order_history_days = String(days);
    toast('Order history window updated.');
  };

  document.getElementById('overdue-toggle').onchange = async (e) => {
    const enabled = e.target.checked;
    const { error } = await sb.from('system_settings').update({ value: String(enabled) }).eq('key', 'overdue_topup_preview_enabled');
    if (error) { toast(error.message, true); e.target.checked = !enabled; return; }
    systemSettings.overdue_topup_preview_enabled = String(enabled);
    toast(enabled ? 'Overdue top-up preview enabled.' : 'Overdue top-up preview disabled.');
  };

  [['feat-insights', 'feature_insights_enabled', 'Insights'], ['feat-bi', 'feature_bi_enabled', 'ED&G™ Business Intelligence Suite'],
   ['feat-abovemax', 'feature_abovemax_enabled', 'Above-max ordering'], ['feat-alternatives', 'feature_alternatives_enabled', 'Send alternative'],
   ['feat-checking', 'feature_checking_enabled', 'Second-person checking'], ['feat-reminders', 'feature_reminders_enabled', 'Ward reminders and countdowns'],
   ['feat-predictive', 'feature_predictive_enabled', 'Predictive ordering']].forEach(([id, key, label]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.onchange = async (e) => {
      const on = e.target.checked;
      const { error } = await sb.from('system_settings').upsert({ key, value: String(on) }, { onConflict: 'key' });
      if (error) { toast(error.message, true); e.target.checked = !on; return; }
      systemSettings[key] = String(on);
      if (key === 'feature_checking_enabled' && !on) await sb.rpc('set_picking_check_required', { p_required: false }); // waive anything awaiting a check
      toast(`${label} ${on ? 'switched on' : 'switched off'}.${key === 'feature_checking_enabled' && !on ? ' Anything awaiting a check was released.' : ''}`);
    };
  });


  // ---- stocklist backup (Developer only) ----
  if (document.getElementById('backup-card')) {
    const showBk = async () => {
      const { data: c, error } = await sb.from('backup_config').select('*').eq('id', 1).single();
      const st = document.getElementById('bk-status');
      if (error || !c) { st.textContent = 'Could not load backup settings \u2014 has the latest schema.sql been run?'; return; }
      document.getElementById('bk-enabled').checked = !!c.enabled;
      document.getElementById('bk-interval').value = String(c.interval_hours);
      document.getElementById('bk-recipients').value = (c.recipients || []).join(', ');
      st.textContent = `${c.last_sent_at ? 'Last backup sent ' + fmtDate(c.last_sent_at) + '. ' : 'No backup sent yet. '}${c.last_status || ''}`;
    };
    document.getElementById('bk-save').onclick = async () => {
      const list = document.getElementById('bk-recipients').value.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
      const bad = list.find(x => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));
      if (bad) return toast(`\u201c${bad}\u201d is not a valid email address.`, true);
      if (list.length > 5) return toast('Up to 5 recipients.', true);
      const enabled = document.getElementById('bk-enabled').checked;
      if (enabled && !list.length) return toast('Add at least one recipient before switching backups on.', true);
      const { error } = await sb.from('backup_config').update({ enabled, interval_hours: parseInt(document.getElementById('bk-interval').value, 10), recipients: [...new Set(list)] }).eq('id', 1);
      if (error) return toast(error.message, true);
      toast('Backup settings saved.'); showBk();
    };
    document.getElementById('bk-now').onclick = async () => {
      const btn = document.getElementById('bk-now'); btn.disabled = true; btn.textContent = 'Sending\u2026';
      try {
        const { data: { session: ss } } = await sb.auth.getSession();
        const res = await fetch(`${FN_BASE}/backup-stocklists`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ss.access_token}` }, body: JSON.stringify({ force: true }) });
        let out = {}; try { out = await res.json(); } catch (e) {}
        if (!res.ok) throw new Error(out.error || 'Backup failed');
        toast(`Backup sent \u2014 ${out.wards} wards, ${out.lines} lines.`);
      } catch (e) { toast(e.message, true); }
      btn.disabled = false; btn.textContent = 'Send a backup now'; showBk();
    };
    showBk();
  }

  document.getElementById('check-toggle').onchange = async (e) => {
    const required = e.target.checked;
    if (!required && !confirm('Turn the second-person check off?\n\nRequests picked from now on will complete as soon as they are confirmed. Any request currently waiting for a check will also be marked complete (check not required).')) {
      e.target.checked = true; return;
    }
    const { data: waived, error } = await sb.rpc('set_picking_check_required', { p_required: required });
    if (error) { toast(error.message, true); e.target.checked = !required; return; }
    systemSettings.picking_check_required = String(required);
    const nw = document.getElementById('nocheck-wrap'); if (nw) nw.style.display = required ? 'none' : '';
    toast(required ? 'Second-person check switched on.' : `Second-person check switched off${waived ? ` (${waived} waiting request${waived > 1 ? 's' : ''} completed)` : ''}.`);
  };

  document.getElementById('nocheck-save').onclick = async () => {
    const v = document.getElementById('nocheck-label').value.trim();
    if (!v || v.length > 30) return toast('Enter a word or short phrase (up to 30 characters).', true);
    const { error } = await sb.from('system_settings').upsert({ key: 'no_check_label', value: v });
    if (error) return toast(error.message, true);
    systemSettings.no_check_label = v;
    toast('Wording saved.');
  };

  const topupBtn = document.getElementById('save-topup-window');
  if (topupBtn) {
    topupBtn.onclick = async () => {
      const start = document.getElementById('topup-start').value;
      const end = document.getElementById('topup-end').value;
      if (!start || !end) return toast('Both window times are required.', true);
      const { error: e1 } = await sb.from('system_settings').update({ value: start }).eq('key', 'topup_window_start');
      const { error: e2 } = await sb.from('system_settings').update({ value: end }).eq('key', 'topup_window_end');
      if (e1 || e2) return toast((e1 || e2).message, true);
      systemSettings.topup_window_start = start;
      systemSettings.topup_window_end = end;
      toast('Top-up window updated.');
    };
  }

  document.getElementById('logo-choose-btn').onclick = () => document.getElementById('logo-input').click();
  document.getElementById('logo-input').onchange = async () => {
    const file = document.getElementById('logo-input').files[0];
    if (!file) return;
    if (file.size > 1024 * 1024) return toast('Please choose an image under 1MB.', true);
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(fixSvgMime(reader.result, file));
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const { error } = await sb.from('system_settings').upsert({ key: 'trust_logo_data_url', value: dataUrl }, { onConflict: 'key' });
    if (error) return toast(error.message, true);
    systemSettings.trust_logo_data_url = dataUrl;
    toast('Trust logo updated.');
    renderSystemSettings();
  };

  const logoRemoveBtn = document.getElementById('logo-remove-btn');
  if (logoRemoveBtn) {
    logoRemoveBtn.onclick = async () => {
      const { error } = await sb.from('system_settings').upsert({ key: 'trust_logo_data_url', value: '' }, { onConflict: 'key' });
      if (error) return toast(error.message, true);
      systemSettings.trust_logo_data_url = '';
      toast('Trust logo removed.');
      renderSystemSettings();
    };
  }

  const llChoose = document.getElementById('login-logo-choose-btn');
  if (llChoose) {
    llChoose.onclick = () => document.getElementById('login-logo-input').click();
    document.getElementById('login-logo-input').onchange = async () => {
      const file = document.getElementById('login-logo-input').files[0];
      if (!file) return;
      if (file.size > 1024 * 1024) return toast('Please choose an image under 1MB.', true);
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(fixSvgMime(reader.result, file));
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const { error } = await sb.from('system_settings').upsert({ key: 'login_logo_data_url', value: dataUrl }, { onConflict: 'key' });
      if (error) return toast(error.message, true);
      systemSettings.login_logo_data_url = dataUrl;
      try { localStorage.setItem('login_logo_cache', dataUrl); } catch (e) {}
      toast('Login logo updated.');
      renderSystemSettings();
    };
  }
  const llRemove = document.getElementById('login-logo-remove-btn');
  if (llRemove) {
    llRemove.onclick = async () => {
      const { error } = await sb.from('system_settings').upsert({ key: 'login_logo_data_url', value: '' }, { onConflict: 'key' });
      if (error) return toast(error.message, true);
      systemSettings.login_logo_data_url = '';
      try { localStorage.removeItem('login_logo_cache'); } catch (e) {}
      toast('Login logo removed.');
      renderSystemSettings();
    };
  }
}

(async () => {
  const p = await requireAuth({ require: (pr) => ['developer', 'superuser'].includes(pr.role) });
  if (!p) return;
  document.getElementById('main').innerHTML = '<div id="body"></div>';
  renderSystemSettings();
})();
</script>
</body>
</html>
